<!DOCTYPE html>
<!--
  ARMADA spyglass — per-run operations dashboard (the view).
  Self-contained, no server, no external/CDN libraries, no build step. Polls the
  sibling run-state.json written by spyglass-run-snapshot.mjs and renders each
  in-flight run as a VOYAGE: a ship sailing ARMADA's real armada:* pipeline from
  harbour to port, with live-ticking elapsed, real per-model cost, and the run's
  branch / worktree / folder / logbook "done video".

  ARMADA / nautical themed to match the spyglass sea-chart identity: brass + wood +
  deep-sea palette, a serif ARMADA wordmark, vessel iconography per run, a voyage
  metaphor for the pipeline, and subtle sea swell + bob motion (reduced-motion safe).

  READ-ONLY: it renders a snapshot. It never talks to GitHub or mutates anything —
  the cost/metadata it shows is produced crows-nest-side (crows-nest §8g) and read
  here. The foghorn chime is OFF by default (an opt-in toggle).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARMADA — the lookout's dashboard</title>
<style>
  :root {
    /* deep sea */
    --abyss: #07131f;
    --sea-deep: #0a1d30;
    --sea: #0e3050;
    /* wood + panels */
    --wood: #14263a;
    --wood-2: #182d43;
    --wood-edge: #26405b;
    --wood-edge-2: #33506e;
    /* brass */
    --brass: #c6a86a;
    --brass-bright: #e6c886;
    --brass-dim: #8a7647;
    /* parchment ink */
    --parch: #ece3cd;
    --ink: #dfe6ee;
    --ink-dim: #a4b6c7;
    --ink-faint: #6d8498;
    /* fleet states (colour-blind-safe hues; never colour alone — shape+label too) */
    --queued: #7fb8e6;
    --building: #56b4e9;
    --review: #cf8fbe;
    --awaiting: #e6a93c;
    --done: #37b58c;
    --blocked: #e0563f;
    --line: #21374e;
    --chip: #122234;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    background:
      radial-gradient(1200px 520px at 22% -8%, #123a5c 0%, rgba(18,58,92,0) 60%),
      linear-gradient(180deg, var(--sea-deep) 0%, var(--abyss) 62%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .page { max-width: 1200px; margin: 0 auto; padding: 0 18px 72px; position: relative; z-index: 1; }
  /* KANBAN board view (#175): let the board breathe to the stream's full width so all
     seven stage lanes fit through Shipped without horizontal scroll. The list view keeps
     its calmer 1200px measure; only the board — which lays seven lanes side-by-side beside
     the 236px git-tree column — reclaims the extra width. */
  body.vb-board .page { max-width: 1480px; }

  /* ---------- fleet-busyness ambient "visual tempo" (#179) ----------
     An ever-present, board-wide sense of life whose tempo + intensity track the fleet's
     live busyness: a slow, faint sea-glow that breathes across the whole viewport when the
     fleet is idle, growing quicker and more present as more runs go in flight. It is a
     single fixed, inert (pointer-events:none), GPU-composited layer BEHIND all content
     (z-index:0; .page sits at z-index:1). Everything reactive is driven by three CSS custom
     properties set once per render from the busyness signal (setAmbientTempo()):
       --amb-tempo : the breathe animation-duration (slow when calm, quick when busy)
       --amb-peak  : the glow's peak alpha (faint when calm, livelier when busy)
       --amb-hue   : sea-blue normally, shifting warm toward the storm tone when runs block
     Deterministic: the values are a pure function of the live counts — no per-frame
     Math.random churn — and the per-frame work is a composited opacity+scale the browser
     runs on its own. Under prefers-reduced-motion it is pinned to a faint STATIC tint with
     no motion at all (a true no-op), below. READ-ONLY — a pure ambient view. */
  :root { --amb-tempo: 15s; --amb-peak: 0.05; --amb-hue: 205; }
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    contain: strict;
  }
  .ambient::before {
    content: ""; position: absolute; inset: -12%;
    background: radial-gradient(1100px 720px at 50% 40%,
      hsla(var(--amb-hue), 72%, 56%, var(--amb-peak)),
      hsla(var(--amb-hue), 72%, 56%, 0) 62%);
    transform-origin: 50% 42%;
    will-change: opacity, transform;
    animation: ambient-breathe var(--amb-tempo) ease-in-out infinite;
  }
  /* the breathe: peak alpha lives in --amb-peak (baked into the gradient); this pulses the
     layer's own opacity + a gentle scale so it reads as living background MOTION, not a
     static wash. Trough is a fraction of peak, so busier => both quicker AND brighter. */
  @keyframes ambient-breathe {
    0%, 100% { opacity: .34; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    /* no-op the motion: a faint, unchanging tint (no breathe, no scale). The busyness
       intensity (--amb-peak) still gently colours the board, but nothing moves. */
    .ambient::before { animation: none; opacity: .55; will-change: auto; }
  }

  /* two-column body (#176): the main fleet surface + a narrow, sticky right-hand column
     holding the git commit-tree of shipped/merged runs. The tree lives on the SIDE (its
     own column) so it never crowds the KANBAN lanes; the main column keeps min-width:0 so
     its horizontally-scrolling board stays contained. Collapses to a single stacked column
     on narrow viewports. */
  .layout { display: flex; align-items: flex-start; gap: 16px; }
  .layout .main { flex: 1 1 auto; min-width: 0; }
  .layout .side { flex: 0 0 236px; width: 236px; position: sticky; top: 14px; align-self: flex-start; }
  @media (max-width: 980px) {
    .layout { flex-direction: column; }
    .layout .side { position: static; width: 100%; flex-basis: auto; }
  }

  /* ---------- masthead ---------- */
  .masthead { position: relative; padding: 26px 6px 0; margin-bottom: 6px; }
  .brandrow { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .wordmark {
    font-family: var(--serif); font-weight: 700; color: var(--parch);
    font-size: 30px; letter-spacing: .40em; margin: 0; padding-left: .1em;
    text-shadow: 0 1px 0 #05101a, 0 0 22px rgba(198,168,106,.18);
    line-height: 1;
  }
  .wordmark .anchor { color: var(--brass); letter-spacing: normal; margin-right: .28em; }
  .lede { color: var(--brass); font-family: var(--serif); font-style: italic;
    font-size: 14.5px; letter-spacing: .02em; margin-bottom: 3px; }
  .brandrow .spacer { flex: 1 1 30px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 3px; }
  .ro {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #a7e6c2;
    border: 1px solid #1f4a30; background: #0d1e12; padding: 3px 9px; border-radius: 999px;
  }
  .weather {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    letter-spacing: .10em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--wood-edge);
  }
  .weather .glyph { font-size: 13px; line-height: 1; }
  .weather.calm { color: #a4e6c6; background: #0d1f17; border-color: #1e4630; }
  .weather.choppy { color: #b9caf0; background: #10192c; border-color: #2a3c62; }
  .weather.storm { color: #f0b8a2; background: #22110c; border-color: #5a2a1d; }
  .btn-ghost {
    font: inherit; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-dim);
    background: var(--chip); border: 1px solid var(--wood-edge); border-radius: 999px;
    padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { border-color: var(--brass); color: var(--parch); }
  .btn-ghost.on { border-color: var(--brass); color: var(--brass-bright); background: #1a1608; }
  .sortsel {
    font: inherit; font-size: 11.5px; color: var(--ink-dim); background: var(--chip);
    border: 1px solid var(--wood-edge); border-radius: 999px; padding: 4px 8px; cursor: pointer;
  }
  .sortsel:hover { border-color: var(--brass); }
  /* filter control (#164) — narrow the board by stage/state. Reuses the .sortsel
     pill; a brass "filtering" accent + a small dot signal when a filter is active,
     so it's obvious the view is narrowed and how to clear it. Native <select> so
     it's keyboard-accessible for free. */
  .filtersel.filtering { border-color: var(--brass); color: var(--brass-bright); background: #1a1608; }
  .filter-wrap { display: inline-flex; align-items: center; gap: 6px; }
  .filter-wrap .fdot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass-bright);
    box-shadow: 0 0 6px -1px var(--brass-bright); display: none; }
  .filter-wrap.on .fdot { display: inline-block; }
  /* layout toggle (#163) — list ⇄ KANBAN board; a visible segmented control */
  .viewseg { display: inline-flex; border: 1px solid var(--wood-edge); border-radius: 999px;
    overflow: hidden; background: var(--chip); }
  .viewseg .seg {
    font: inherit; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-dim);
    background: transparent; border: 0; padding: 4px 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .viewseg .seg + .seg { border-left: 1px solid var(--wood-edge); }
  .viewseg .seg:hover { color: var(--parch); }
  .viewseg .seg[aria-pressed="true"] { color: var(--brass-bright); background: #1a1608; }

  /* thin animated sea swell under the masthead */
  .swell { height: 26px; margin: 14px 0 0; overflow: hidden; position: relative;
    border-bottom: 1px solid var(--line); }
  .swell svg { position: absolute; bottom: -2px; left: 0; width: 200%; height: 100%;
    animation: drift 13s linear infinite; opacity: .55; }
  .swell svg.b { animation-duration: 21s; animation-direction: reverse; opacity: .3; bottom: -6px; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .substamp { color: var(--ink-faint); font-family: var(--mono); font-size: 11px;
    padding: 8px 6px 2px; letter-spacing: .02em; }

  /* ---------- manifest (fleet totals) bar ---------- */
  .manifest {
    display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 12px 0 18px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.08), 0 6px 18px rgba(0,0,0,.35);
  }
  .m-lede {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 11px 16px; border-right: 1px solid var(--line); min-width: 132px;
  }
  .m-lede .label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .m-lede .val { font-family: var(--serif); font-size: 26px; color: var(--parch); line-height: 1; }
  .m-lede .val .n { color: var(--brass-bright); }
  .gauges { display: flex; align-items: stretch; flex-wrap: wrap; flex: 1 1 auto; }
  .gauge {
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 10px 14px; min-width: 96px; border-right: 1px solid var(--line);
  }
  .gauge .n { font-family: var(--mono); font-size: 18px; font-weight: 650; color: var(--ink); line-height: 1; }
  .gauge .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .gauge.zero { opacity: .38; }
  .gauge.queued .n { color: var(--queued); }
  .gauge.building .n { color: var(--building); }
  .gauge.reviewing .n { color: var(--review); }
  .gauge.awaiting-merge .n { color: var(--awaiting); }
  .gauge.done .n { color: var(--done); }
  .gauge.blocked .n { color: var(--blocked); }
  .gauge.blocked:not(.zero) { background: #1c0f0b; }
  /* clickable gauges as filter shortcuts (#164) — click a state's gauge to narrow
     the board to it (click again to clear). Keyboard-accessible (they're real
     buttons); the active filter's gauge shows a brass underline + ring. */
  .gauge.clickable { cursor: pointer; border: 0; background: transparent; text-align: left;
    font: inherit; position: relative; transition: box-shadow .15s ease; }
  .gauge.clickable:hover { box-shadow: inset 0 0 0 1px var(--wood-edge-2); }
  .gauge.clickable:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
  .gauge.clickable[aria-pressed="true"] { box-shadow: inset 0 -2px 0 0 var(--brass-bright), inset 0 0 0 1px var(--brass-dim); }
  /* the "N shipped today" ticker (#127): a celebratory flourish when the count rises —
     the gauge pops + gains a green glow for a moment, then settles back. */
  .gauge.shipped-today { transition: box-shadow .5s ease, background .5s ease; }
  .gauge.shipped-today.flourish {
    animation: ticker-pop 1.6s ease-out 1;
    background: #0d1f17;
    box-shadow: inset 0 0 0 1px rgba(55,181,140,.4), 0 0 18px rgba(55,181,140,.28);
  }
  @keyframes ticker-pop {
    0% { transform: scale(1); }
    22% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .m-cost {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 10px 18px; margin-left: auto; text-align: right; border-left: 1px solid var(--line);
  }
  .m-cost .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .m-cost .val { font-family: var(--mono); font-size: 19px; font-weight: 650; color: var(--brass-bright); }
  .m-cost .caveat { font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em; }

  /* ---------- today's fleet scoreboard banner (#193) ----------
     A slim top strip above the manifest with today's live scoreboard: features
     shipped, total spend, average build time (dispatch→merge) and throughput. It
     shares the manifest's wood+brass look so it reads as one instrument, and stays
     compact (one short row) so it never pushes the KANBAN lanes off-screen. Every
     figure degrades to "—" (never NaN/undefined/Infinity) when its data is absent;
     values are set via textContent (XSS-safe), and it refreshes on the same poll
     cycle the board does. READ-ONLY — derived from the snapshot the page already reads. */
  .scoreboard {
    display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 12px 0 10px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.08), 0 6px 18px rgba(0,0,0,.35);
  }
  .scoreboard .sb-lede {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 9px 16px; border-right: 1px solid var(--line); min-width: 104px;
  }
  .scoreboard .sb-lede .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--brass); }
  .scoreboard .sb-lede .sub { font-size: 11px; color: var(--ink-faint);
    font-family: var(--serif); font-style: italic; }
  .score {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    padding: 9px 16px; min-width: 118px; flex: 1 1 0; border-right: 1px solid var(--line);
  }
  .score:last-child { border-right: 0; }
  .score .sv { font-family: var(--mono); font-size: 19px; font-weight: 650;
    color: var(--brass-bright); line-height: 1; }
  .score .sv.dim { color: var(--ink-faint); }
  .score .sk { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  /* lower-bound marker (#193 follow-up): when a tile sums only the client-visible
     subset (spendN/avgSampleN < shippedToday) it understates the true total, so it
     wears the same "~"-prefix + brass estimate tint + tiny caveat sub-label the
     manifest cost cell uses — visible on-screen (a livestream capture can't read a
     hover title). The caveat mirrors .m-cost .caveat and adds only one short line. */
  .score .sv.est { color: var(--brass); }
  .score .caveat { font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em; line-height: 1.1; }
  @media (max-width: 640px) { .score { min-width: 45%; flex-basis: 45%; } }

  /* ---------- the horizon: waiting-runs dependency graph (#111) ---------- */
  .horizon { margin: 4px 0 22px; }
  .horizon .lane-head { margin: 8px 2px 10px; }
  .horizon .lane-head h2 .glyph { color: var(--brass-bright); margin-right: .35em; letter-spacing: normal; }
  .h-caption { color: var(--ink-faint); font-family: var(--serif); font-style: italic;
    font-size: 12.5px; padding: 0 2px 10px; }
  .h-note {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .04em;
    color: #d9b78a; background: #1c1608; border: 1px solid #4a3c1c; border-radius: 999px;
    padding: 2px 9px; margin-left: 6px; vertical-align: middle;
  }
  .graph {
    position: relative; overflow-x: auto; overflow-y: hidden;
    background:
      radial-gradient(900px 300px at 12% -20%, rgba(18,58,92,.5), rgba(18,58,92,0) 60%),
      linear-gradient(180deg, #0c1e30, #0a1826);
    border: 1px solid var(--wood-edge); border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.06), 0 6px 18px rgba(0,0,0,.3);
    padding: 16px 18px;
  }
  .graph-edges { position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; z-index: 0; }
  .graph-cols { position: relative; z-index: 1; display: flex; align-items: flex-start;
    gap: 58px; min-width: min-content; }
  .graph-col { display: flex; flex-direction: column; gap: 16px; min-width: 210px; }
  .col-head { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-faint); padding: 0 2px 2px; border-bottom: 1px dashed var(--line); }
  .col-head.frontier { color: var(--brass); }

  .gnode {
    position: relative; display: block; width: 210px; text-align: left;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-left: 3px solid var(--wood-edge-2);
    border-radius: 10px; padding: 9px 11px 10px; cursor: pointer; color: inherit;
    font: inherit; user-select: none;
  }
  .gnode:hover { border-color: var(--wood-edge-2); }
  .gnode:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .gnode .gn-head { display: flex; align-items: center; gap: 7px; }
  .gnode .gn-ship { width: 22px; height: 16px; flex: none; }
  .gnode .gn-ship svg { width: 22px; height: 16px; }
  .gnode .gn-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 12.5px; }
  .gnode .gn-pill { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 7px; border-radius: 999px;
    border: 1px solid currentColor; }
  .gnode .gn-title { color: var(--parch); font-weight: 600; font-size: 12.5px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gnode .gn-reasons { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
  .gnode .gn-reason {
    display: flex; align-items: baseline; gap: 5px; font-size: 10.5px; font-family: var(--mono);
    color: #e6bfa0; background: #1e120c; border: 1px solid #4a2a1c; border-radius: 6px;
    padding: 2px 7px; letter-spacing: .01em;
  }
  .gnode .gn-reason .rk { color: var(--blocked); font-size: 8px; }

  /* the runnable frontier — glowing brass hulls, "clear to sail" */
  .gnode.eligible { border-color: var(--brass-dim); border-left-color: var(--brass);
    box-shadow: 0 0 0 1px rgba(198,168,106,.18), 0 0 16px rgba(198,168,106,.12); }
  .gnode.eligible .gn-pill { color: var(--done); }
  .gnode.eligible .gn-tag { margin-top: 7px; font-size: 10px; letter-spacing: .04em;
    color: var(--done); font-family: var(--mono); }
  /* held hulls — dimmed, amber seam */
  .gnode.held { border-left-color: var(--awaiting); opacity: .96; }
  .gnode.held .gn-pill { color: var(--awaiting); }
  /* a prerequisite still under way (not part of the frontier decision) */
  .gnode.flight { border-left-color: var(--building); background: linear-gradient(180deg, #10202f, #0d1a27); }
  .gnode.flight .gn-pill { color: var(--building); }
  .gnode.flight.pending { opacity: .78; border-left-color: var(--ink-faint); }
  .gnode.flight.pending .gn-pill { color: var(--ink-faint); }

  .graph-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 4px 0;
    font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }
  .graph-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .graph-legend .swatch { width: 22px; height: 0; border-top: 2px solid var(--ink-faint); }
  .graph-legend .swatch.depends { border-top-style: solid; border-top-color: var(--awaiting); }
  .graph-legend .swatch.samefile { border-top-style: dashed; border-top-color: var(--review); }
  .graph-legend .swatch.lockfile { border-top-style: dashed; border-top-color: var(--brass); }
  .graph-legend .swatch.base { border-top-style: dotted; border-top-color: var(--ink-dim); }
  .graph-legend .dot-e { width: 9px; height: 9px; border-radius: 2px; background: var(--brass); }
  .graph-legend .dot-h { width: 9px; height: 9px; border-radius: 2px; background: var(--awaiting); }
  .graph-flat-note { color: var(--ink-faint); font-family: var(--serif); font-style: italic;
    font-size: 12px; padding: 8px 2px 0; }

  @media (max-width: 760px) {
    .graph-col { min-width: 168px; }
    .gnode { width: 168px; }
  }

  /* ---------- a run (compact voyage row) ---------- */
  .runs { display: flex; flex-direction: column; gap: 11px; }
  .run { position: relative; }
  .voyage-row {
    display: grid; align-items: center; gap: 13px;
    /* One SHARED template for in-flight AND recent rows so status / cost / time line
       up cleanly across both lanes (#121). The time column is fixed (not max-content)
       and wide enough for the longest completed-voyage stamp ("shipped 45m 06s ago"),
       so it never drifts row-to-row and the recent lane aligns with the in-flight rows. */
    /* The cost column is wide enough (#172) to CONTAIN "$X.XX so far · N.NM tok" — with
       the token suffix (#149) the figure runs ~130px, and a narrow column let it overflow
       LEFT (justify-content:flex-end) across the gap into the status column, drawing the
       cost text over the slim progress bar (#156). Sizing the column to fit the figure keeps
       cost and progress in separate, non-overlapping regions at every width. */
    grid-template-columns: 30px 60px minmax(0,1fr) 150px 96px 140px 96px 140px 14px;
    padding: 11px 15px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-radius: 12px;
    cursor: pointer; user-select: none;
  }
  .voyage-row:hover { border-color: var(--wood-edge-2); }
  .voyage-row:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .run.expanded > .voyage-row { border-color: var(--brass-dim); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .run.blocked > .voyage-row { border-color: #532a20; }
  .run.blocked > .voyage-row .ship svg { filter: drop-shadow(0 0 5px rgba(224,86,63,.55)); }
  .run.just-shipped > .voyage-row { animation: shipped-glow 2.4s ease-out 1; }
  @keyframes shipped-glow {
    0% { box-shadow: 0 0 0 0 rgba(55,181,140,.55); border-color: var(--done); }
    100% { box-shadow: 0 0 0 14px rgba(55,181,140,0); }
  }
  /* celebratory flourish (#127): a brief "just shipped" pennant that rises off the row
     when a run lands (Merged/Shipped), building on the just-shipped glow above. It is
     appended once on the transition and self-removes; reduced-motion shows it static. */
  .landed-pennant {
    position: absolute; top: -9px; right: 14px; z-index: 3; pointer-events: none;
    font-size: 10px; letter-spacing: .06em; font-weight: 700; white-space: nowrap;
    color: #06231a; background: linear-gradient(180deg, var(--brass-bright), var(--done));
    border-radius: 999px; padding: 2px 10px;
    box-shadow: 0 3px 11px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
    animation: pennant-rise 3.2s ease-out 1 forwards;
  }
  @keyframes pennant-rise {
    0% { opacity: 0; transform: translateY(7px) scale(.9); }
    12% { opacity: 1; transform: translateY(0) scale(1); }
    78% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-5px); }
  }
  /* ---------- one-shot EVENT bursts (#178) ----------
     Brief, self-removing overlays fired on a state TRANSITION (not a loop), layered
     over the ambient state animations. Each is an inert, pointer-events:none sheet
     anchored to the card (.run / .kcard are position:relative), removed by a JS timeout.
     Both are display:none under prefers-reduced-motion, so they are a pure no-op there. */

  /* celebratory burst — a quick emerald FLASH sweeping the card the instant a run lands
     (Merged/Shipped), on top of the slow shipped-glow ring + the rising pennant, so a
     landing reads as a burst of light, not only a slow glow. */
  .fx-burst {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    border-radius: inherit; overflow: hidden;
    animation: fx-burst-fade 1.15s ease-out 1 forwards;
  }
  .fx-burst::before {
    content: ""; position: absolute; inset: -20%;
    background:
      radial-gradient(circle at 80% 42%, rgba(150,245,205,.6), rgba(150,245,205,0) 55%),
      radial-gradient(circle at 20% 60%, rgba(120,235,190,.4), rgba(120,235,190,0) 50%);
  }
  @keyframes fx-burst-fade { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }

  /* storm burst — the alarming counterpart: a red shockwave FLASH sweeps the card, with a
     brief nervous shake, the instant a run transitions INTO blocked. The shake is on the
     overlay only (never the card's text), so legibility is untouched. */
  .fx-storm {
    position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit;
    animation: fx-storm-shake 1.05s cubic-bezier(.36,.07,.19,.97) 1 forwards;
  }
  .fx-storm::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 2px rgba(224,86,63,.9), inset 0 0 26px 2px rgba(224,86,63,.5);
    animation: fx-storm-flash 1.05s ease-out 1 forwards;
  }
  @keyframes fx-storm-shake {
    0%,100% { transform: translateX(0); }
    12% { transform: translateX(-3px); } 26% { transform: translateX(3px); }
    40% { transform: translateX(-2px); } 54% { transform: translateX(2px); } 70% { transform: translateX(-1px); }
  }
  @keyframes fx-storm-flash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
  /* ---------- state-specific run-card animations (#150) ----------
     Ambient, per-state motion on LIVE (non-recent) run cards, keyed to the run's
     REAL armada:* group (the .g-<group> class the row carries). Tasteful + nautical;
     each state reads distinctly and none is distracting. All are a slow breathing
     glow on a coloured left seam (no layout shift — pure box-shadow, no border/size
     change, no overflow clip of the focus ring or the progress bar / chips inside).
     The shipped/merged celebration is deliberately NOT here: it is a ONE-SHOT
     flourish fired on the transition (.just-shipped glow + .landed-pennant, above),
     never a loop. Every loop below is disabled + pinned to a static seam under
     prefers-reduced-motion (see the reduced-motion block near the end). */

  /* building — a gentle "working" pulse: the card breathes a soft building-blue glow,
     so an in-flight build visibly ticks along. */
  .run.g-building:not(.recent) > .voyage-row { animation: card-building 3.6s ease-in-out infinite; }
  @keyframes card-building {
    0%,100% { box-shadow: inset 3px 0 0 0 rgba(86,180,233,.55), 0 0 0 0 rgba(86,180,233,0); }
    50%     { box-shadow: inset 3px 0 0 0 rgba(86,180,233,.90), 0 0 15px -3px rgba(86,180,233,.42); }
  }
  /* awaiting-merge — a calmer, warmer "ready" glow: a slower amber breathe, signalling
     a run that is ready and waiting at the merge gate. */
  .run.g-awaiting-merge:not(.recent) > .voyage-row { animation: card-awaiting 4.6s ease-in-out infinite; }
  @keyframes card-awaiting {
    0%,100% { box-shadow: inset 3px 0 0 0 rgba(230,169,60,.45), 0 0 6px -2px rgba(230,169,60,.20); }
    50%     { box-shadow: inset 3px 0 0 0 rgba(230,169,60,.85), 0 0 16px -2px rgba(230,169,60,.44); }
  }
  /* in-review — a lively "alive" shimmer in the review orchid, a touch quicker than the
     calm awaiting glow: a PR actively under review reads as busy, not parked (#178). */
  .run.g-reviewing:not(.recent) > .voyage-row { animation: card-reviewing 3.2s ease-in-out infinite; }
  @keyframes card-reviewing {
    0%,100% { box-shadow: inset 3px 0 0 0 rgba(207,143,190,.5), 0 0 6px -2px rgba(207,143,190,.22); }
    50%     { box-shadow: inset 3px 0 0 0 rgba(207,143,190,.92), 0 0 16px -2px rgba(207,143,190,.5); }
  }
  /* blocked — a soft warning pulse in the fleet's danger tone, a touch more insistent
     (faster) than the calm states: attention needed. Pairs with the red ship glow. */
  .run.blocked:not(.recent) > .voyage-row { animation: card-blocked 2.2s ease-in-out infinite; }
  @keyframes card-blocked {
    0%,100% { box-shadow: inset 3px 0 0 0 rgba(224,86,63,.55), 0 0 5px -2px rgba(224,86,63,.26); }
    50%     { box-shadow: inset 3px 0 0 0 rgba(224,86,63,.95), 0 0 18px -2px rgba(224,86,63,.56); }
  }

  .ship { width: 30px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .ship svg { width: 28px; height: 21px; }
  .run:not(.blocked) .ship.sailing svg { animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-1.6px) rotate(1.2deg); } }
  .s-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 13px; }
  .s-title { color: var(--parch); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* click-through link affordance (#127): the number → its GitHub issue/PR, the title
     → the PR when one exists (else the issue). Read-only deep links, target=_blank
     rel=noopener, opened in a new tab; the rest of the row still toggles the log card. */
  a.s-num, a.s-title { text-decoration: none; cursor: pointer; }
  a.s-num:hover { color: var(--brass-bright); text-decoration: underline; }
  a.s-title:hover { color: var(--parch); text-decoration: underline; }
  a.s-num:focus-visible, a.s-title:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }
  .s-num .ext { font-size: 8.5px; opacity: .5; margin-left: 2px; vertical-align: super; }
  a.s-num:hover .ext, a.s-num:focus-visible .ext { opacity: 1; }

  /* voyage progress bar (the signature) */
  .voyage { display: inline-grid; grid-auto-flow: column; gap: 3px; align-items: center; }
  .leg { height: 8px; width: 15px; border-radius: 2px; background: #22384f; position: relative; }
  .leg.done { background: linear-gradient(180deg, var(--brass), var(--brass-dim)); }
  .leg.active { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
  .leg.active::after {
    content: ""; position: absolute; top: -6px; left: 50%; width: 0; height: 0;
    transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 6px solid currentColor;
  }
  .run:not(.blocked) .leg.active::after { animation: bob 3.6s ease-in-out infinite; }
  .leg.blocked { background: var(--blocked); box-shadow: none; }
  .leg.blocked::after { content: none; }

  .s-status { font-weight: 600; font-size: 12.5px; white-space: nowrap; text-align: right; letter-spacing: .01em;
    display: inline-flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  /* coarse progress estimate (#156): a slim bar + % under the status word, on
     in-flight (building/reviewing) cards only. Honest — a phase-derived estimate. */
  .s-prog { display: inline-flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-end; }
  .s-prog-track { position: relative; height: 4px; width: 56px; border-radius: 2px;
    background: #22384f; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .s-prog-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--brass-dim), var(--brass-bright)); transition: width .6s ease; }
  .s-prog-pct { font-family: var(--mono); font-size: 10.5px; font-weight: 650;
    color: var(--brass); min-width: 28px; text-align: right; letter-spacing: 0; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .s-prog-fill { transition: none; } }
  .s-cost { color: var(--ink-dim); font-family: var(--mono); font-size: 13px;
    display: inline-flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
  .s-cost.est { color: var(--brass); }
  .s-cost.accruing .cnum { animation: cost-pulse 2.6s ease-in-out infinite; }
  .s-cost .tag { font-size: 8px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-faint); align-self: center; }
  .s-cost.est .tag { color: var(--brass); }
  /* per-run token usage, sat next to cost ("$2.68 · 1.2M tok") — #149 */
  .s-tok { color: var(--ink-faint); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  .s-tok::before { content: "·"; margin-right: 4px; color: var(--ink-faint); }
  /* which model(s) the run used, as a compact chip on the row — #151. Sits after
     the cost/token figures; the primary (busiest) model shows, "+N" hints the rest,
     and the title tooltip carries the full %-per-model split. Degrades to hidden
     when no model info is available. */
  .s-model { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: .02em; color: var(--brass);
    border: 1px solid var(--brass-dim); border-radius: 999px; padding: 1px 7px;
    background: rgba(198,168,106,.08); }
  .s-model .s-model-more { color: var(--ink-faint); }
  .s-model-cell { display: flex; justify-content: flex-start; min-width: 0; overflow: hidden; }
  /* %-per-model split in the expanded ledger — a stacked share bar + legend (#151) */
  .model-split { margin-top: 10px; }
  .model-split .msplit-h { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 6px; }
  .model-bar { display: flex; width: 100%; height: 9px; border-radius: 999px; overflow: hidden;
    border: 1px solid var(--wood-edge); background: var(--wood-2); }
  .model-bar .seg { height: 100%; min-width: 2px; }
  .model-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; }
  .model-legend .mitem { display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .model-legend .msw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .model-legend .mpct { color: var(--brass-bright); font-weight: 650; }
  .model-legend .mtok { color: var(--ink-faint); font-size: 10.5px; }
  @keyframes cost-pulse { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
  .s-elapsed { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; }
  /* completed-voyage landing time ("shipped 1h 08m ago") — sits in the SAME fixed
     time column as the in-flight elapsed clock (140px, shared template above), so it
     never wraps and the recent rows stay aligned with the in-flight rows. */
  .s-when { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }
  .chev { color: var(--ink-faint); font-size: 10px; text-align: center; transition: transform .14s ease; }
  .run.expanded > .voyage-row .chev { transform: rotate(90deg); color: var(--brass); }

  /* ---------- recent voyages lane (the harbour of completed voyages, #113) ---------- */
  .lane-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin: 26px 2px 11px; padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
  }
  .lane-head h2 {
    margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--brass); font-weight: 600;
  }
  .lane-head h2 .anchor { color: var(--brass-bright); margin-right: .35em; letter-spacing: normal; }
  .lane-head .lane-sub { color: var(--ink-faint); font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em; }
  .lane-head .lane-sub .today { color: var(--done); }
  .lane-head .spacer { flex: 1 1 20px; }
  .lane-note { color: var(--ink-faint); font-style: italic; font-family: var(--serif);
    padding: 14px 6px; text-align: center; }

  /* ---------- ready-to-merge lane (the human merge queue, #140) ----------
     Reviewed-clean, mergeable, unmerged PRs waiting on a HUMAN merge (ARMADA's
     self-approval guard makes this the common resting state for its own fleet PRs).
     A distinct green "clear to merge" seam sets it apart from the amber awaiting
     gauge; each row shows PR #/title, a live wait timer, and the copyable
     `gh pr merge` command. The dashboard only SHOWS the command — never runs it. */
  .merge-head h2 .ready { color: var(--done); margin-right: .4em; letter-spacing: normal; }
  .merge-head .lane-sub .cnt { color: var(--done); font-weight: 650; }
  .merge-queue { display: flex; flex-direction: column; gap: 9px; }
  .mq-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 9px 16px;
    padding: 11px 15px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-left: 3px solid var(--done);
    border-radius: 12px;
  }
  .mq-row:hover { border-color: var(--wood-edge-2); border-left-color: var(--done); }
  .mq-id { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 250px; }
  .mq-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 13px;
    text-decoration: none; white-space: nowrap; flex: none; }
  a.mq-num:hover { color: var(--brass-bright); text-decoration: underline; }
  a.mq-num:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }
  .mq-title { color: var(--parch); font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-width: 0; }
  .mq-wait { color: var(--ink-dim); font-family: var(--mono); font-size: 11.5px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .mq-wait .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done);
    box-shadow: 0 0 6px -1px var(--done); flex: none; }
  .mq-wait .js-elapsed { color: var(--parch); }
  .mq-cmd { display: flex; align-items: center; gap: 6px; flex: 1 1 320px; justify-content: flex-end;
    min-width: 0; }
  .mq-code {
    font-family: var(--mono); font-size: 12px; color: var(--brass-bright);
    background: var(--chip); border: 1px solid var(--wood-edge); border-radius: 6px;
    padding: 4px 9px; white-space: nowrap; overflow-x: auto; max-width: 100%;
    user-select: all;
  }
  @media (max-width: 640px) {
    .mq-cmd { justify-content: flex-start; flex-basis: 100%; }
  }

  /* a completed voyage sits "at anchor": brass seam on the left, calmer wood, no bob.
     It INHERITS the shared .voyage-row grid template (fixed 140px time column) so the
     status / cost / time columns line up cleanly within the lane AND against the
     in-flight rows above — no per-row max-content drift (#121). */
  .run.recent > .voyage-row {
    background: linear-gradient(180deg, #12222f, #0e1c29);
    border-color: var(--wood-edge); border-left: 3px solid var(--brass-dim);
  }
  .run.recent.blocked > .voyage-row { border-left-color: var(--blocked); }
  .run.recent > .voyage-row:hover { border-color: var(--wood-edge-2); }
  .run.recent.expanded > .voyage-row { border-color: var(--brass-dim); }
  .s-when { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }

  /* ---------- expanded log card ---------- */
  .logcard {
    border: 1px solid var(--brass-dim); border-top: 0; border-radius: 0 0 12px 12px;
    background: linear-gradient(180deg, var(--wood), #10202f);
    overflow: hidden;
  }
  .run.blocked > .logcard { border-color: #532a20; }
  .card-body { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 4px; padding: 8px 6px; }

  /* left: the voyage pipeline */
  .pipeline { padding: 12px 16px; border-right: 1px solid var(--line); }
  .pipeline h3 { margin: 0 0 9px; font-family: var(--serif); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--brass); font-weight: 600; }
  .stage { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 4px 0; align-items: start; }
  .rung { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #33506e; flex: none; }
  .rail { width: 2px; flex: 1 1 14px; min-height: 14px; background: #22384f; }
  .stage:last-child .rail { display: none; }
  .stage.done .dot { background: var(--brass); }
  .stage.done .rail { background: var(--brass-dim); }
  .stage.active .dot { background: currentColor; box-shadow: 0 0 7px currentColor; }
  .stage.blocked .dot { background: var(--blocked); box-shadow: 0 0 7px var(--blocked); }
  .stage .body { min-width: 0; }
  .stage .name { font-family: var(--serif); font-size: 13.5px; color: var(--ink-faint); }
  .stage.done .name { color: var(--ink-dim); }
  .stage.active .name { color: var(--parch); font-weight: 600; }
  .stage.blocked .name { color: var(--blocked); font-weight: 600; }
  .stage .cap { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  .stage.active .cap { color: var(--ink-dim); }
  .stage .here { margin-left: 7px; font-size: 15px; }

  /* right: metadata */
  .meta { padding: 12px 16px; }
  .row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; padding: 5px 0; }
  .row .k { color: var(--ink-faint); text-align: right; font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; padding-top: 2px; }
  .row .v { color: var(--ink); min-width: 0; }
  .row .v a { color: var(--brass-bright); text-decoration: none; }
  .row .v a:hover { text-decoration: underline; }
  .path { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); word-break: break-all; }
  .naval { color: var(--ink-faint); font-style: italic; }
  .btn {
    display: inline-block; margin-left: 7px; padding: 1px 8px; border-radius: 6px;
    border: 1px solid var(--wood-edge); background: var(--chip); color: var(--ink-dim);
    font-size: 11px; font-family: var(--mono); cursor: pointer; vertical-align: middle;
  }
  .btn:hover { border-color: var(--brass); color: var(--parch); }
  .btn.copied { border-color: var(--done); color: var(--done); }
  .video-wrap { margin-top: 4px; }
  .video-wrap video { width: 330px; max-width: 100%; background: #000; border-radius: 6px; border: 1px solid var(--line); }
  .video-cap { color: var(--ink-faint); font-size: 11.5px; margin-top: 4px; font-family: var(--mono); }

  /* cost ledger */
  .ledger { padding: 6px 20px 16px; border-top: 1px solid var(--line); }
  .ledger h3 { margin: 4px 0 6px; font-family: var(--serif); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--brass); font-weight: 600; }
  table.cost { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  table.cost th {
    text-align: left; color: var(--ink-faint); font-weight: 600; font-size: 10.5px;
    letter-spacing: .09em; padding: 6px 10px; border-bottom: 1px solid var(--wood-edge);
  }
  table.cost th.n, table.cost td.n { text-align: right; }
  table.cost td { padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--ink-dim); }
  table.cost td.model { color: var(--parch); font-weight: 600; }
  table.cost td.cost { color: var(--brass-bright); font-weight: 650; }
  table.cost td.na { color: var(--ink-faint); }
  .cost-foot { color: var(--ink-faint); font-size: 11.5px; padding: 9px 10px 2px; }
  .cost-foot .ptr { color: var(--ink-dim); }
  /* in-flight vs final banner above the ledger table (#115) */
  .cost-status { font-size: 11.5px; font-family: var(--mono); padding: 0 10px 8px;
    color: var(--ink-faint); letter-spacing: .02em; }
  .cost-status.est { color: var(--brass); }
  .cost-status.final { color: var(--done); }
  .cost-status .pip { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; background: currentColor; }
  .cost-status.est .pip { animation: cost-pulse 2.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .s-cost.accruing .cnum, .cost-status.est .pip { animation: none; }
  }

  /* ---------- compact summary card (auto-expanded active build, #131) ----------
     A concise expanded card for the run(s) currently BUILDING (armada:underway):
     the current stage, live elapsed + accruing cost, and the issue/PR deep-links —
     NOT the full pipeline / meta / ledger dump. Auto-expanded by default so the
     active build reads as the most interesting thing on the board; still user-
     collapsible. Shares the brass seam + flattened top of the full log card. */
  .summary-card {
    border: 1px solid var(--brass-dim); border-top: 0; border-radius: 0 0 12px 12px;
    background: linear-gradient(180deg, var(--wood), #10202f);
    padding: 11px 16px 13px;
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px 22px; align-items: center;
  }
  .summary-card .sum-stage { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .summary-card .sum-glyph { font-size: 17px; line-height: 1; color: var(--building); flex: none; }
  .summary-card .sum-stage-body { min-width: 0; }
  .summary-card .sum-stage-name { font-family: var(--serif); font-size: 14px; color: var(--parch); font-weight: 600; }
  .summary-card .sum-stage-cap { font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary-card .sum-facts { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; justify-content: flex-end; }
  .summary-card .sum-fact { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .summary-card .sum-fact .k { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .summary-card .sum-fact .v { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .summary-card .sum-fact .v.cost { color: var(--brass); }
  .summary-card .sum-fact .v .tag { font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-left: 4px; }
  .summary-card .sum-links { display: inline-flex; gap: 12px; justify-content: flex-end; }
  .summary-card .sum-links a { color: var(--brass-bright); text-decoration: none; }
  .summary-card .sum-links a:hover { text-decoration: underline; }
  .summary-card .sum-links a:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 3px; }
  @media (max-width: 620px) {
    .summary-card { grid-template-columns: 1fr; }
    .summary-card .sum-facts { justify-content: flex-start; }
    .summary-card .sum-fact { text-align: left; }
    .summary-card .sum-links { justify-content: flex-start; }
  }

  /* empty / degraded */
  .empty { text-align: center; color: var(--ink-dim); padding: 70px 20px; }
  .empty .glyph { font-size: 34px; opacity: .8; }
  .empty .big { font-family: var(--serif); font-size: 18px; color: var(--parch); margin: 8px 0 6px; }
  .empty .sub { color: var(--ink-faint); }

  @media (max-width: 760px) {
    .card-body { grid-template-columns: 1fr; }
    .pipeline { border-right: 0; border-bottom: 1px solid var(--line); }
    .row { grid-template-columns: 76px 1fr; }
    .voyage-row { grid-template-columns: 26px 50px minmax(0,1fr) auto 62px 14px; }
    .voyage-row .voyage, .voyage-row .s-elapsed, .voyage-row .s-model-cell { display: none; }
    .m-cost { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swell svg { animation: none; }
    .ship svg, .leg.active::after { animation: none !important; }
    .stage.active .dot { box-shadow: none; }
    .chev { transition: none; }
    .run.just-shipped > .voyage-row { animation: none; }
    .landed-pennant { animation: none; opacity: 1; }
    .gauge.shipped-today.flourish { animation: none; }
    /* state-specific run animations (#150): drop the motion, keep a STATIC coloured
       left seam so each state still reads distinctly for a reduced-motion viewer. */
    .run.g-building:not(.recent) > .voyage-row { animation: none; box-shadow: inset 3px 0 0 0 rgba(86,180,233,.6); }
    .run.g-reviewing:not(.recent) > .voyage-row { animation: none; box-shadow: inset 3px 0 0 0 rgba(207,143,190,.6); }
    .run.g-awaiting-merge:not(.recent) > .voyage-row { animation: none; box-shadow: inset 3px 0 0 0 rgba(230,169,60,.6); }
    .run.blocked:not(.recent) > .voyage-row { animation: none; box-shadow: inset 3px 0 0 0 rgba(224,86,63,.7); }
    /* one-shot event bursts (#178): no flash/shake for a reduced-motion viewer — the
       static state seams + the (static) pennant already convey the transition. */
    .fx-burst, .fx-storm { display: none; }
  }

  /* ---------- KANBAN board (#163) — runs in lanes by pipeline stage ---------- */
  /* Wide content: the board scrolls horizontally inside its own container so the
     page body never scrolls sideways, even with all seven lanes on a narrow window. */
  /* All seven lanes share the row and fit without horizontal scroll (#175): flex:1 1 0 lets
     them divide the main column's width evenly (down to a sensible min), so Awaiting-merge,
     Merged and Shipped are always on screen beside the git-tree column. align-items:stretch +
     a viewport-tall min-height reclaim the empty space below — every column runs the full
     height of the frame rather than hugging the top third. */
  .board { display: flex; gap: 10px; align-items: stretch; overflow-x: auto;
    padding: 2px 2px 12px; margin: 12px 0 18px; scrollbar-width: thin;
    min-height: calc(100vh - 250px); }
  .kcol {
    flex: 1 1 0; min-width: 150px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-top: 4px solid var(--kc, var(--wood-edge));
    border-radius: 10px; box-shadow: inset 0 1px 0 rgba(198,168,106,.06), 0 5px 14px rgba(0,0,0,.3);
  }
  /* Stronger per-lane colour accent (#175): a thick coloured top border, a header washed in
     the lane's own colour, and a coloured lane name — so the left→right pipeline flow reads
     at a glance instead of relying on a hairline seam. */
  .kcol-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--kc, var(--wood-edge)) 22%, transparent), transparent);
    border-radius: 6px 6px 0 0;
  }
  .kcol-name { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 650;
    color: var(--kc, var(--ink-dim)); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .kcol-count {
    font-family: var(--mono); font-size: 11px; color: var(--kc, var(--ink-dim)); min-width: 18px;
    text-align: center; padding: 1px 6px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--kc, var(--wood-edge)) 55%, var(--wood-edge)); }
  /* the lane grows to fill the tall column, so cards spread into the reclaimed vertical space */
  .klane { display: flex; flex-direction: column; gap: 9px; padding: 10px; flex: 1 1 auto; min-height: 46px; }
  .kempty { color: var(--ink-faint); font-size: 11px; text-align: center; padding: 10px 4px;
    border: 1px dashed var(--line); border-radius: 8px; opacity: .7; }
  .kcard {
    position: relative;   /* anchors the "just shipped" pennant flourish to the card */
    background: linear-gradient(180deg, #12243a, #0f1e30);
    border: 1px solid var(--wood-edge); border-left: 3px solid var(--k, var(--building));
    border-radius: 8px; padding: 11px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .kcard.just-shipped { animation: shipped-glow 2.4s ease-out 1; }
  .kcard.blocked { border-left-color: var(--blocked);
    box-shadow: inset 0 0 0 1px rgba(224,86,63,.28); background: linear-gradient(180deg, #26130e, #1c0f0b); }
  .kcard.recent { opacity: .9; }
  /* ---------- KANBAN state-reactive pulses (#178) ----------
     The board's live cards breathe like the list rows do. building / in-review cards
     get a subtle "alive" glow in their lane colour; a blocked card gets a red storm
     pulse beyond its static seam. Terminal, recent, and just-landed cards stay calm.
     Guarded with :not(.kentering) so the #177 lane-ENTER animation still plays on a
     card sliding into a new lane (the ambient pulse resumes once it has settled).
     All are disabled + pinned static under prefers-reduced-motion below. */
  .kcard.g-building:not(.recent):not(.blocked):not(.kentering),
  .kcard.g-reviewing:not(.recent):not(.blocked):not(.kentering) { animation: kcard-alive 3.8s ease-in-out infinite; }
  @keyframes kcard-alive {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
    50%     { box-shadow: 0 0 13px -5px var(--k); }
  }
  .kcard.blocked:not(.recent):not(.kentering) { animation: kcard-storm 2.2s ease-in-out infinite; }
  @keyframes kcard-storm {
    0%,100% { box-shadow: inset 0 0 0 1px rgba(224,86,63,.28), 0 0 0 0 rgba(224,86,63,0); }
    50%     { box-shadow: inset 0 0 0 1px rgba(224,86,63,.6), 0 0 15px -4px rgba(224,86,63,.55); }
  }
  .kc-head { display: flex; align-items: center; gap: 6px; }
  .kc-ship { width: 20px; height: 15px; flex: none; display: inline-flex; }
  .kc-ship svg { width: 100%; height: 100%; }
  .kc-num { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); text-decoration: none; }
  a.kc-num:hover { color: var(--brass-bright); text-decoration: underline; }
  .kc-flag { margin-left: auto; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--blocked); border: 1px solid #5a2a1d; background: #22110c; padding: 1px 6px; border-radius: 999px; }
  /* Fuller title (#175): with the redundant stage label dropped from the foot, the title gets
     the reclaimed line — up to three lines before it truncates. */
  .kc-title { font-size: 13px; color: var(--ink); text-decoration: none; line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  a.kc-title:hover { color: var(--parch); text-decoration: underline; }
  .kc-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .kc-status { font-size: 11px; font-weight: 600; }
  /* cost sits at the foot's right edge whether or not a status sub-label precedes it (#175) */
  .kc-cost { font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); margin-left: auto;
    display: inline-flex; align-items: baseline; gap: 4px; }
  .kc-cost .tag { font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); }
  .kc-cost.est .cnum, .kc-cost.accruing .cnum { color: var(--awaiting); }
  .kc-cost.final .cnum { color: var(--done); }
  .kc-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
  /* coarse progress estimate on the board card (#174): a slim full-width bar + % under
     the foot. Same phase-derived signal the list row shows (#156); completed cards fill
     to 100%. Honest — a phase-derived estimate (tooltip says so). */
  .kc-prog { display: flex; align-items: center; gap: 6px; width: 100%; }
  .kc-prog-track { position: relative; flex: 1 1 auto; height: 4px; border-radius: 2px;
    background: #22384f; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .kc-prog-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--brass-dim), var(--brass-bright)); transition: width .6s ease; }
  .kc-prog-pct { font-family: var(--mono); font-size: 10px; font-weight: 650;
    color: var(--brass); min-width: 26px; text-align: right; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .kc-prog-fill { transition: none; } }
  @media (max-width: 640px) { .kcol { flex-basis: 76vw; min-width: 76vw; } }

  /* ---------- KANBAN lane-transition animation (#177) ----------
     The board is rebuilt from scratch each --watch poll, so a run that changed stage
     used to POP into its new lane. Instead we FLIP it: measure each card's box before
     the rebuild, then after the rebuild INVERT surviving cards back to their old box
     with a transform and PLAY that transform to zero — the card slides/settles from its
     old lane to its new one. New cards fade+settle IN; departed cards ghost OUT. Every
     effect is transform/opacity only (compositor-friendly, 60fps, no layout thrash) and
     is fully disabled under prefers-reduced-motion below. */
  .kcard.kflip { transition: transform 460ms cubic-bezier(.22,.61,.36,1); will-change: transform; }
  .kcard.kentering { animation: kcard-enter 380ms cubic-bezier(.22,.61,.36,1) 1; }
  @keyframes kcard-enter {
    from { opacity: 0; transform: translateY(-9px) scale(.965); }
    to   { opacity: 1; transform: none; }
  }
  /* a departed card, re-parented to the body as an inert fixed-position ghost that fades
     and settles down out of its old lane. pointer-events:none + aria-hidden keep it inert. */
  .kcard-ghost {
    position: fixed; margin: 0; z-index: 40; pointer-events: none;
    box-sizing: border-box; animation: kcard-leave 360ms ease-in 1 forwards;
  }
  @keyframes kcard-leave {
    from { opacity: .92; transform: translateY(0) scale(1); }
    to   { opacity: 0;   transform: translateY(9px) scale(.94); }
  }
  @media (prefers-reduced-motion: reduce) {
    /* no motion: cards appear directly in their new lane, no flip/enter, no ghost. */
    .kcard.kflip { transition: none; }
    .kcard.kentering { animation: none; }
    .kcard-ghost { display: none; }
    /* state-reactive pulses (#178): drop the motion; a blocked card keeps a STATIC red
       glow so it still reads as alarming (building/in-review fall back to their seam). */
    .kcard.g-building:not(.recent):not(.blocked):not(.kentering),
    .kcard.g-reviewing:not(.recent):not(.blocked):not(.kentering) { animation: none; }
    .kcard.blocked:not(.recent):not(.kentering) { animation: none;
      box-shadow: inset 0 0 0 1px rgba(224,86,63,.5), 0 0 12px -5px rgba(224,86,63,.5); }
  }

  /* ---------- the wake: a git-graph of shipped/merged runs landing on main (#176) ----------
     A dedicated band that reads like `git log --graph`: recently LANDED runs (the recent-
     voyages set) as commits on a single VERTICAL trunk, NEWEST AT TOP, each node deep-linking
     to its merge commit — `● <sha>  #<n>  <title>` per row, with `HEAD → main` on the tip.
     Fed ONLY from existing recentRuns + merge-commit refs already in the snapshot (READ-ONLY,
     no new git history), bounded to the recent window. Rendered as its OWN band (like the
     manifest bar) above both layouts, so it never crowds the KANBAN lanes. Scrolls vertically
     inside itself past a tall window so the page body never grows unbounded. */
  .wake {
    margin: 0;
    background:
      radial-gradient(500px 220px at 80% -20%, rgba(198,168,106,.12), rgba(198,168,106,0) 60%),
      linear-gradient(180deg, #0c1e30, #0a1826);
    border: 1px solid var(--wood-edge); border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.06), 0 6px 18px rgba(0,0,0,.3);
    padding: 12px 4px 8px;
  }
  .wake-head { display: flex; flex-direction: column; gap: 3px; padding: 0 12px 8px; }
  .wake-head h2 {
    margin: 0; font-family: var(--serif); font-size: 13px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--brass); font-weight: 600;
  }
  .wake-head h2 .branch { color: var(--brass-bright); margin-right: .4em; letter-spacing: normal; }
  .wake-sub { color: var(--ink-faint); font-family: var(--mono); font-size: 10.5px; letter-spacing: .01em; }

  /* the graph — a scroll box holding the branching commit tree. Bounded to the viewport
     height and scrolls internally past a tall recent window. */
  .wake-graph { padding: 0 4px 2px; max-height: calc(100vh - 150px);
    overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  /* one commit row = a rail cell (an SVG drawing the main trunk PLUS this PR's branch,
     curving out of main and merging back at the commit node — the branch/merge railroad of
     `git log --graph`) beside the commit body. A FIXED row height makes each row's trunk
     segment abut the next into one continuous main line, with a branch on every commit. */
  .gc-row { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: stretch; height: 52px; }
  .gc-rail { position: relative; }
  .gc-rail svg { display: block; width: 60px; height: 52px; overflow: visible; }
  .gc-trunk { fill: none; stroke: var(--brass); stroke-width: 2.2; }
  .gc-branch { fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .gc-branch.merged { stroke: var(--done); }
  .gc-branch.shipped { stroke: var(--brass-bright); }
  /* the merge commit node on the trunk + the smaller branch-tip node (the PR's own commit) */
  .gc-node { stroke: var(--abyss); stroke-width: 2; }
  .gc-node.merged { fill: var(--done); }
  .gc-node.shipped { fill: var(--brass); }
  .gc-tip { stroke: var(--abyss); stroke-width: 1.5; }
  .gc-tip.merged { fill: var(--done); }
  .gc-tip.shipped { fill: var(--brass); }

  .gc-body { display: flex; flex-direction: column; justify-content: center; text-decoration: none;
    color: inherit; min-width: 0; padding: 5px 8px 5px 2px; }
  a.gc-body:hover .gc-num { color: var(--brass-bright); }
  a.gc-body:hover .gc-sha { color: var(--brass); }
  a.gc-body:hover .gc-sha .ext { opacity: 1; }
  a.gc-body:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
  .gc-line1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .gc-num { font-family: var(--mono); font-weight: 650; font-size: 12px; color: var(--brass); flex: none; }
  .gc-sha { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .02em;
    display: inline-flex; align-items: baseline; flex: none; }
  .gc-sha .ext { opacity: .55; margin-left: 1px; font-size: 8px; vertical-align: super; }
  .gc-pill { margin-left: auto; font-size: 8px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 999px; border: 1px solid currentColor; flex: none; }
  .gc-pill.merged { color: var(--done); }
  .gc-pill.shipped { color: var(--brass); }
  .gc-ref { font-family: var(--mono); font-size: 8.5px; font-weight: 650; letter-spacing: .02em;
    color: #06231a; background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    border-radius: 999px; padding: 1px 6px; flex: none; }
  .gc-title { color: var(--parch); font-weight: 600; font-size: 12px; margin-top: 3px; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- focused detail panel (#164) — click a board card to expand ----------
     The KANBAN cards are too narrow to expand inline, so a click opens the run's full
     detail (pipeline / worktree / branch / per-model cost table / logbook video / review
     state) in a focused modal panel over the board. It REUSES renderCard(run), so it shows
     exactly the same detail the list view expands inline — nothing new to keep in sync.
     Keyboard-accessible: role=dialog, focus moves in on open and restores on close, Escape
     or a backdrop click closes, Tab is trapped inside. READ-ONLY like everything else. */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start;
    justify-content: center; padding: 40px 18px; overflow-y: auto;
    background: rgba(4, 10, 17, .68); backdrop-filter: blur(2px);
    animation: overlay-in .16s ease-out;
  }
  .detail-overlay[hidden] { display: none; }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  .detail-panel {
    width: 100%; max-width: 720px; margin: auto 0;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--brass-dim); border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(198,168,106,.1);
    animation: panel-in .18s ease-out;
  }
  @keyframes panel-in { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
  .detail-panel.blocked { border-color: #532a20; }
  .detail-head {
    display: flex; align-items: center; gap: 11px; padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }
  .detail-head .dh-ship { width: 26px; height: 20px; flex: none; display: inline-flex; }
  .detail-head .dh-ship svg { width: 100%; height: 100%; }
  .detail-head .dh-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 13px;
    text-decoration: none; flex: none; }
  a.detail-head .dh-num:hover { text-decoration: underline; }
  .detail-head .dh-title { color: var(--parch); font-weight: 600; font-size: 14.5px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .detail-head .dh-status { font-size: 11.5px; font-weight: 600; white-space: nowrap; flex: none; }
  .detail-close {
    font: inherit; font-size: 18px; line-height: 1; color: var(--ink-dim); background: var(--chip);
    border: 1px solid var(--wood-edge); border-radius: 999px; width: 30px; height: 30px; flex: none;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .detail-close:hover { border-color: var(--brass); color: var(--parch); }
  .detail-close:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  /* The reused log card sits flush inside the panel (drop its own top border/radius). */
  .detail-content > .logcard, .detail-content > .summary-card {
    border: 0; border-radius: 0 0 14px 14px;
  }
  @media (prefers-reduced-motion: reduce) {
    .detail-overlay, .detail-panel { animation: none; }
  }

  /* ---------- live activity feed / ticker (#186) ----------
     A slim, fleet-wide strip that streams what every IN-FLIGHT run is doing RIGHT NOW —
     its current liveness PHASE + the latest activity NOTE the beat carried — for builds
     (shipwright: research→…→opening-pr) AND reviews (muster: reviewing→visual-inspection→
     posting) alike. It rides above BOTH the list and KANBAN layouts (in the .main column,
     never the git-tree aside), so it never crowds the lanes or the tree. When the items
     overflow the strip it marquees gently; hovering pauses it for reading. Under
     prefers-reduced-motion (and whenever the items already fit) it becomes a STATIC,
     wrapping strip with no motion at all. Hidden entirely when nothing is in flight /
     nothing is beating — it degrades to absent, never an error. READ-ONLY. */
  .feed { margin: 10px 0 2px; }
  .feed-panel {
    border: 1px solid var(--wood-edge); border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, rgba(24,45,67,.72), rgba(10,29,48,.72));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 6px 18px rgba(3,10,18,.28);
  }
  .feed-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
    background: rgba(10,20,32,.35);
  }
  .feed-head .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--done); flex: 0 0 auto;
    box-shadow: 0 0 0 0 rgba(55,181,140,.55); animation: feed-pulse 2.4s ease-out infinite;
  }
  @keyframes feed-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(55,181,140,.55); }
    70%  { box-shadow: 0 0 0 7px rgba(55,181,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(55,181,140,0); }
  }
  .feed-head .fh-count { margin-left: auto; color: var(--ink-faint); letter-spacing: .06em; text-transform: none; font-size: 11px; }
  .feed-viewport { position: relative; overflow: hidden; }
  /* soft fade at both edges so a scrolling item slides in/out of view, not a hard cut. */
  .feed-viewport::before, .feed-viewport::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 34px; z-index: 2; pointer-events: none;
  }
  .feed-viewport::before { left: 0; background: linear-gradient(90deg, rgba(11,26,42,.95), rgba(11,26,42,0)); }
  .feed-viewport::after  { right: 0; background: linear-gradient(270deg, rgba(11,26,42,.95), rgba(11,26,42,0)); }
  .feed-track { display: flex; align-items: center; gap: 26px; padding: 8px 14px; width: max-content; }
  .feed-track.marquee { animation: feed-marquee linear infinite; will-change: transform; }
  .feed-viewport:hover .feed-track.marquee, .feed-viewport:focus-within .feed-track.marquee { animation-play-state: paused; }
  @keyframes feed-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  /* static (fits, or reduced-motion): wrap the items, no track scroll, no edge fades needed. */
  .feed-track.static { flex-wrap: wrap; width: auto; gap: 8px 22px; }
  .feed-item { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .feed-item .fi-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: var(--fc, var(--building)); box-shadow: 0 0 7px var(--fc, var(--building));
  }
  .feed-item .fi-num { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); }
  .feed-item .fi-phase {
    font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--fc, var(--building));
    border: 1px solid currentColor; border-radius: 999px; padding: 1px 7px; opacity: .92;
  }
  .feed-item .fi-sep { color: var(--ink-faint); }
  .feed-item .fi-note { font-size: 12.5px; color: var(--ink-dim); }
  @media (prefers-reduced-motion: reduce) {
    .feed-head .live-dot { animation: none; }
    .feed-track.marquee { animation: none; }
  }
  @media (max-width: 640px) {
    .feed-item .fi-note { font-size: 12px; }
  }
</style>
</head>
<body>
