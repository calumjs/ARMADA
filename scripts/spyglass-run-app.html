// Draw the directed edges as SVG beziers once the node boxes are laid out. Measured
// against the SVG's own client rect, so it's correct at any horizontal scroll offset.
function drawGraphEdges(graph, svg, edges, nodeEl) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const W = graph.scrollWidth, H = graph.scrollHeight;
  svg.style.width = W + "px"; svg.style.height = H + "px";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const defs = document.createElementNS(SVGNS, "defs");
  const markers = { depends: "var(--awaiting)", "same-file": "var(--review)", lockfile: "var(--brass)", base: "var(--ink-dim)", satisfied: "var(--done)" };
  for (const [k, c] of Object.entries(markers)) {
    const mk = document.createElementNS(SVGNS, "marker");
    mk.setAttribute("id", "ah-" + k); mk.setAttribute("viewBox", "0 0 10 10");
    mk.setAttribute("refX", "9"); mk.setAttribute("refY", "5");
    mk.setAttribute("markerWidth", "9"); mk.setAttribute("markerHeight", "9");
    mk.setAttribute("orient", "auto"); mk.setAttribute("markerUnits", "userSpaceOnUse");
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", "M0 0 L10 5 L0 10 z"); p.setAttribute("fill", c);
    mk.appendChild(p); defs.appendChild(mk);
  }
  svg.appendChild(defs);
  const sr = svg.getBoundingClientRect();
  // getBoundingClientRect returns *zoomed* pixels, but the SVG viewBox is sized in layout
  // pixels (W/H from scrollWidth/Height). When an ancestor sets CSS zoom — the livestream
  // applies document.body.style.zoom = 1.3 — every measured coordinate is scaled by the
  // zoom while the viewBox is not, so edges land ~zoom× too far and clip off-canvas (the
  // "broken arrow on the stream" that renders fine at zoom 1). Divide measured coords back
  // into layout space by the factor the SVG itself is scaled by (rendered width ÷ viewBox W).
  const zf = W && sr.width ? sr.width / W : 1;
  const leftMid = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - sr.left) / zf, y: (r.top - sr.top + r.height / 2) / zf }; };
  const rightMid = (el) => { const r = el.getBoundingClientRect(); return { x: (r.right - sr.left) / zf, y: (r.top - sr.top + r.height / 2) / zf }; };
  for (const e of edges) {
    const fromEl = nodeEl.get(e.from), toEl = nodeEl.get(e.to);
    if (!fromEl || !toEl) continue;
    const mk = e.satisfied ? "satisfied" : (markers[e.kind] ? e.kind : "depends");
    const color = e.satisfied ? "var(--done)" : (EDGE_COLOR[e.kind] || "var(--awaiting)");
    const a = leftMid(fromEl), b = rightMid(toEl);   // dependent's left → prerequisite's right
    const dx = Math.max(26, Math.abs(a.x - b.x) * 0.45);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", `M ${a.x} ${a.y} C ${a.x - dx} ${a.y}, ${b.x + dx} ${b.y}, ${b.x} ${b.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", e.satisfied ? "1.4" : "1.8");
    path.setAttribute("opacity", e.satisfied ? "0.5" : "0.85");
    if (EDGE_DASH[e.kind]) path.setAttribute("stroke-dasharray", EDGE_DASH[e.kind]);
    path.setAttribute("marker-end", `url(#ah-${mk})`);
    if (e.reason) { const t = document.createElementNS(SVGNS, "title"); t.textContent = e.reason; path.appendChild(t); }
    svg.appendChild(path);
  }
}

function renderHorizon(state) {
  const wrap = document.getElementById("horizon");
  wrap.textContent = "";
  horizonRedraw = null;
  const sched = state && state.scheduler;
  if (!sched || !Array.isArray(sched.nodes) || !sched.nodes.length) return;
  const waiting = sched.nodes.filter((n) => n.waiting);
  if (!waiting.length) return;
  const nodes = sched.nodes, edges = Array.isArray(sched.edges) ? sched.edges : [];

  const lane = $("div", "horizon");
  const head = $("div", "lane-head");
  const h2 = $("h2"); h2.appendChild($("span", "glyph", "🧭")); h2.appendChild(document.createTextNode("on the horizon"));
  head.appendChild(h2);
  const elig = waiting.filter((n) => n.eligible).length;
  const sub = $("span", "lane-sub", `${waiting.length} waiting · ${elig} clear to sail · ${waiting.length - elig} held`);
  head.appendChild(sub);
  head.appendChild($("span", "spacer"));
  if (sched.source === "inferred") { const note = $("span", "h-note", "⚑ best-effort graph"); note.title = sched.note || "inferred from issue/PR bodies + file overlap"; head.appendChild(note); }
  lane.appendChild(head);
  lane.appendChild($("div", "h-caption", "Left to right: what must land before what. Glowing hulls are the runnable frontier — clear to sail now; dimmed hulls are held, each with its reason."));

  const rank = rankNodes(nodes, edges);
  let maxRank = 0; for (const v of rank.values()) maxRank = Math.max(maxRank, v);
  const cols = []; for (let i = 0; i <= maxRank; i++) cols.push([]);
  const ordered = nodes.slice().sort((a, b) => (Number(b.waiting) - Number(a.waiting)) || (a.number - b.number));
  for (const n of ordered) (cols[rank.get(n.number) || 0]).push(n);

  const graph = $("div", "graph");
  const svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("class", "graph-edges");
  graph.appendChild(svg);
  const colsWrap = $("div", "graph-cols");
  const nodeEl = new Map();
  cols.forEach((colNodes, ci) => {
    const col = $("div", "graph-col");
    const ch = $("div", "col-head" + (ci === 0 ? " frontier" : ""));
    ch.textContent = ci === 0 ? "no dependency ahead" : `waits on ← (depth ${ci})`;
    col.appendChild(ch);
    for (const n of colNodes) { const el = renderGnode(n); nodeEl.set(n.number, el); col.appendChild(el); }
    colsWrap.appendChild(col);
  });
  graph.appendChild(colsWrap);
  lane.appendChild(graph);

  if (edges.length) {
    lane.appendChild(graphLegend(new Set(edges.map((e) => e.kind))));
  } else {
    lane.appendChild($("div", "graph-flat-note", "No dependencies or conflicts among the waiting runs — every hull is clear to sail (the fleet dispatches them as slots free)."));
  }
  wrap.appendChild(lane);

  // Draw edges after the boxes have laid out; keep a redraw hook for resize.
  const draw = () => drawGraphEdges(graph, svg, edges, nodeEl);
  horizonRedraw = draw;
  requestAnimationFrame(draw);
}

// ---- the wake: commit-graph of shipped/merged runs landing on main (#176) --
// A dedicated horizontal band that reads like `git log --graph`: recently LANDED
// runs (the recent-voyages set) as commits on a single trunk, NEWEST AT LEFT, each
// node deep-linking to its merge commit. Fed ONLY from the existing recentRuns +
// the merge-commit refs already in the snapshot — no new git history is fetched, and
// it never mutates anything (READ-ONLY). Bounded to the recent window (recentRuns is
// already capped by the driver's recentWindow). Rendered as its own band above both
// layouts (like the manifest bar) so it never crowds the KANBAN lanes. Renders
// nothing when nothing has landed yet.
// The rail SVG for one commit row: the main trunk segment PLUS a branch peeling off the
// trunk, out to the PR's own commit node, and merging back into the merge node on main —
// a real branch/merge, the `git log --graph` railroad. `pos` trims the trunk cleanly at
// the newest/oldest ends; `lane` alternates the branch depth so the tree reads with some
// life rather than as a flat line. Colour-keyed by outcome (merged = green, shipped = brass).
function wakeRail(kind, pos, lane) {
  const NS = "http://www.w3.org/2000/svg";
  const xMain = 17, nodeY = 26, laneX = lane ? 50 : 40, tipY = 9;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 60 52");
  svg.setAttribute("aria-hidden", "true");
  const path = (d, cls) => { const p = document.createElementNS(NS, "path"); p.setAttribute("class", cls); p.setAttribute("d", d); return p; };
  const dot = (cx, cy, r, cls) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("class", cls); c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r); return c; };
  // trunk segment — full row height so rows abut into one line; trimmed at the end nodes.
  let d = `M${xMain} 0 V52`;
  if (pos === "first") d = `M${xMain} ${nodeY} V52`;
  else if (pos === "last") d = `M${xMain} 0 V${nodeY}`;
  else if (pos === "only") d = null;
  if (d) svg.appendChild(path(d, "gc-trunk"));
  // the branch — a single open curve sweeping up-and-out from the merge node on main to
  // the PR's own commit (the tip), the `|\` of a merge in `git log --graph`; not a loop.
  svg.appendChild(path(
    `M${xMain} ${nodeY} C ${xMain + 13} ${nodeY} ${laneX} ${nodeY - 8} ${laneX} ${tipY}`,
    "gc-branch " + kind));
  svg.appendChild(dot(laneX, tipY, 3.2, "gc-tip " + kind));   // the PR's own branch commit
  svg.appendChild(dot(xMain, nodeY, 5, "gc-node " + kind));   // the merge, landing on main
  return svg;
}
function renderCommitRow(run, isHead, pos, lane) {
  const merged = run.outcome === "Merged";
  const kind = merged ? "merged" : "shipped";
  // number → the PR when there is one (the merge lands the PR), else the issue.
  const num = "#" + (run.prNumber ?? run.issueNumber ?? "?");
  const row = $("div", "gc-row");

  // rail cell — the branch/merge graphic for this commit.
  const rail = $("div", "gc-rail");
  rail.appendChild(wakeRail(kind, pos, lane));
  row.appendChild(rail);

  // body — links to the MERGE COMMIT when its ref is known (the AC), else the PR, else
  // the issue: always the deepest link available. Read-only, new tab.
  const url = run.mergeCommitUrl || run.prUrl || run.issueUrl;
  const body = url ? $("a", "gc-body") : $("div", "gc-body");
  if (url) {
    body.href = url; body.target = "_blank"; body.rel = "noopener";
    body.title = run.mergeCommitUrl
      ? `${run.outcome} — open the merge commit ${String(run.mergeCommitOid).slice(0, 10)} for ${num} on GitHub`
      : `open ${num} on GitHub`;
  } else {
    body.title = esc(run.title || "");
  }
  const l1 = $("div", "gc-line1");
  l1.appendChild($("span", "gc-num", num));
  // like `git log --oneline`: the short merge-commit sha (when known).
  if (run.mergeCommitOid) {
    const sha = $("span", "gc-sha", String(run.mergeCommitOid).slice(0, 7));
    if (run.mergeCommitUrl) { const ext = $("span", "ext", "↗"); ext.setAttribute("aria-hidden", "true"); sha.appendChild(ext); }
    l1.appendChild(sha);
  }
  l1.appendChild($("span", "gc-pill " + kind, merged ? "merged" : "shipped"));
  body.appendChild(l1);
  body.appendChild($("div", "gc-title", esc(run.title || "")));
  row.appendChild(body);
  return row;
}
function renderWake(state, recentRuns) {
  const wrap = document.getElementById("gittree");
  wrap.textContent = "";
  // Only runs that actually LANDED on main — merged/shipped, not blocked (a blocked
  // recent run never reached the trunk). recentRuns arrive newest-completed-first, so
  // the trunk reads newest-at-top with no re-sort.
  const landed = (recentRuns || []).filter((r) => !r.blocked && (r.outcome === "Merged" || r.outcome === "Shipped"));
  if (!landed.length) return;

  const band = $("div", "wake");
  const head = $("div", "wake-head");
  const h2 = $("h2");
  h2.appendChild($("span", "branch", "⎇"));
  h2.appendChild(document.createTextNode("the fleet's wake"));
  head.appendChild(h2);
  head.appendChild($("span", "wake-sub", `${landed.length} landed on main · newest first`));
  band.appendChild(head);

  const graph = $("div", "wake-graph");
  const n = landed.length;
  landed.forEach((run, i) => {
    const pos = n === 1 ? "only" : i === 0 ? "first" : i === n - 1 ? "last" : "mid";
    graph.appendChild(renderCommitRow(run, i === 0, pos, i % 2 === 1));
  });
  band.appendChild(graph);
  wrap.appendChild(band);
}

// ---- render ---------------------------------------------------------------
let lastState = null;
function render(state) {
  lastState = state;
  estRatePerMin = (state && Number(state.estRatePerMin)) || 0;   // drives the live in-flight estimate (#115)
  const sub = document.getElementById("sub");
  const wrap = document.getElementById("runs");
  const harbourEl = document.getElementById("harbour");
  const mergeEl = document.getElementById("mergequeue");
  wrap.textContent = "";
  const runs = (state && state.runs) || [];
  const recentRuns = (state && state.recentRuns) || [];
  // The active stage/state filter (#164) narrows what the lanes render. The manifest
  // gauges + transition detection stay on the FULL sets, so the operator still sees the
  // whole fleet's counts (and can click a gauge to filter) and flourishes fire regardless.
  const filtering = filterMode !== "all";
  const fRuns = runs.filter(matchesFilter);
  const fRecent = recentRuns.filter(matchesFilter);
  const stamp = state && state.generatedAt ? new Date(state.generatedAt).toLocaleTimeString() : "";
  const filterNote = filtering ? ` · filtered: ${filterMode}` : "";
  sub.textContent = `${esc(state && state.repo)} · ${runs.length} run(s) · ${esc((state && state.summary) || "")}${filterNote}${stamp ? " · charted " + stamp : ""}`;

  setWeather(runs);
  setAmbientTempo(runs);   // ambient "visual tempo" scales with live fleet busyness (#179)

  // prune expand state for runs that have left BOTH lanes (a run merging moves
  // from in-flight to the harbour — keep its expanded state across that hop).
  const live = new Set([...runs, ...recentRuns].map(runKey));
  for (const k of Array.from(expanded)) if (!live.has(k)) expanded.delete(k);
  for (const k of Array.from(userCollapsed)) if (!live.has(k)) userCollapsed.delete(k);

  if (state && state.degraded) {
    document.getElementById("scoreboard").textContent = "";
    document.getElementById("fleet").textContent = "";
    document.getElementById("feed").textContent = "";
    document.getElementById("gittree").textContent = "";
    document.getElementById("board").textContent = "";
    document.getElementById("horizon").textContent = "";
    harbourEl.textContent = "";
    mergeEl.textContent = "";
    const e = $("div", "empty");
    e.appendChild($("div", "glyph", "🧭"));
    e.appendChild($("div", "big", "no runs to chart"));
    e.appendChild($("div", "sub", esc(state.degraded)));
    wrap.appendChild(e);
    // The data vanished (degraded snapshot) and the board is now cleared — an open detail
    // panel would keep showing stale content over nothing, so close it here too (#164). This
    // early return precedes the usual refreshDetailPanel() call below, so do it explicitly.
    closeDetailPanel();
    prevState = new Map();
    boardPainted = false;   // the board was cleared — the next real paint settles calmly (#177)
    return;
  }
  if (!runs.length && !recentRuns.length) {
    document.getElementById("scoreboard").textContent = "";
    document.getElementById("fleet").textContent = "";
    document.getElementById("feed").textContent = "";
    document.getElementById("gittree").textContent = "";
    document.getElementById("board").textContent = "";
    document.getElementById("horizon").textContent = "";
    harbourEl.textContent = "";
    mergeEl.textContent = "";
    const e = $("div", "empty");
    e.appendChild($("div", "glyph", "⚓"));
    e.appendChild($("div", "big", "an empty harbour"));
    e.appendChild($("div", "sub", "The fleet is idle — no armed issues, open PRs, or recent voyages."));
    wrap.appendChild(e);
    // No runs left to chart — the board is cleared, so an open detail panel has nothing
    // behind it; close it here too (this early return precedes refreshDetailPanel() below) (#164).
    closeDetailPanel();
    prevState = new Map();
    boardPainted = false;   // the board was cleared — the next real paint settles calmly (#177)
    return;
  }

  renderScoreboard(state);    // today's scoreboard banner — rides at the very top (#193)
  renderFleet(state, runs);   // the manifest bar rides above BOTH layouts
  renderFeed(runs);           // the live activity ticker — fleet-wide, above BOTH layouts (#186)
  renderWake(state, recentRuns);   // the commit-graph of landed runs, also above BOTH layouts (#176)

  // Transitions across BOTH lanes, computed once regardless of layout so the chime and
  // "just shipped" flourish fire the same way in list or board view.
  const events = detectTransitions([...runs, ...recentRuns]);

  const boardEl = document.getElementById("board");
  if (viewMode === "board") {
    // KANBAN board (#163) is the single per-run surface — the in-flight list, harbour,
    // merge queue and horizon lanes are hidden so runs aren't double-listed. The board
    // itself carries in-flight AND recent runs, grouped into their real stage lanes. Under
    // an active filter (#164) only matching cards populate; every lane still renders
    // (labelled), so the board is visibly narrowed to the chosen stage/state.
    mergeEl.textContent = "";
    harbourEl.textContent = "";
    wrap.textContent = "";
    renderBoardAnimated(state, fRuns, fRecent);
    // The cross-run dependency graph renders UNDER the board too (#174) — #horizon sits
    // right after #board in the DOM (with the now-empty merge/runs lanes collapsed between
    // them), so this lands it directly beneath the lanes, matching its list-view role.
    // renderHorizon self-hides when the scheduler surfaces no waiting runs, so with no
    // cross-run dependencies the board simply shows nothing beneath it (an empty graph,
    // not a missing render). Independent of the filter — the board shows every lane, so the
    // dependency graph rides along with it.
    renderHorizon(state);
  } else {
    boardEl.textContent = "";
    // Under a filter, the contextual lanes only make sense for their own state: the horizon
    // is the QUEUED/waiting graph, the merge queue is AWAITING-MERGE PRs — hide each when the
    // filter excludes it, so "building only" (say) doesn't leave an unrelated lane on screen.
    const showHorizon = !filtering || filterMode === "queued";
    const showMergeQueue = !filtering || filterMode === "awaiting-merge";
    // The ready-to-merge lane (#140) — reviewed-clean, mergeable, unmerged PRs awaiting a
    // human merge, surfaced prominently (they also stay in the voyage list below).
    if (showMergeQueue) renderMergeQueue(state); else mergeEl.textContent = "";
    // The horizon — the waiting-runs dependency graph (#111). Queued/held runs render
    // here as a graph, so pull them OUT of the in-flight voyage list below to avoid
    // double-listing them (only when the scheduler actually surfaces them as waiting).
    if (showHorizon) renderHorizon(state); else document.getElementById("horizon").textContent = "";
    const sched = state && state.scheduler;
    const waitingNums = showHorizon
      ? new Set(((sched && sched.nodes) || []).filter((n) => n.waiting).map((n) => n.number))
      : new Set();
    const flightRuns = fRuns.filter((r) => !(r.issueNumber != null && waitingNums.has(r.issueNumber) && groupOf(r) === "queued"));
    if (flightRuns.length) {
      for (const run of sortRuns(flightRuns)) wrap.appendChild(renderRun(run));
    } else if (filtering && !fRecent.length && !(showHorizon && waitingNums.size)) {
      // A filter is on and nothing under way, waiting, or in the harbour matches it.
      wrap.appendChild($("div", "lane-note", `No ${filterMode} voyages right now — clear the filter to see the whole fleet.`));
    } else if (!filtering && !waitingNums.size) {
      // Nothing under way and nothing waiting, but the harbour has recent arrivals.
      wrap.appendChild($("div", "lane-note", "No voyages under way — the fleet is idle. Recent arrivals below."));
    }
    renderHarbour(state, fRecent);
  }
  // keep any open board-detail panel in sync with the fresh data (or close it) (#164)
  refreshDetailPanel();

  // flourish + optional chime for ship/block transitions (either lane, either layout)
  for (const ev of events) {
    const block = document.querySelector(`.run[data-key="${CSS.escape(ev.key)}"], .kcard[data-key="${CSS.escape(ev.key)}"]`);
    if (ev.kind === "shipped" && block) {
      block.classList.add("just-shipped");
      // celebratory flourish (#127): a brief "just shipped" pennant rising off the row,
      // on top of the existing glow. Appended once; self-removes after the animation.
      const pennant = $("span", "landed-pennant", "⚓ just shipped");
      block.appendChild(pennant);
      setTimeout(() => pennant.remove(), 3400);
      // celebratory BURST (#178): an emerald flash sweeping the card, layered over the
      // glow + pennant. Inert overlay, self-removes; a no-op under reduced-motion (CSS).
      const burst = $("span", "fx-burst");
      block.appendChild(burst);
      setTimeout(() => burst.remove(), 1300);
    } else if (ev.kind === "blocked" && block) {
      // storm BURST (#178): a red shockwave flash + brief shake the instant a run is
      // blocked — the alarming counterpart to the ship burst, over the steady blocked
      // pulse. Inert overlay, self-removes; a no-op under reduced-motion (CSS).
      const storm = $("span", "fx-storm");
      block.appendChild(storm);
      setTimeout(() => storm.remove(), 1200);
    }
    foghorn(ev.kind);
  }
}

let lastStamp = null;
let bootVersion = null;       // appVersion captured on the first successful load
let pendingVersion = null;    // a differing appVersion seen once — reload only if it persists (debounce)
async function poll() {
  try {
    const res = await fetch("./run-state.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const state = await res.json();
      // Auto-reload when a NEW dashboard version ships (SKILL §6). Capture the
      // boot version on first load; thereafter, if the snapshot carries a
      // DIFFERENT appVersion, reload to load the new UI — but only after the new
      // value repeats on a second consecutive poll (debounce), so a mid-deploy
      // snapshot can't thrash. If appVersion is absent (older driver) this is
      // inert: we never reload, and the app data-polls exactly as before.
      const ver = state.appVersion;
      if (ver == null) {
        // Absent stamp (older driver / unreadable app): fully inert — never reload,
        // and clear any pending debounce so a null gap can't stand in for a
        // consecutive confirming poll (reload needs two ACTUAL equal readings).
        pendingVersion = null;
      } else if (bootVersion == null) {
        bootVersion = ver;
      } else if (ver !== bootVersion) {
        if (pendingVersion === ver) { location.reload(); return; }
        pendingVersion = ver;
      } else pendingVersion = null;
      if (state.generatedAt !== lastStamp) { lastStamp = state.generatedAt; render(state); }
    }
  } catch (e) {
    const sub = document.getElementById("sub");
    if (sub && lastStamp == null) sub.textContent = "waiting for run-state.json …";
  }
}
poll();
setInterval(poll, 4000);
</script>
</body>
</html>
