<script>
"use strict";

// ---- small helpers --------------------------------------------------------
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = (s) => String(s == null ? "" : s);
function compact(n) {
  if (n == null || !Number.isFinite(n)) return null;
  if (Math.abs(n) >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(n);
}
// A positive amount below a cent would render "$0.00" under toFixed(2) — a real but
// mis-reading figure. Show "<$0.01" so a genuine sub-cent cost is never confused with
// zero / no-data (#121). Exactly-zero and non-numbers are handled by the caller (→ —).
function money(n) {
  if (n == null || !Number.isFinite(n)) return null;
  if (n > 0 && n < 0.005) return "<$0.01";
  return "$" + n.toFixed(2);
}
// Compact a token COUNT to a short human figure — 1234 → "1.2k", 1_200_000 → "1.2M".
// Distinct from compact() (which only does k) so a run's millions of tokens read
// cleanly on the run card. Null / non-finite / negative → null (→ omitted). (#149.)
function compactTok(n) {
  if (n == null || !Number.isFinite(n) || n < 0) return null;
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n % 1e3 === 0 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(Math.round(n));
}
// Per-run TOKEN USAGE for the card (#149). Reads run.cost.tokens (threaded from the
// same cost signals) → { text:"1.2M tok", title } or null when unavailable, so the
// caller shows tokens next to cost when present and omits them gracefully when not.
// A run with only a total (no in/out split) still renders the total. Cache tokens
// fold into the total server-side; the tooltip breaks out in/out for the operator.
function tokenInfo(run) {
  const t = run && run.cost && run.cost.tokens;
  if (!t) return null;
  const total = typeof t.total === "number" && Number.isFinite(t.total) && t.total > 0 ? t.total : null;
  if (total == null) return null;
  const text = compactTok(total) + " tok";
  const parts = [];
  if (typeof t.input === "number") parts.push("in " + compactTok(t.input));
  if (typeof t.output === "number") parts.push("out " + compactTok(t.output));
  if (typeof t.cacheRead === "number" && t.cacheRead > 0) parts.push("cache r " + compactTok(t.cacheRead));
  if (typeof t.cacheWrite === "number" && t.cacheWrite > 0) parts.push("cache w " + compactTok(t.cacheWrite));
  const title = "tokens — total " + total.toLocaleString() + (parts.length ? " (" + parts.join(" · ") + ")" : "");
  return { text, title, total, input: t.input, output: t.output };
}
// ---- per-run MODEL breakdown (#151) ---------------------------------------
// A short, friendly label from a raw model id: "claude-opus-4-8" → "Opus 4.8";
// "claude-sonnet-4-5-20250929" → "Sonnet 4.5"; "gpt-5.4" → "GPT-5.4"; a codex
// signal → "Codex". Falls back to a trimmed raw id so an unknown model still
// reads as something rather than vanishing.
function shortModel(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return "?";
  const low = s.toLowerCase();
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  let m = low.match(/(opus|sonnet|haiku)[-_.]?(\d+)[-_.](\d+)/);
  if (m) return cap(m[1]) + " " + m[2] + "." + m[3];
  m = low.match(/(opus|sonnet|haiku)[-_.]?(\d+)/);
  if (m) return cap(m[1]) + " " + m[2];
  if (/codex/.test(low)) return "Codex";
  m = low.match(/gpt[-_ ]?([\d.]+)/);
  if (m) return "GPT-" + m[1];
  let t = s.replace(/[-_]\d{6,8}$/, "");            // strip a trailing YYYYMMDD
  return t.length > 18 ? t.slice(0, 17) + "…" : t;
}
// Stable, distinct swatch palette for the model share bar — brass-led so it sits
// in the ARMADA theme, then a spread of legible accents. Assigned by sorted order.
const MODEL_COLORS = ["#c6a86a", "#5aa9e6", "#37b58c", "#d98a5b", "#a98adf", "#e0563f", "#7cc4b0"];
// Per-run model breakdown for the card (#151). Reads run.cost.modelUsage (threaded
// from the same per-model cost rows) → { models:[{label,full,share,tokens,cost,color}],
// primary, count } or null when unavailable. share = token share, else cost share,
// else null — so a token-less/unpriced file still lists which models ran.
function modelInfo(run) {
  const mu = run && run.cost && run.cost.modelUsage;
  if (!Array.isArray(mu) || !mu.length) return null;
  const models = mu.map((r, i) => ({
    label: shortModel(r.model),
    full: String(r.model == null ? "?" : r.model),
    share: (typeof r.tokenShare === "number") ? r.tokenShare
         : (typeof r.costShare === "number") ? r.costShare : null,
    tokens: (typeof r.tokens === "number") ? r.tokens : null,
    cost: (typeof r.cost === "number") ? r.cost : null,
    color: MODEL_COLORS[i % MODEL_COLORS.length],
  }));
  return { models, primary: models[0], count: models.length };
}
// A one-line "Opus 4.8 72% · Sonnet 4.5 28%" summary for tooltips.
function modelSummary(mi) {
  return mi.models
    .map((m) => m.label + (m.share != null ? " " + Math.round(m.share * 100) + "%" : ""))
    .join(" · ");
}
// elapsed from an ISO start, in a compact ship's-log form; ticks live (see below).
function elapsedText(iso) {
  if (!iso) return null;
  const ms = Date.now() - Date.parse(iso);
  if (!Number.isFinite(ms)) return null;
  let s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (d) return `${d}d ${String(h).padStart(2, "0")}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

// ---- in-flight cost estimate (#115) ---------------------------------------
// The dashboard is strictly READ-ONLY and the harness surfaces a subagent's usage
// only at completion — no mid-build stream. So for a run that is actively working
// with no reconcile file yet, we show an HONEST estimate off the one live signal we
// have: elapsed build time (cost.costSince) × the fleet burn rate, computed here so
// it ticks every second alongside elapsed. It is a display derivation — never
// written back — and clearly labelled, converging to the real figure at completion.
let estRatePerMin = 0;                 // set from state.estRatePerMin on each render
function estFromSince(since) {
  if (!since || !(estRatePerMin > 0)) return null;
  const ms = Date.now() - Date.parse(since);
  if (!Number.isFinite(ms)) return null;
  return Math.max(0, (ms / 60000) * estRatePerMin);
}
function estCostLive(run) { return estFromSince(run && run.cost && run.cost.costSince); }

// What the compact row's cost cell should read — estimated / accruing / final.
// { text, cls, tag, title, since } so the row and the 1s ticker stay in agreement.
//   estimated (live)  → "~$X"  tag "est"     (elapsed estimate, ticks live)
//   estimate, no rate → "accruing…"          (no number — but never a false $0.00)
//   recorded+accruing → "$X"   tag "so far"  (real-so-far, still accruing)
//   recorded+final    → "$X"                 (settled — no caveat)
//   nothing yet / $0  → "—"                  (absent OR no PRICED usage — never $0.00)
function costCell(run) {
  const c = (run && run.cost) || {};
  // A recorded figure only counts as a real cost when it is a POSITIVE number.
  // totalCost === 0 means the run reconciled with no priced usage (e.g. unpriced
  // codex/gpt only, or an empty file) — a terminal run must degrade to "—", never
  // render a misleading "$0.00" (#121). Sub-cent positives read "<$0.01" via money().
  const rec = c.present && typeof c.totalCost === "number" && c.totalCost > 0;
  if (c.estimated) {
    const live = estCostLive(run);
    if (live == null) return { text: "accruing…", cls: "est accruing", tag: null, title: "cost is accruing — no usage recorded yet", since: null };
    return { text: "~" + money(live), cls: "est accruing", tag: "est", title: "estimate from elapsed build time — accruing, not billing", since: c.costSince };
  }
  if (rec && c.accruing) return { text: money(c.totalCost), cls: "est accruing", tag: "so far", title: "recorded so far — accruing, not final", since: null };
  if (rec) return { text: money(c.totalCost), cls: c.final ? "" : "est", tag: null, title: c.final ? "final cost — API-equivalent estimate, not billing" : "API-equivalent estimate, not billing", since: null };
  return { text: "—", cls: "", tag: null, title: null, since: null };
}

// The banner above the ledger table stating the run's cost phase (#115).
function ledgerStatus(run) {
  const c = (run && run.cost) || {};
  const rec = c.present && typeof c.totalCost === "number";
  if (c.estimated) {
    const live = estCostLive(run);
    const amt = live == null ? "" : ` — ~${money(live)} and climbing`;
    return { cls: "est", text: `estimating from elapsed build time${amt} · no real usage recorded yet, converges at completion` };
  }
  if (rec && c.accruing) return { cls: "est", text: "recorded so far — accruing, not final · more usage lands at review / ship" };
  if (rec && c.final) return { cls: "final", text: "final — reconciled at ship" };
  return null;
}

// state colour by coarse group (never colour alone — shape + printed name too)
const GROUP_COLOR = {
  queued: "var(--queued)", building: "var(--building)", reviewing: "var(--review)",
  "awaiting-merge": "var(--awaiting)", done: "var(--done)", blocked: "var(--blocked)",
};
// The gauges shown in the manifest bar, in voyage order (+ blocked).
const GAUGES = [
  ["queued", "queued"], ["building", "building"], ["reviewing", "reviewing"],
  ["awaiting-merge", "awaiting"], ["done", "done"], ["blocked", "blocked"],
];
// KANBAN lanes (#163) — ARMADA's REAL seven voyage stages, in pipeline order, matching
// the STAGES array in spyglass-run-snapshot.mjs (the genuine stageForIssue / stageForPr
// mapping — NOT an invented stage list). Each run lands in the column at its activeIndex.
// Used as a fallback for the column labels; the live names come from run.stages when present.
const STAGE_NAMES = ["Queued", "Building", "PR opened", "In review", "Awaiting merge", "Merged", "Shipped"];
// The coarse GROUP each stage belongs to — drives each lane's accent colour, in lockstep
// with groupForStage in the snapshot (Queued→queued, Building→building, PR opened/In review
// →reviewing, Awaiting merge→awaiting-merge, Merged/Shipped→done). Blocked is an overlay on
// the card, not a lane, so it isn't a column.
const STAGE_GROUP = ["queued", "building", "reviewing", "reviewing", "awaiting-merge", "done", "done"];

// vessel iconography — a little sloop, tinted by state colour.
function shipSVG(color) {
  return `<svg viewBox="0 0 28 21" fill="none" aria-hidden="true">
    <path d="M14 1 L14 12" stroke="${color}" stroke-width="1.3"/>
    <path d="M14 2 L22 11 L14 11 Z" fill="${color}" opacity=".9"/>
    <path d="M13 3 L7 11 L13 11 Z" fill="${color}" opacity=".55"/>
    <path d="M4 12 L24 12 L21 18 L7 18 Z" fill="${color}"/>
  </svg>`;
}

// ---- run identity + group fallback (mirror the driver) --------------------
const runKey = (run) => "r:" + (run.issueNumber != null ? "i" + run.issueNumber : "p" + run.prNumber);
const expanded = new Set();        // run keys the operator has opened — preserved across polls
const userCollapsed = new Set();   // active-build keys the operator manually collapsed despite auto-expand (#131)
let prevState = new Map();         // runKey -> { group, activeIndex, blocked } from the last render
let prevShippedToday = null;       // last-rendered shipped-today count — drives the manifest ticker flourish (#127)
let boardPainted = false;          // has the KANBAN board been painted at least once this board-view session?
                                   // gates the #177 lane-transition FLIP so a first paint (or a list→board
                                   // switch) settles calmly instead of animating every card at once.
let sortMode = "stage";
// The layout the operator has chosen: the default "list" (voyage rows + harbour) or
// the "board" KANBAN view (runs in lanes by pipeline stage — #163). Persisted in
// localStorage so the choice survives BOTH the live --watch data refresh (a re-render)
// AND the appVersion auto-reload (a full page reload). Read-only: a view preference,
// never a fleet mutation. Falls back to "list" if storage is unavailable/blocked.
let viewMode = "list";
try { const v = localStorage.getItem("spyglass:viewMode"); if (v === "board" || v === "list") viewMode = v; } catch { /* storage blocked — default list */ }

// The stage/state FILTER the operator has chosen (#164). "all" (default) shows every
// run; otherwise the board is narrowed to a single coarse GROUP — queued / building /
// reviewing / awaiting-merge / done — or the blocked overlay. Persisted in localStorage
// (like viewMode) so the choice survives BOTH the --watch data refresh (a re-render) AND
// the appVersion auto-reload (a full page reload). A view preference — never a mutation.
const FILTERS = ["all", "queued", "building", "reviewing", "awaiting-merge", "done", "blocked"];
let filterMode = "all";
try { const f = localStorage.getItem("spyglass:filter"); if (FILTERS.includes(f)) filterMode = f; } catch { /* storage blocked — default all */ }
// Does a run pass the active filter? "all" → everything; "blocked" → the blocked overlay
// (any run flagged blocked, whatever lane it approximates); else the run's coarse group.
function matchesFilter(run) {
  if (filterMode === "all") return true;
  if (filterMode === "blocked") return !!run.blocked;
  if (run.blocked) return false;              // a blocked run only shows under the "blocked" filter
  return groupOf(run) === filterMode;
}
// The run whose focused detail panel is OPEN (#164), by runKey — a board-card selection.
// A module var (not localStorage) so an open panel survives the --watch re-render but a
// fresh page load starts closed. null when nothing is open.
let selectedKey = null;
let lastFocusedEl = null;   // element to restore focus to when the panel closes

function groupOf(run) {
  if (run.group) return run.group;
  if (run.blocked) return "blocked";
  const i = run.activeIndex;
  if (run.terminal || i >= 5) return "done";
  if (i === 4) return "awaiting-merge";
  if (i === 2 || i === 3) return "reviewing";
  if (i === 1) return "building";
  return "queued";
}

// A run actively being built (armada:underway → group "building") auto-expands a
// compact summary card by default (#131), so the in-progress work reads as the most
// interesting thing on the board. Only genuine in-flight builds — never a recent,
// terminal, or blocked run.
function isActiveBuild(run) {
  return !run.recent && !run.terminal && !run.blocked && groupOf(run) === "building";
}
// A run at the IN-REVIEW stage auto-expands its summary card too (#172) — the same
// reviewer-facing affordance an active build gets (#131), so a reviewer sees the in-review
// run's panel open without a click. Only a genuine in-flight in-review run (never recent,
// terminal, or blocked), matched by the real "In review" stage at the active leg — not the
// whole "reviewing" group (which also covers the earlier "PR opened" stage).
function isInReview(run) {
  return !run.recent && !run.terminal && !run.blocked
    && groupOf(run) === "reviewing"
    && (run.stages || [])[run.activeIndex] === "In review";
}
// A run whose card auto-expands by default: an active build (#131) or an in-review run (#172).
// These share the summary-card affordance and the userCollapsed manual-collapse override.
function autoExpands(run) { return isActiveBuild(run) || isInReview(run); }
// Whether a run's card is open: an auto-expanding run (active build / in-review) is open BY
// DEFAULT (unless the operator has manually collapsed it); every other run opens only on an
// explicit manual expand.
function isRunOpen(run) {
  const key = runKey(run);
  if (autoExpands(run)) return !userCollapsed.has(key);
  return expanded.has(key);
}

// The voyage bar — one leg per real stage, a vessel marker on the active leg.
function buildVoyage(run) {
  const bar = $("span", "voyage");
  const n = (run.stages || []).length || 7;
  const color = GROUP_COLOR[groupOf(run)] || "var(--building)";
  for (let i = 0; i < n; i++) {
    const leg = $("span", "leg");
    if (run.blocked && i === run.activeIndex) leg.classList.add("blocked");
    else if (i < run.activeIndex) leg.classList.add("done");
    else if (i === run.activeIndex) { leg.classList.add(run.terminal ? "done" : "active"); leg.style.color = color; }
    bar.appendChild(leg);
  }
  return bar;
}

// A row deep-link affordance (#127): the number → the run's own GitHub page (its
// issue, or its PR when there is no issue); the title → the PR when one exists (else
// the issue). READ-ONLY — just links, opened in a NEW tab (target=_blank, rel=noopener),
// no mutation. Falls back to a plain span when no URL is known (degraded / repo not
// resolved) so the row still renders. Click + Enter/Space stopPropagation so following
// the deep link never also toggles the log card.
function deepLink(cls, text, url, titleText, withExt) {
  if (!url) return $("span", cls, text);
  const a = $("a", cls);
  a.href = url; a.target = "_blank"; a.rel = "noopener";
  if (titleText) a.title = titleText;
  a.appendChild(document.createTextNode(text));
  if (withExt) { const g = $("span", "ext", "↗"); g.setAttribute("aria-hidden", "true"); a.appendChild(g); }
  a.addEventListener("click", (e) => e.stopPropagation());
  a.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") e.stopPropagation(); });
  return a;
}

// Coarse PROGRESS estimate for the row (#156). Reads run.progress (threaded from the
// liveness beat by the snapshot). Shown ONLY on in-flight building/reviewing cards —
// a terminal/recent/blocked run drops the bar. Null → the row renders no bar (degrades
// cleanly when the signal is unavailable). Honestly labelled an estimate in the tooltip.
function progressInfo(run) {
  const p = run && run.progress;
  if (!p || typeof p.pct !== "number" || !isFinite(p.pct)) return null;
  if (run.recent || run.blocked || run.terminal) return null;
  const g = groupOf(run);
  if (g !== "building" && g !== "reviewing") return null;
  const pct = Math.max(0, Math.min(100, Math.round(p.pct)));
  const phase = p.phase ? String(p.phase) : null;
  const title = `~${pct}% — coarse estimate, phase-derived from the liveness beat`
    + (phase ? ` (phase: ${phase})` : "");
  return { pct, title };
}

// Board-card PROGRESS estimate (#174). The KANBAN cards want the SAME phase-derived %
// the list view shows for in-flight (building/reviewing) runs, PLUS a completed voyage
// reads 100% — a merged/shipped/terminal run is fully sailed, so its card fills the bar.
// A blocked run gets no bar (it isn't "done", and its blocked seam already tells the
// story). Queued / awaiting-merge in-flight runs have no phase beat, so they render no
// bar — exactly as in the list view. Null → the card renders no bar (clean degrade).
function kProgressInfo(run) {
  if (!run) return null;
  if (!run.blocked && (run.recent || run.terminal || groupOf(run) === "done")) {
    return { pct: 100, title: "100% — voyage complete" };
  }
  return progressInfo(run);   // in-flight building/reviewing estimate (#156), else null
}

// ---- compact voyage row (default overview) --------------------------------
function renderRow(run, isOpen) {
  const num = "#" + (run.issueNumber ?? run.prNumber ?? "?");
  const g = groupOf(run);
  const color = GROUP_COLOR[g] || "var(--building)";
  const row = $("div", "voyage-row");
  row.setAttribute("role", "button");
  row.setAttribute("tabindex", "0");
  row.setAttribute("aria-expanded", isOpen ? "true" : "false");
  row.setAttribute("aria-label", `${num} ${run.title || ""} — ${run.blocked ? "Blocked" : (run.status || "")} — ${isOpen ? "expanded" : "collapsed"}`);

  const ship = $("span", "ship" + (run.blocked || run.terminal ? "" : " sailing"));
  ship.innerHTML = shipSVG(color);
  row.appendChild(ship);
  // number → its own GitHub unit (issue, or PR when there's no issue); title → the PR
  // if one exists, else the issue. Both open in a new tab; read-only deep links (#127).
  const numUnitIsPr = run.issueNumber == null && run.prNumber != null;
  const numUrl = numUnitIsPr ? run.prUrl : run.issueUrl;
  row.appendChild(deepLink("s-num", num, numUrl, numUrl ? `open ${num} on GitHub` : null, true));
  const titleUrl = run.prUrl || run.issueUrl;
  const titleTip = titleUrl ? (run.prUrl ? `open PR #${run.prNumber} on GitHub` : `open ${num} on GitHub`) : null;
  row.appendChild(deepLink("s-title", esc(run.title), titleUrl, titleTip, false));
  row.appendChild(buildVoyage(run));

  const st = $("span", "s-status");
  const lbl = $("span", "s-status-label", run.blocked ? "Blocked" : esc(run.status));
  lbl.style.color = color;
  st.appendChild(lbl);
  // slim progress bar + % under the status word, in-flight cards only (#156)
  const pi = progressInfo(run);
  if (pi) {
    const prog = $("span", "s-prog");
    prog.title = pi.title;
    prog.setAttribute("role", "progressbar");
    prog.setAttribute("aria-valuemin", "0");
    prog.setAttribute("aria-valuemax", "100");
    prog.setAttribute("aria-valuenow", String(pi.pct));
    prog.setAttribute("aria-label", `progress estimate ${pi.pct}%`);
    const track = $("span", "s-prog-track");
    const fill = $("span", "s-prog-fill");
    fill.style.width = pi.pct + "%";
    track.appendChild(fill);
    prog.appendChild(track);
    prog.appendChild($("span", "s-prog-pct", pi.pct + "%"));
    st.appendChild(prog);
  }
  row.appendChild(st);

  const cd = costCell(run);
  const c = $("span", "s-cost" + (cd.cls ? " " + cd.cls : ""));
  const cnum = $("span", "cnum", cd.text);
  if (cd.since) { cnum.classList.add("js-estcost"); cnum.dataset.since = cd.since; }
  c.appendChild(cnum);
  // per-run token usage next to cost ("$2.68 · 1.2M tok"); omitted when unavailable (#149)
  const tk = tokenInfo(run);
  if (tk) { const ts = $("span", "s-tok", tk.text); ts.title = tk.title; c.appendChild(ts); }
  if (cd.tag) c.appendChild($("span", "tag", cd.tag));
  if (cd.title) c.title = cd.title;
  row.appendChild(c);

  // which model(s) the run used — a compact chip in its own column (#151). Primary
  // model labelled, "+N" hints the rest; the full %-per-model split is in the tooltip
  // and the expanded ledger. The cell is ALWAYS appended (empty when there's no model
  // info) so the shared grid template stays aligned across every row and lane.
  const mCell = $("span", "s-model-cell");
  const mi = modelInfo(run);
  if (mi) {
    const chip = $("span", "s-model");
    chip.appendChild(document.createTextNode(mi.primary.label));
    if (mi.count > 1) chip.appendChild($("span", "s-model-more", "+" + (mi.count - 1)));
    chip.title = "models — " + modelSummary(mi);
    mCell.appendChild(chip);
  }
  row.appendChild(mCell);

  if (run.recent) {
    // A completed voyage: show when it landed (static), not a live-ticking clock.
    const when = $("span", "s-when");
    const ago = elapsedText(run.completedAt);
    const verb = run.outcome === "Merged" ? "merged" : (run.blocked ? "blocked" : "shipped");
    when.textContent = ago ? `${verb} ${ago} ago` : verb;
    if (run.completedAt) when.title = new Date(run.completedAt).toLocaleString();
    row.appendChild(when);
  } else {
    const el = $("span", "s-elapsed js-elapsed");
    if (run.startedAt) { el.dataset.since = run.startedAt; el.textContent = elapsedText(run.startedAt) || ""; }
    row.appendChild(el);
  }

  row.appendChild($("span", "chev", "▶"));
  return row;
}

// ---- the expanded log card ------------------------------------------------
function copyBtn(label, text) {
  const b = $("button", "btn", label);
  if (text == null) { b.disabled = true; b.style.opacity = .4; return b; }
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    try { navigator.clipboard.writeText(text); } catch { /* clipboard blocked — best effort */ }
    b.classList.add("copied"); const old = b.textContent; b.textContent = "copied";
    setTimeout(() => { b.classList.remove("copied"); b.textContent = old; }, 1200);
  });
  return b;
}
function openBtn(pathStr) {
  const b = $("a", "btn", "open");
  if (pathStr == null) { b.style.opacity = .4; return b; }
  b.href = "file:///" + String(pathStr).replace(/\\/g, "/").replace(/^\/+/, "");
  b.target = "_blank"; b.rel = "noopener";
  b.addEventListener("click", (e) => e.stopPropagation());
  return b;
}

function renderPipeline(run) {
  const col = $("div", "pipeline");
  col.appendChild($("h3", null, "the voyage"));
  const caps = run.stageCaptions || [];
  const color = GROUP_COLOR[groupOf(run)] || "var(--building)";
  (run.stages || []).forEach((name, i) => {
    let cls = "stage";
    const isActive = i === run.activeIndex;
    if (run.blocked && isActive) cls += " blocked";
    else if (i < run.activeIndex) cls += " done";
    else if (isActive) cls += run.terminal ? " done" : " active";
    const stage = $("div", cls);
    if (isActive && !run.blocked && !run.terminal) stage.style.color = color;
    const rung = $("div", "rung");
    rung.appendChild($("span", "dot"));
    rung.appendChild($("span", "rail"));
    stage.appendChild(rung);
    const body = $("div", "body");
    const nm = $("span", "name", name);
    if (isActive) { const here = $("span", "here", run.blocked ? "⚠" : (run.terminal ? "⚓" : "⛵")); nm.appendChild(here); }
    body.appendChild(nm);
    if (caps[i]) body.appendChild($("div", "cap", caps[i]));
    stage.appendChild(body);
    col.appendChild(stage);
  });
  return col;
}

function metaRow(k, valueNode) {
  const row = $("div", "row");

  const v = $("div", "v");
  if (valueNode instanceof Node) v.appendChild(valueNode); else v.textContent = esc(valueNode);
  row.appendChild(v);
  return row;
}
function renderMeta(run) {

  else idV.appendChild($("span", "naval", run.prUrl ? "" : "n/a"));
  if (run.prUrl) { idV.appendChild(document.createTextNode("  ")); const p = $("a", null, "PR #" + run.prNumber); p.href = run.prUrl; p.target = "_blank"; p.rel = "noopener"; p.addEventListener("click", (e) => e.stopPropagation()); idV.appendChild(p); }

  else wtV.appendChild($("span", "naval", "n/a — no local worktree"));

  else foV.appendChild($("span", "naval", "n/a"));

  // done video

function renderLedger(run) {
  const block = $("div", "ledger");
  block.appendChild($("h3", null, "cost ledger"));
  const c = run.cost || {};
  // in-flight vs final banner (#115): estimating / accruing / final.
  const status = ledgerStatus(run);
  if (status) {
    const sb = $("div", "cost-status" + (status.cls ? " " + status.cls : ""));
    sb.appendChild($("span", "pip"));
    sb.appendChild(document.createTextNode(status.text));
    block.appendChild(sb);
  }
  const table = $("table", "cost");
  const thead = $("thead"); const htr = $("tr");
  ["MODEL", "IN", "OUT", "CACHE R", "CACHE W", "≈ COST"].forEach((h, i) => htr.appendChild($("th", i === 0 ? "" : "n", h)));
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = $("tbody");
  const models = (c.present && Array.isArray(c.models)) ? c.models : [];
  if (models.length) {
    for (const m of models) {
      const tr = $("tr");
      tr.appendChild($("td", "model", esc(m.model)));
      const cell = (v) => { const td = $("td", "n"); const t = compact(v); if (t == null) { td.textContent = "n/a"; td.classList.add("na"); } else td.textContent = t; return td; };
      tr.appendChild(cell(m.in)); tr.appendChild(cell(m.out)); tr.appendChild(cell(m.cacheRead)); tr.appendChild(cell(m.cacheWrite));
      const costTd = $("td", "n cost"); const mv = money(m.cost);
      if (mv == null) { costTd.textContent = "n/a"; costTd.className = "n na"; } else costTd.textContent = mv;
      tr.appendChild(costTd);
      tbody.appendChild(tr);
    }
  } else {
    const tr = $("tr"); const td = $("td", "na"); td.colSpan = 6;
    td.textContent = (c.estimated)
      ? "no real usage recorded yet — the figure above is an elapsed-based estimate; crows-nest writes out/costs/<run>.json at the first reconcile"
      : "no cost post-mortem for this run yet — crows-nest writes out/costs/<run>.json as usage accrues";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  table.appendChild(tbody); block.appendChild(table);
  // Per-run token total + in/out breakdown (#149) — the counts the cost is derived
  // from. Omitted entirely when a run has no token data (older/unpriced file).
  const tk = tokenInfo(run);
  if (tk) {
    const tparts = [`total ${tk.total.toLocaleString()}`];
    if (typeof tk.input === "number") tparts.push(`in ${tk.input.toLocaleString()}`);
    if (typeof tk.output === "number") tparts.push(`out ${tk.output.toLocaleString()}`);
    const tfoot = $("div", "cost-foot");
    tfoot.appendChild(document.createTextNode("tokens: "));
    tfoot.appendChild($("span", "ptr", tparts.join(" · ")));
    block.appendChild(tfoot);
  }
  // %-per-model split (#151) — WHICH models the run used and how the work divided,
  // as a stacked share bar + legend. Uses token share where present, else cost
  // share. Omitted when there's no model breakdown (older/empty file).
  const mi = modelInfo(run);
  if (mi) {
    const split = $("div", "model-split");
    split.appendChild($("div", "msplit-h", mi.count > 1 ? "model usage" : "model"));
    const haveShares = mi.models.some((m) => typeof m.share === "number");
    if (haveShares) {
      const bar = $("div", "model-bar");
      for (const m of mi.models) {
        const seg = $("div", "seg");
        seg.style.background = m.color;
        seg.style.width = (m.share != null ? Math.max(m.share * 100, 0) : 0) + "%";
        seg.style.flex = m.share != null ? "0 0 auto" : "1 1 auto";
        seg.title = m.label + (m.share != null ? " — " + Math.round(m.share * 100) + "%" : "");
        bar.appendChild(seg);
      }
      split.appendChild(bar);
    }
    const legend = $("div", "model-legend");
    for (const m of mi.models) {
      const item = $("div", "mitem");
      const sw = $("span", "msw"); sw.style.background = m.color; item.appendChild(sw);
      const nm = $("span", "mname", m.label); nm.title = m.full; item.appendChild(nm);
      if (m.share != null) item.appendChild($("span", "mpct", Math.round(m.share * 100) + "%"));
      const tokTxt = (typeof m.tokens === "number") ? compactTok(m.tokens) + " tok"
        : (typeof m.cost === "number") ? money(m.cost) : null;
      if (tokTxt) item.appendChild($("span", "mtok", tokTxt));
      legend.appendChild(item);
    }
    split.appendChild(legend);
    block.appendChild(split);
  }
  const parts = [];
  if (c.present) {
    if (c.sessions != null || c.subagents != null) parts.push(`${c.sessions ?? 0} claude session(s) + ${c.subagents ?? 0} subagents`);
    if (c.codex != null) parts.push(`${c.codex} codex`);
  }
  parts.push("API-equivalent estimate, not billing");
  if (c.present && c.unpriced && c.unpriced.length) parts.push("unpriced: " + c.unpriced.join(", "));
  block.appendChild($("div", "cost-foot", parts.join(" · ")));
  const ptr = $("div", "cost-foot");
  ptr.appendChild(document.createTextNode("post-mortem: "));
  ptr.appendChild($("span", "ptr", c.pointer || "out/costs/<run>.json"));
  block.appendChild(ptr);
  return block;
}

// ---- compact summary card (auto-expanded active build, #131) ---------------
// A concise expanded card for a run currently BUILDING: the current stage (+ its
// caption), live-ticking elapsed and accruing cost, and the issue/PR deep-links —
// NOT the full pipeline / meta / ledger dump. Read-only; reuses costCell + the same
// js-elapsed / js-estcost hooks so the 1s ticker keeps it live.
function renderSummaryCard(run) {
  const card = $("div", "summary-card");

  // current stage — the active leg of the real armada:* voyage
  const stageWrap = $("div", "sum-stage");
  stageWrap.appendChild($("span", "sum-glyph", "⛵"));
  const stageBody = $("div", "sum-stage-body");
  const stages = run.stages || [];
  const caps = run.stageCaptions || [];
  const i = run.activeIndex;
  stageBody.appendChild($("div", "sum-stage-name", stages[i] || run.status || "Building"));
  if (caps[i]) stageBody.appendChild($("div", "sum-stage-cap", caps[i]));
  stageWrap.appendChild(stageBody);
  card.appendChild(stageWrap);

  // facts: elapsed · live cost · issue/PR deep-links
  const facts = $("div", "sum-facts");

  const elFact = $("div", "sum-fact");
  elFact.appendChild($("span", "k", "elapsed"));
  const elV = $("span", "v js-elapsed");
  if (run.startedAt) { elV.dataset.since = run.startedAt; elV.textContent = elapsedText(run.startedAt) || "—"; }
  else elV.textContent = "—";
  elFact.appendChild(elV);
  facts.appendChild(elFact);

  // coarse progress estimate (#156) — a slim bar + % beside elapsed on the compact card
  const pi = progressInfo(run);
  if (pi) {

    pFact.appendChild($("span", "k", "progress"));
    const pV = $("span", "v");
    pV.title = pi.title;
    const prog = $("span", "s-prog");
    prog.setAttribute("role", "progressbar");
    prog.setAttribute("aria-valuemin", "0");
    prog.setAttribute("aria-valuemax", "100");
    prog.setAttribute("aria-valuenow", String(pi.pct));
    prog.setAttribute("aria-label", `progress estimate ${pi.pct}%`);
    const track = $("span", "s-prog-track");
    const fill = $("span", "s-prog-fill");
    fill.style.width = pi.pct + "%";
    track.appendChild(fill);
    prog.appendChild(track);
    prog.appendChild($("span", "s-prog-pct", pi.pct + "%"));
    pV.appendChild(prog);
    pFact.appendChild(pV);
    facts.appendChild(pFact);
  }

  const cd = costCell(run);
  const costFact = $("div", "sum-fact");
  costFact.appendChild($("span", "k", "cost"));
  const costV = $("span", "v cost");
  const cnum = $("span", "cnum", cd.text);
  if (cd.since) { cnum.classList.add("js-estcost"); cnum.dataset.since = cd.since; }
  costV.appendChild(cnum);

  const tk = tokenInfo(run);
  if (tk) { const ts = $("span", "s-tok", tk.text); ts.title = tk.title; costV.appendChild(ts); }
  if (cd.tag) costV.appendChild($("span", "tag", cd.tag));
  if (cd.title) costV.title = cd.title;
  costFact.appendChild(costV);

  const linkFact = $("div", "sum-fact");
  linkFact.appendChild($("span", "k", "open"));
  const links = $("span", "v sum-links");
  if (run.issueUrl) links.appendChild(deepLink("", "#" + run.issueNumber, run.issueUrl, `open #${run.issueNumber} on GitHub`, false));
  if (run.prUrl) links.appendChild(deepLink("", "PR #" + run.prNumber, run.prUrl, `open PR #${run.prNumber} on GitHub`, false));
  if (!run.issueUrl && !run.prUrl) links.appendChild($("span", "naval", "n/a"));
  linkFact.appendChild(links);
  facts.appendChild(linkFact);

  card.appendChild(facts);
  return card;
}

function renderCard(run) {
  const card = $("div", "logcard");

// a run block = the voyage row + (when expanded) the full log card.
function renderRun(run) {
  const key = runKey(run);
  const auto = autoExpands(run);   // active build (#131) OR in-review (#172) — auto-expanded
  const isOpen = isRunOpen(run);
  // The run's real armada:* GROUP rides as a `g-<group>` class so the CSS can key
  // the state-specific ambient animations off it (#150) — building shimmer, awaiting
  // ready-glow, blocked warning pulse; the shipped flourish stays one-shot (below).
  const block = $("div", "run g-" + groupOf(run) + (run.recent ? " recent" : "") + (run.blocked ? " blocked" : "") + (run.terminal ? " terminal" : "") + (isOpen ? " expanded" : ""));
  block.dataset.key = key;
  const row = renderRow(run, isOpen);
  const toggle = () => {
    // An auto-expanding run (active build #131 / in-review #172) is open by default: a manual
    // toggle records the operator's collapse / re-open in userCollapsed. Every other run toggles
    // the usual expanded set. Either way the auto-expand default is never mutated away.
    if (auto) {
      if (userCollapsed.has(key)) userCollapsed.delete(key); else userCollapsed.add(key);
    } else {
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
    }
    const next = renderRun(run);
    block.replaceWith(next);
    if (isRunOpen(run)) { const s = next.querySelector(".voyage-row"); if (s) s.focus(); }
  };
  // A click / key on an inner deep link (or copy/open button) acts on that control —
  // it must not also toggle the card (#127). Inner links already stopPropagation; this
  // target guard is the belt-and-braces so the row toggle only fires on the row body.
  row.addEventListener("click", (e) => { if (e.target.closest("a, button")) return; toggle(); });
  row.addEventListener("keydown", (e) => {
    if (e.target.closest("a, button")) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); }
  });
  block.appendChild(row);
  // An auto-expanding run (active build #131 / in-review #172) shows the COMPACT summary
  // card; every other expanded run shows the full log card. Both preserve the read-only
  // invariant (no writes).
  if (isOpen) block.appendChild(auto ? renderSummaryCard(run) : renderCard(run));
  return block;
}

// ---- KANBAN board (#163) — runs in lanes by pipeline stage ----------------
// A compact run card for the board: vessel + deep-linked number, title, live status,
// cost and elapsed. READ-ONLY — the only interactive elements are the GitHub deep links
// (new tab, rel=noopener). A blocked run keeps its (approximated) stage lane but wears the
// blocked overlay (red seam + a ⚠ badge), matching the voyage row's blocked treatment.
function renderKCard(run) {
  const g = groupOf(run);
  const color = GROUP_COLOR[g] || "var(--building)";
  const num = "#" + (run.issueNumber ?? run.prNumber ?? "?");
  const card = $("div", "kcard g-" + g + (run.blocked ? " blocked" : "") + (run.recent ? " recent" : "") + (run.terminal ? " terminal" : ""));
  card.style.setProperty("--k", color);
  const key = runKey(run);
  card.dataset.key = key;           // so the "just shipped" flourish can target a board card too
  // Click a board card → open its full detail in the focused panel (#164). The card is a
  // real button for the keyboard (Enter/Space); inner deep links still act on themselves
  // (they stopPropagation), so following a GitHub link never also opens the panel.
  card.setAttribute("role", "button");
  card.setAttribute("tabindex", "0");
  card.setAttribute("aria-expanded", selectedKey === key ? "true" : "false");
  card.setAttribute("aria-label", `#${run.issueNumber ?? run.prNumber ?? "?"} ${run.title || ""} — ${run.blocked ? "Blocked" : (run.status || "")} — open detail`);
  card.style.cursor = "pointer";
  card.addEventListener("click", (e) => { if (e.target.closest("a, button")) return; openDetailPanel(run); });
  card.addEventListener("keydown", (e) => {
    if (e.target.closest("a, button")) return;
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); openDetailPanel(run); }
  });
  const head = $("div", "kc-head");
  const ship = $("span", "kc-ship" + (run.blocked || run.terminal ? "" : " sailing"));
  ship.innerHTML = shipSVG(color);
  head.appendChild(ship);
  const numUnitIsPr = run.issueNumber == null && run.prNumber != null;
  const numUrl = numUnitIsPr ? run.prUrl : run.issueUrl;
  head.appendChild(deepLink("kc-num", num, numUrl, numUrl ? `open ${num} on GitHub` : null, true));
  if (run.blocked) head.appendChild($("span", "kc-flag", "⚠ blocked"));
  card.appendChild(head);
  const titleUrl = run.prUrl || run.issueUrl;
  const titleTip = titleUrl ? (run.prUrl ? `open PR #${run.prNumber} on GitHub` : `open ${num} on GitHub`) : null;
  card.appendChild(deepLink("kc-title", esc(run.title), titleUrl, titleTip, false));
  const foot = $("div", "kc-foot");
  // Drop the redundant per-card stage label (#175): the card already sits in its stage lane,
  // so a status that merely repeats the lane's name ("Building" in the Building lane) is noise.
  // Keep only status that ADDS information beyond the lane — a sub-state like "Addressing",
  // "Held" or "Eligible". "Blocked" is already flagged by the ⚠ badge in the head, so it's
  // dropped here too. When nothing informative remains, the freed line goes to the fuller
  // title / progress %; the cost stays right-aligned in the foot on its own.
  const laneStage = ((run.stages || STAGE_NAMES)[run.activeIndex] || "").toLowerCase();
  const statusTxt = run.blocked ? "" : (run.status || "");
  if (statusTxt && statusTxt.toLowerCase() !== laneStage) {
    const stt = $("span", "kc-status", esc(statusTxt));
    stt.style.color = color;
    foot.appendChild(stt);
  }
  const cd = costCell(run);
  const c = $("span", "kc-cost" + (cd.cls ? " " + cd.cls : ""));
  const cnum = $("span", "cnum", cd.text);
  if (cd.since) { cnum.classList.add("js-estcost"); cnum.dataset.since = cd.since; }  // live-ticking estimate
  c.appendChild(cnum);
  if (cd.tag) c.appendChild($("span", "tag", cd.tag));
  if (cd.title) c.title = cd.title;
  foot.appendChild(c);
  card.appendChild(foot);
  // slim progress bar + % on the board card (#174) — the same phase-derived estimate the
  // list view carries, with completed voyages reading 100%. Omitted when there's no signal.
  const pi = kProgressInfo(run);
  if (pi) {
    const prog = $("div", "kc-prog");
    prog.title = pi.title;
    prog.setAttribute("role", "progressbar");
    prog.setAttribute("aria-valuemin", "0");
    prog.setAttribute("aria-valuemax", "100");
    prog.setAttribute("aria-valuenow", String(pi.pct));
    prog.setAttribute("aria-label", `progress estimate ${pi.pct}%`);
    const track = $("span", "kc-prog-track");
    const fill = $("span", "kc-prog-fill");
    fill.style.width = pi.pct + "%";
    track.appendChild(fill);
    prog.appendChild(track);
    prog.appendChild($("span", "kc-prog-pct", pi.pct + "%"));
    card.appendChild(prog);
  }
  const meta = $("div", "kc-meta");
  if (run.recent) {
    // A completed voyage: when it landed (static), not a live-ticking clock.
    const ago = elapsedText(run.completedAt);
    const verb = run.outcome === "Merged" ? "merged" : (run.blocked ? "blocked" : "shipped");
    meta.textContent = ago ? `${verb} ${ago} ago` : verb;
    if (run.completedAt) meta.title = new Date(run.completedAt).toLocaleString();
  } else {
    meta.classList.add("js-elapsed");   // the 1s ticker keeps this current
    if (run.startedAt) { meta.dataset.since = run.startedAt; meta.textContent = elapsedText(run.startedAt) || ""; }
  }
  card.appendChild(meta);
  return card;
}

// The board itself: seven fixed lanes in pipeline order (empty lanes still render,
// labelled), each run dropped into the column at its activeIndex. In-flight AND recent
// runs share the board — a merged/shipped run lands in the Merged/Shipped lane. The lane
// labels come from the runs' own `stages` array (the snapshot's real STAGES), falling back
// to STAGE_NAMES so the full pipeline shows even before any run is present in a lane.
function renderBoard(state, runs, recentRuns) {
  const boardEl = document.getElementById("board");
  boardEl.textContent = "";
  const all = [...runs, ...recentRuns];
  const names = (runs[0] && runs[0].stages) || (recentRuns[0] && recentRuns[0].stages) || STAGE_NAMES;
  const n = names.length;
  const cols = Array.from({ length: n }, () => []);
  for (const run of all) {
    let i = Number(run.activeIndex);
    if (!Number.isFinite(i)) i = 0;
    i = Math.max(0, Math.min(n - 1, i));   // clamp into a real lane (blocked overlay handled on the card)
    cols[i].push(run);
  }
  const board = $("div", "board");
  names.forEach((name, i) => {
    const grp = STAGE_GROUP[i] || "queued";
    const col = $("div", "kcol grp-" + grp);
    col.style.setProperty("--kc", GROUP_COLOR[grp] || "var(--building)");
    const chead = $("div", "kcol-head");
    chead.appendChild($("span", "kcol-name", name));
    chead.appendChild($("span", "kcol-count", String(cols[i].length)));
    col.appendChild(chead);
    const lane = $("div", "klane");
    if (!cols[i].length) {
      lane.appendChild($("div", "kempty", "—"));
    } else {
      for (const run of sortRuns(cols[i])) lane.appendChild(renderKCard(run));
    }
    col.appendChild(lane);
    board.appendChild(col);
  });
  boardEl.appendChild(board);
}

// ---- KANBAN lane-transition animation (#177) — FLIP the board across a poll ----
// renderBoard() rebuilds every card from scratch each --watch poll, so a run that
// changed stage jumps into its new lane. This wrapper makes the move VISIBLE without
// touching the (simple, correct) rebuild: it measures each card's box BEFORE the
// rebuild, lets renderBoard rebuild as usual, then FLIPs — for each surviving card it
// INVERTs the box delta with a transform and PLAYs it to zero (the card slides from its
// old lane to its new one); a card that's newly on the board fades+settles IN; a card
// that left the board ghosts OUT from its old spot. Pure transform/opacity (composited,
// 60fps, no layout thrash); the whole thing no-ops under prefers-reduced-motion. READ-ONLY.
function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function renderBoardAnimated(state, runs, recentRuns) {
  const boardEl = document.getElementById("board");
  const animate = boardPainted && !prefersReducedMotion();

  // FIRST — measure the current cards' boxes (viewport coords) and hold the live nodes,
  // which renderBoard is about to detach (textContent=""). We reuse the detached nodes as
  // leave-ghosts, so no cloning is needed.
  const firstRects = new Map();   // key -> DOMRect (pre-rebuild position)
  const firstNodes = new Map();   // key -> the (soon-detached) card element
  if (animate) {
    for (const c of boardEl.querySelectorAll(".kcard[data-key]")) {
      firstRects.set(c.dataset.key, c.getBoundingClientRect());
      firstNodes.set(c.dataset.key, c);
    }
  }

  // Rebuild the board exactly as before.
  renderBoard(state, runs, recentRuns);
  if (!animate) { boardPainted = true; return; }

  // LAST — measure the fresh cards; INVERT survivors to their old box and enter newcomers.
  // We deliberately DON'T use requestAnimationFrame to release the invert: a backgrounded
  // tab throttles rAF, which would strand a card at its old position. Instead we commit the
  // invert with a single forced reflow, then release — the transition then plays reliably.
  // Batch ALL reads before ANY write so the survivor FLIP costs one layout pass, not a
  // forced reflow per card (#182). Phase 1 — PURE READS: measure every surviving card's LAST
  // box (its matching FIRST box is already in firstRects) and note newcomers, writing NOTHING.
  const seen = new Set();
  const flips = [];      // { el, dx, dy } survivors that actually moved — inverted in phase 2
  const entrants = [];   // cards new this poll — settled in during phase 2
  for (const c of boardEl.querySelectorAll(".kcard[data-key]")) {
    const key = c.dataset.key;
    seen.add(key);
    const first = firstRects.get(key);
    if (first) {
      const last = c.getBoundingClientRect();   // read only — no style writes in this loop
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) flips.push({ el: c, dx, dy });
    } else {
      entrants.push(c);
    }
  }
  // Phase 2 — PURE WRITES: apply the invert transform / enter classes. No getBoundingClientRect()
  // reads here, so nothing forces a re-layout mid-loop — all measurement happened in phase 1.
  const movers = [];   // cards to release after the single reflow
  for (const { el, dx, dy } of flips) {
    // Invert: pin the card back to its old box with the transition suppressed.
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    movers.push(el);
  }
  for (const c of entrants) {
    // A card that wasn't on the board last poll — a genuinely new run: settle it in.
    c.classList.add("kentering");
    c.addEventListener("animationend", () => c.classList.remove("kentering"), { once: true });
  }
  if (movers.length) {
    // Force ONE reflow so the inverted positions become the transition's start state, then
    // PLAY: enable the transition and clear the transform so every card slides to its new lane.
    void boardEl.offsetHeight;   // single synchronous layout flush for all movers
    for (const c of movers) {
      c.classList.add("kflip");
      c.style.transition = "";   // drop the inline "none" so the .kflip transition applies
      c.style.transform = "";    // release → slide to the natural (new-lane) position
      const done = () => { c.classList.remove("kflip"); c.style.transition = ""; c.style.transform = ""; c.removeEventListener("transitionend", done); };
      c.addEventListener("transitionend", done);
      setTimeout(done, 700);     // safety net if transitionend is missed (e.g. a hidden tab)
    }
  }

  // Departed cards — present before, gone now: re-parent the held node to the body as an
  // inert fixed ghost pinned at its old box, and let it fade+settle out, then remove it.
  for (const [key, rect] of firstRects) {
    if (seen.has(key)) continue;
    const ghost = firstNodes.get(key);
    if (!ghost) continue;
    ghost.classList.remove("kflip", "kentering");
    ghost.classList.add("kcard-ghost");
    ghost.style.transform = "";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    // Make the ghost fully inert: no focus, no a11y presence, never matches board queries.
    ghost.removeAttribute("data-key");
    ghost.removeAttribute("tabindex");
    ghost.removeAttribute("role");
    ghost.setAttribute("aria-hidden", "true");
    document.body.appendChild(ghost);
    ghost.addEventListener("animationend", () => ghost.remove(), { once: true });
    setTimeout(() => ghost.remove(), 600);   // safety net
  }

  boardPainted = true;
}

// ---- focused detail panel (#164) — a board card's full detail, in a modal ----
// Reuses renderCard(run) so the panel shows exactly the same detail the list view
// expands inline (pipeline, branch/worktree, per-model cost table, logbook video,
// review state). Keyboard-accessible and read-only. The open selection (selectedKey)
// is a module var, so it survives the --watch re-render (refreshDetailPanel re-fills
// it with fresh data each poll) but a fresh page load starts closed.
function runByKey(key) {
  if (!lastState) return null;
  for (const r of [...(lastState.runs || []), ...(lastState.recentRuns || [])]) {
    if (runKey(r) === key) return r;
  }
  return null;
}
function fillDetailPanel(run) {
  const g = groupOf(run);
  const color = GROUP_COLOR[g] || "var(--building)";
  const num = "#" + (run.issueNumber ?? run.prNumber ?? "?");
  const panel = document.querySelector("#detailOverlay .detail-panel");
  panel.classList.toggle("blocked", !!run.blocked);
  document.getElementById("detail-ship").innerHTML = shipSVG(color);
  const titleEl = document.getElementById("detail-title");
  titleEl.textContent = num + " · " + (run.title || "");
  const st = document.getElementById("detail-status");
  st.textContent = run.blocked ? "Blocked" : (run.status || "");
  st.style.color = color;
  const content = document.getElementById("detailContent");
  content.textContent = "";
  content.appendChild(renderCard(run));   // the full log card — same detail as the list
}
function openDetailPanel(run) {
  selectedKey = runKey(run);
  lastFocusedEl = document.activeElement;
  fillDetailPanel(run);
  const overlay = document.getElementById("detailOverlay");
  overlay.hidden = false;
  // move focus into the dialog for keyboard users
  document.querySelector("#detailOverlay .detail-panel").focus();
  // reflect open state on the originating card, if it's still around
  const card = document.querySelector(`.kcard[data-key="${CSS.escape(selectedKey)}"]`);
  if (card) card.setAttribute("aria-expanded", "true");
}
function closeDetailPanel() {
  const overlay = document.getElementById("detailOverlay");
  if (overlay.hidden) return;
  overlay.hidden = true;
  const key = selectedKey;
  selectedKey = null;
  const card = key && document.querySelector(`.kcard[data-key="${CSS.escape(key)}"]`);
  if (card) card.setAttribute("aria-expanded", "false");
  // restore focus to the card that opened the panel (else the close button's blur)
  if (lastFocusedEl && document.contains(lastFocusedEl)) lastFocusedEl.focus();
  else if (card) card.focus();
  lastFocusedEl = null;
}
// Called each render: keep an open panel in sync with fresh data, or close it if its
// run has left the fleet / the operator switched to the list view.
function refreshDetailPanel() {
  if (!selectedKey) return;
  if (viewMode !== "board") { closeDetailPanel(); return; }
  const run = runByKey(selectedKey);
  if (!run) { closeDetailPanel(); return; }
  // The open panel must honour the ACTIVE FILTER (#164): if the operator narrows the board
  // so the open run no longer shows — or the run changes stage across a --watch poll so it
  // no longer matches the filter — its board card is gone, so close the panel rather than
  // leave a modal floating over a board that no longer holds it (the intent setFilterMode notes).
  if (!matchesFilter(run)) { closeDetailPanel(); return; }
  fillDetailPanel(run);
}
// wire the close affordances once: the × button, a backdrop click, and Escape. A tiny
// focus trap keeps Tab inside the open dialog.
document.getElementById("detailClose").addEventListener("click", closeDetailPanel);
document.getElementById("detailOverlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeDetailPanel();   // click on the backdrop, not the panel
});
document.addEventListener("keydown", (e) => {
  const overlay = document.getElementById("detailOverlay");
  if (overlay.hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeDetailPanel(); return; }
  if (e.key === "Tab") {
    const focusables = overlay.querySelectorAll('a[href], button:not([disabled]), video, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ---- today's fleet scoreboard banner (#193) -------------------------------
// A live "today's scoreboard": features shipped, total spend, average build time
// (dispatch→merge) and throughput. All four are derived PURELY from the snapshot the
// page already polls — state.rollup + state.recentRuns — so they update on the same
// poll cycle and mutate nothing (READ-ONLY).
//
//   * shipped today   — state.rollup.shippedToday (the driver's authoritative count of
//                       non-blocked terminal runs that landed since local midnight; it's
//                       counted from the full windowed set, so it's accurate even past the
//                       recent-lane cap). Falls back to the visible recentRuns subset.
//   * spent today     — Σ recorded per-run cost (run.cost.totalCost) over today's landed
//                       runs that carry a cost file. A lower bound: runs without a recorded
//                       cost don't contribute; spendKnown is false when NONE do (→ "—").
//   * avg build       — mean(completedAt − startedAt) over today's landed runs that have
//                       both stamps. startedAt is the issue/PR open (or crows-nest dispatch)
//                       time and completedAt the merge/close time — the driver's dispatch→
//                       merge span. Null (→ "—") when no sample.
//   * throughput      — shippedToday ÷ hours elapsed since local midnight (features/hour).
//                       Guarded so an empty/zero-elapsed day yields "—", never Infinity.
//
// Pure function so it's unit-testable in Node against a fixture snapshot. `nowMs` is
// injectable for deterministic tests; it defaults to Date.now().
function computeScoreboard(state, nowMs) {
  const now = (typeof nowMs === "number" && Number.isFinite(nowMs)) ? nowMs : Date.now();
  const rollup = (state && state.rollup) || {};
  const recent = (state && Array.isArray(state.recentRuns)) ? state.recentRuns : [];
  const mid = new Date(now); mid.setHours(0, 0, 0, 0);   // local midnight (matches the driver)
  const sot = mid.getTime();
  const parseMs = (iso) => { const t = Date.parse(iso == null ? "" : iso); return Number.isFinite(t) ? t : null; };

  // Today's LANDED runs visible in the harbour subset: non-blocked, merged/shipped,
  // completed since local midnight.
  const landedToday = recent.filter((r) => {
    if (!r || r.blocked) return false;
    if (r.outcome !== "Merged" && r.outcome !== "Shipped") return false;
    const c = parseMs(r.completedAt);
    return c != null && c >= sot;
  });

  // 1) shipped today — authoritative rollup count, else the visible subset's length.
  const shippedToday = (typeof rollup.shippedToday === "number" && Number.isFinite(rollup.shippedToday))
    ? rollup.shippedToday
    : landedToday.length;

  // 2) spent today — sum of recorded per-run cost over today's landed runs.
  let spend = 0, spendKnown = false, spendN = 0;
  for (const r of landedToday) {
    const c = r.cost;
    const tc = (c && c.present && typeof c.totalCost === "number" && Number.isFinite(c.totalCost)) ? c.totalCost : null;
    if (tc != null) { spend += tc; spendKnown = true; spendN += 1; }
  }

  // 3) avg build time — mean dispatch→merge span over today's landed runs with both stamps.
  let durSum = 0, durN = 0;
  for (const r of landedToday) {
    const s = parseMs(r.startedAt), e = parseMs(r.completedAt);
    if (s != null && e != null && e >= s) { durSum += (e - s); durN += 1; }
  }
  const avgBuildMs = durN > 0 ? durSum / durN : null;

  // 4) throughput — shipped today ÷ hours elapsed since midnight (guarded against /0).
  const hoursElapsed = (now - sot) / 3600000;
  const throughput = (typeof shippedToday === "number" && Number.isFinite(shippedToday) && hoursElapsed > 0)
    ? shippedToday / hoursElapsed : null;

  return { shippedToday, spend, spendKnown, spendN, avgBuildMs, avgSampleN: durN, throughput, hoursElapsed };
}

// Compact duration text from a millisecond span — "1h 08m" / "12m 30s" / "45s". Null /
// non-finite / negative → null (→ the caller shows "—").
function durText(ms) {
  if (ms == null || !Number.isFinite(ms) || ms < 0) return null;
  let s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (d) return `${d}d ${String(h).padStart(2, "0")}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

// One scoreboard tile — label + value. Value is set via textContent (XSS-safe); a "—"
// placeholder is dimmed. `title` carries the metric's plain-language explanation.
// `caveat` (optional) flags a LOWER-BOUND figure — a tile that could only sum the
// client-visible subset (e.g. spend/avg on a >12-ship day). When present on a real
// value it wears the manifest's estimate idiom: a leading "~", a brass tint, and a
// small caveat sub-label — so the understatement is visible on-screen, not just in
// the hover title. Never shown on the "—" empty state.
function scoreTile(label, value, title, caveat) {
  const present = value != null && value !== "—";
  const lb = present && caveat != null && caveat !== "";   // lower-bound marker: real values only
  const cell = $("div", "score");
  cell.appendChild($("div", "sv" + (present ? "" : " dim") + (lb ? " est" : ""), present ? (lb ? "~" + value : value) : "—"));
  cell.appendChild($("div", "sk", label));
  if (lb) cell.appendChild($("div", "caveat", caveat));
  if (title) cell.title = title;
  return cell;
}

// Render the live scoreboard banner from the current snapshot. Cleared (empty strip)
// when there's no state. Degrades every figure to "—" independently.
function renderScoreboard(state) {
  const wrap = document.getElementById("scoreboard");
  wrap.textContent = "";
  if (!state) return;
  const s = computeScoreboard(state, Date.now());
  const bar = $("div", "scoreboard");

  const lede = $("div", "sb-lede");
  lede.appendChild($("div", "k", "today"));
  lede.appendChild($("div", "sub", "the fleet's scoreboard"));
  bar.appendChild(lede);

  const shipped = Number.isFinite(s.shippedToday) ? String(s.shippedToday) : "—";
  bar.appendChild(scoreTile("shipped today", shipped,
    "Features that landed (merged/shipped) today, since local midnight."));

  // A tile is a LOWER BOUND when it could only sum the client-visible subset — i.e.
  // fewer runs contributed than the authoritative shippedToday count (true on a
  // >recent-cap day, like a 16-ship day). Flag it visibly so a viewer isn't misled
  // into reading spend/avg as covering every shipped run.
  const shippedN = Number.isFinite(s.shippedToday) ? s.shippedToday : null;
  const spendLB = shippedN != null && s.spendN < shippedN;
  const avgLB = shippedN != null && s.avgSampleN < shippedN;

  const spendVal = s.spendKnown ? (money(s.spend) || "—") : "—";
  bar.appendChild(scoreTile("spent today", spendVal,
    s.spendKnown
      ? `Total recorded fleet spend across ${s.spendN} of today's landed run(s) (runs without a recorded cost aren't included).`
      : "No recorded cost yet for today's landed runs.",
    s.spendKnown && spendLB ? `≥ ${s.spendN} of ${shippedN} runs` : null));

  const avgVal = s.avgBuildMs != null ? (durText(s.avgBuildMs) || "—") : "—";
  bar.appendChild(scoreTile("avg build", avgVal,
    s.avgSampleN > 0
      ? `Mean dispatch→merge time across ${s.avgSampleN} of today's landed run(s).`
      : "No completed build times yet today.",
    s.avgSampleN > 0 && avgLB ? `≥ ${s.avgSampleN} of ${shippedN} runs` : null));

  const thr = (s.throughput != null && Number.isFinite(s.throughput)) ? (s.throughput.toFixed(1) + "/h") : "—";
  bar.appendChild(scoreTile("throughput", thr,
    (s.throughput != null && Number.isFinite(s.throughput))
      ? `${Number.isFinite(s.shippedToday) ? s.shippedToday : 0} shipped ÷ ${s.hoursElapsed.toFixed(1)}h since midnight (features/hour).`
      : "Not enough of today elapsed to chart a rate yet."));

  wrap.appendChild(bar);
}

// ---- live activity feed / ticker (#186) -----------------------------------
// A fleet-wide stream of what every IN-FLIGHT run is doing right now, from the liveness
// beat the fleet already emits (SKILL §0a/§0b): its current PHASE + the latest activity
// NOTE, surfaced by the snapshot on run.progress. It covers BUILDS (shipwright) and
// REVIEWS (muster) in one unified stream. Strictly a VIEW — it renders only what the
// beat already carries and mutates nothing.

// Human-friendly label for a liveness phase. Falls back to the raw phase with hyphens
// spaced out, so an unknown/future phase still reads (never a blank).
const FEED_PHASE_LABEL = {
  research: "researching", planning: "planning", worktree: "worktree",
  implementing: "implementing", validating: "validating", "opening-pr": "opening PR",
  addressing: "addressing review", rebasing: "rebasing",
  reviewing: "reviewing", "visual-inspection": "visual inspection", posting: "posting review",
};
function feedPhaseLabel(phase) {
  const p = String(phase || "").trim().toLowerCase();
  if (!p) return null;
  return FEED_PHASE_LABEL[p] || p.replace(/-/g, " ");
}

// A run belongs in the feed when it's a genuinely in-flight build or review that is
// BEATING — i.e. it carries a live liveness phase on run.progress. Recent / terminal /
// blocked runs, and runs with no beat yet (queued, PR-opened-awaiting-review, awaiting
// merge — no phase), are excluded, so the feed is exactly the live activity stream.
function feedEligible(run) {
  if (!run || run.recent || run.terminal || run.blocked) return false;
  const g = groupOf(run);
  if (g !== "building" && g !== "reviewing") return false;
  const p = run.progress;
  return !!(p && p.phase);
}

// One ticker item: a group-coloured dot, the run number, its phase pill, and the beat's
// latest note (when present). Built twice when the strip marquees (a seamless second copy).
function buildFeedItem(run) {
  const g = groupOf(run);
  const color = GROUP_COLOR[g] || "var(--building)";
  const p = run.progress || {};
  const it = $("span", "feed-item");
  it.style.setProperty("--fc", color);
  it.appendChild($("span", "fi-dot"));
  it.appendChild($("span", "fi-num", "#" + (run.issueNumber ?? run.prNumber ?? "?")));
  const phase = feedPhaseLabel(p.phase) || (g === "reviewing" ? "in review" : "building");
  it.appendChild($("span", "fi-phase", phase));
  const note = (p.note != null && String(p.note).trim()) ? String(p.note).trim() : null;
  if (note) {
    it.appendChild($("span", "fi-sep", "·"));
    it.appendChild($("span", "fi-note", note));
  }
  const label = `#${run.issueNumber ?? run.prNumber ?? "?"} — ${phase}${note ? " — " + note : ""}`;
  it.title = label;
  it.setAttribute("aria-label", label);
  return it;
}

// Render (or hide) the live activity feed for the whole fleet. Passed the FULL run set
// (like the manifest) so it's independent of the stage filter — a fleet-wide stream. It
// hides entirely when nothing is in flight / nothing is beating, and only marquees when
// the items actually overflow the strip AND motion is allowed; otherwise it's a static,
// wrapping strip. READ-ONLY.
function renderFeed(runs) {
  const wrap = document.getElementById("feed");
  wrap.textContent = "";
  const items = (runs || []).filter(feedEligible)
    // Newest activity reads first: reviewing then building, then by number ascending.
    .sort((a, b) => (a.issueNumber ?? a.prNumber ?? 0) - (b.issueNumber ?? b.prNumber ?? 0));
  if (!items.length) return;   // no in-flight beats → the strip is simply absent (clean degrade)

  const panel = $("div", "feed-panel");
  const head = $("div", "feed-head");
  head.appendChild($("span", "live-dot"));
  head.appendChild(document.createTextNode("live activity"));
  head.appendChild($("span", "fh-count", items.length + (items.length === 1 ? " run" : " runs")));
  panel.appendChild(head);

  const viewport = $("div", "feed-viewport");
  const track = $("div", "feed-track");
  for (const r of items) track.appendChild(buildFeedItem(r));
  viewport.appendChild(track);
  panel.appendChild(viewport);
  wrap.appendChild(panel);

  // Motion decision, made AFTER the strip is in the DOM so widths are real. Static (wrap,
  // no scroll) under reduced-motion, or whenever the items already fit; a gentle marquee
  // only when they overflow and motion is allowed. Duration scales with content width for
  // a constant, calm speed; a duplicated item set makes the -50% loop seamless.
  if (prefersReducedMotion()) { track.classList.add("static"); return; }
  const setWidth = track.scrollWidth;
  if (setWidth > viewport.clientWidth + 4) {
    for (const r of items) { const c = buildFeedItem(r); c.setAttribute("aria-hidden", "true"); track.appendChild(c); }
    track.classList.add("marquee");
    const speed = 42;   // px per second — unhurried and legible
    track.style.animationDuration = Math.max(14, Math.round(setWidth / speed)) + "s";
  } else {
    track.classList.add("static");
  }
}

// ---- fleet-busyness ambient tempo (#179) ----------------------------------
// Translate the live fleet state into the board's ambient "visual tempo": how fast and
// how bright the background sea-glow breathes. Deterministic — a pure function of the
// current counts (no Math.random, no per-frame churn) — it sets three CSS custom
// properties the composited .ambient layer animates off. Idle fleet => slow + faint;
// busy fleet => quicker + livelier, but always tasteful. Called each render (READ-ONLY).
let lastAmb = {};
function setAmbientTempo(runs) {
  const root = document.documentElement;
  // The busyness signal comes from the LIVE fleet only (never terminal/recent runs).
  const active = runs.filter((r) => !r.terminal && !r.recent);
  const inFlight = active.length;
  const blocked = active.filter((r) => r.blocked).length;
  const building = active.filter((r) => !r.blocked && groupOf(r) === "building").length;
  const reviewing = active.filter((r) => !r.blocked && groupOf(r) === "reviewing").length;
  // Weighted busyness: every in-flight run counts; blocked runs add urgency; active
  // build/review work adds a little extra liveliness. Saturating so a huge fleet doesn't
  // run away — ~63% "busy" at raw≈6, asymptotic to fully busy.
  const raw = inFlight + blocked * 0.8 + building * 0.35 + reviewing * 0.35;
  const norm = 1 - Math.exp(-raw / 6);                 // 0 (idle) → ~1 (very busy)
  const tempo = 15 - norm * 10.5;                       // 15s calm → ~4.5s busy
  const peak = 0.04 + norm * 0.12;                      // 0.04 faint → 0.16 livelier
  // Hue: sea-blue (205) normally; when runs are blocked, shift warm toward the storm
  // amber/red in proportion to how much of the fleet is blocked — reinforcing the weather.
  const blockShare = inFlight ? Math.min(1, blocked / inFlight) : 0;
  const hue = blocked > 0 ? Math.round(205 - blockShare * 188) : 205;
  // Quantise + only write when a bucket changes, so an unchanged poll never restarts the
  // running animation (retiming animation-duration mid-flight would cause a visible jump).
  const q = {
    tempo: (Math.round(tempo * 2) / 2).toFixed(1) + "s",
    peak: (Math.round(peak * 100) / 100).toFixed(2),
    hue: String(Math.round(hue / 5) * 5),
  };
  if (q.tempo !== lastAmb.tempo) root.style.setProperty("--amb-tempo", q.tempo);
  if (q.peak !== lastAmb.peak) root.style.setProperty("--amb-peak", q.peak);
  if (q.hue !== lastAmb.hue) root.style.setProperty("--amb-hue", q.hue);
  lastAmb = q;
}

function setWeather(runs) {

  else if (anyFlight) { cls = "choppy"; glyph = "🌊"; txt = "choppy · underway"; }
  else { cls = "calm"; glyph = "⚓"; txt = "calm seas"; }

}

function sortRuns(runs) {

// ---- transition flourish + optional foghorn -------------------------------
function detectTransitions(runs) {
  const events = [];
  const now = new Map();
  for (const run of runs) {
    const key = runKey(run);
    const cur = { group: groupOf(run), activeIndex: run.activeIndex, blocked: !!run.blocked };
    now.set(key, cur);
    const prev = prevState.get(key);
    if (!prev) continue;
    if (cur.blocked && !prev.blocked) events.push({ key, kind: "blocked" });
    else if (cur.group === "done" && prev.group !== "done") events.push({ key, kind: "shipped" });
  }
  prevState = now;
  return events;
}

// foghorn chime — OFF by default, opt-in. No external asset: a short two-tone
// WebAudio blast. Enabling requires the toggle click (the user gesture that also
// unlocks audio). Plays only on a ship/block transition while enabled.
let chimeOn = false, audioCtx = null;

  if (!chimeOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const notes = kind === "blocked" ? [138, 110] : [110, 146];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sawtooth"; o.frequency.value = f;
      const s = t + i * 0.55;

      g.gain.exponentialRampToValueAtTime(0.16, s + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + 0.55);
    });
  } catch { /* audio unavailable — silent */ }
}

// ---- ready-to-merge lane (the human merge queue, #140) --------------------
// Reviewed-clean, mergeable, UNMERGED PRs waiting on a HUMAN merge — the

// ---- the horizon: waiting-runs dependency graph (#111) --------------------
// Nodes = queued/held runs (+ any still-in-flight prerequisite they wait on);
// directed edges = crows-nest §2b relationships (depends on #N / same-file or
// shared-lockfile conflict / base about to move). The runnable FRONTIER (eligible,
// no unsatisfied edge) glows brass — "clear to sail"; held nodes are dimmed with an
// amber seam and carry their reason ("waiting on #N" / "conflicts with #M on <file>"
// / "queued: N/M builds in flight"). Read-only. Degrades to a flat frontier list
// when there are no edges, and renders nothing when there's no scheduler state.
const SVGNS = "http://www.w3.org/2000/svg";
const EDGE_COLOR = { depends: "var(--awaiting)", "same-file": "var(--review)", lockfile: "var(--brass)", base: "var(--ink-dim)" };
const EDGE_DASH = { depends: "", "same-file": "5 4", lockfile: "5 4", base: "2 5" };
let horizonRedraw = null;   // re-draw the SVG edges on resize without a full re-render

function gnodeClass(n) {
  if (!n.waiting) return "flight" + (n.status === "pending" ? " pending" : "");
  return n.eligible ? "eligible" : "held";
}

// Longest-path ranking. An edge from→to means "from waits on to", so the prerequisite
// `to` sits one column LEFT of the dependent `from`. rank(leaf)=0. Cycle-guarded.
function rankNodes(nodes, edges) {
  const present = new Set(nodes.map((n) => n.number));
  const outs = new Map(nodes.map((n) => [n.number, []]));
  for (const e of edges) if (present.has(e.from) && present.has(e.to) && e.from !== e.to) outs.get(e.from).push(e.to);
  const rank = new Map(), inprog = new Set();
  const of = (num) => {
    if (rank.has(num)) return rank.get(num);
    if (inprog.has(num)) return 0;
    inprog.add(num);
    let r = 0;
    for (const p of (outs.get(num) || [])) r = Math.max(r, 1 + of(p));
    inprog.delete(num); rank.set(num, r); return r;
  };
  for (const n of nodes) of(n.number);
  return rank;
}
