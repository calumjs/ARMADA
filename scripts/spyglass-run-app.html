<!DOCTYPE html>
<!--
  ARMADA spyglass — per-run operations dashboard (the view).
  Self-contained, no server, no external/CDN libraries, no build step. Polls the
  sibling run-state.json written by spyglass-run-snapshot.mjs and renders each
  in-flight run as a VOYAGE: a ship sailing ARMADA's real armada:* pipeline from
  harbour to port, with live-ticking elapsed, real per-model cost, and the run's
  branch / worktree / folder / logbook "done video".

  ARMADA / nautical themed to match the spyglass sea-chart identity: brass + wood +
  deep-sea palette, a serif ARMADA wordmark, vessel iconography per run, a voyage
  metaphor for the pipeline, and subtle sea swell + bob motion (reduced-motion safe).

  READ-ONLY: it renders a snapshot. It never talks to GitHub or mutates anything —
  the cost/metadata it shows is produced crows-nest-side (crows-nest §8g) and read
  here. The foghorn chime is OFF by default (an opt-in toggle).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARMADA — the lookout's dashboard</title>
<style>
  :root {
    /* deep sea */
    --abyss: #07131f;
    --sea-deep: #0a1d30;
    --sea: #0e3050;
    /* wood + panels */
    --wood: #14263a;
    --wood-2: #182d43;
    --wood-edge: #26405b;
    --wood-edge-2: #33506e;
    /* brass */
    --brass: #c6a86a;
    --brass-bright: #e6c886;
    --brass-dim: #8a7647;
    /* parchment ink */
    --parch: #ece3cd;
    --ink: #dfe6ee;
    --ink-dim: #a4b6c7;
    --ink-faint: #6d8498;
    /* fleet states (colour-blind-safe hues; never colour alone — shape+label too) */
    --queued: #7fb8e6;
    --building: #56b4e9;
    --review: #cf8fbe;
    --awaiting: #e6a93c;
    --done: #37b58c;
    --blocked: #e0563f;
    --line: #21374e;
    --chip: #122234;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    background:
      radial-gradient(1200px 520px at 22% -8%, #123a5c 0%, rgba(18,58,92,0) 60%),
      linear-gradient(180deg, var(--sea-deep) 0%, var(--abyss) 62%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .page { max-width: 1200px; margin: 0 auto; padding: 0 18px 72px; }

  /* ---------- masthead ---------- */
  .masthead { position: relative; padding: 26px 6px 0; margin-bottom: 6px; }
  .brandrow { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .wordmark {
    font-family: var(--serif); font-weight: 700; color: var(--parch);
    font-size: 30px; letter-spacing: .40em; margin: 0; padding-left: .1em;
    text-shadow: 0 1px 0 #05101a, 0 0 22px rgba(198,168,106,.18);
    line-height: 1;
  }
  .wordmark .anchor { color: var(--brass); letter-spacing: normal; margin-right: .28em; }
  .lede { color: var(--brass); font-family: var(--serif); font-style: italic;
    font-size: 14.5px; letter-spacing: .02em; margin-bottom: 3px; }
  .brandrow .spacer { flex: 1 1 30px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 3px; }
  .ro {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #a7e6c2;
    border: 1px solid #1f4a30; background: #0d1e12; padding: 3px 9px; border-radius: 999px;
  }
  .weather {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    letter-spacing: .10em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--wood-edge);
  }
  .weather .glyph { font-size: 13px; line-height: 1; }
  .weather.calm { color: #a4e6c6; background: #0d1f17; border-color: #1e4630; }
  .weather.choppy { color: #b9caf0; background: #10192c; border-color: #2a3c62; }
  .weather.storm { color: #f0b8a2; background: #22110c; border-color: #5a2a1d; }
  .btn-ghost {
    font: inherit; font-size: 11.5px; letter-spacing: .04em; color: var(--ink-dim);
    background: var(--chip); border: 1px solid var(--wood-edge); border-radius: 999px;
    padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { border-color: var(--brass); color: var(--parch); }
  .btn-ghost.on { border-color: var(--brass); color: var(--brass-bright); background: #1a1608; }
  .sortsel {
    font: inherit; font-size: 11.5px; color: var(--ink-dim); background: var(--chip);
    border: 1px solid var(--wood-edge); border-radius: 999px; padding: 4px 8px; cursor: pointer;
  }
  .sortsel:hover { border-color: var(--brass); }

  /* thin animated sea swell under the masthead */
  .swell { height: 26px; margin: 14px 0 0; overflow: hidden; position: relative;
    border-bottom: 1px solid var(--line); }
  .swell svg { position: absolute; bottom: -2px; left: 0; width: 200%; height: 100%;
    animation: drift 13s linear infinite; opacity: .55; }
  .swell svg.b { animation-duration: 21s; animation-direction: reverse; opacity: .3; bottom: -6px; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .substamp { color: var(--ink-faint); font-family: var(--mono); font-size: 11px;
    padding: 8px 6px 2px; letter-spacing: .02em; }

  /* ---------- manifest (fleet totals) bar ---------- */
  .manifest {
    display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 12px 0 18px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.08), 0 6px 18px rgba(0,0,0,.35);
  }
  .m-lede {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 11px 16px; border-right: 1px solid var(--line); min-width: 132px;
  }
  .m-lede .label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .m-lede .val { font-family: var(--serif); font-size: 26px; color: var(--parch); line-height: 1; }
  .m-lede .val .n { color: var(--brass-bright); }
  .gauges { display: flex; align-items: stretch; flex-wrap: wrap; flex: 1 1 auto; }
  .gauge {
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: 10px 14px; min-width: 96px; border-right: 1px solid var(--line);
  }
  .gauge .n { font-family: var(--mono); font-size: 18px; font-weight: 650; color: var(--ink); line-height: 1; }
  .gauge .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .gauge.zero { opacity: .38; }
  .gauge.queued .n { color: var(--queued); }
  .gauge.building .n { color: var(--building); }
  .gauge.reviewing .n { color: var(--review); }
  .gauge.awaiting-merge .n { color: var(--awaiting); }
  .gauge.done .n { color: var(--done); }
  .gauge.blocked .n { color: var(--blocked); }
  .gauge.blocked:not(.zero) { background: #1c0f0b; }
  .m-cost {
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    padding: 10px 18px; margin-left: auto; text-align: right; border-left: 1px solid var(--line);
  }
  .m-cost .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .m-cost .val { font-family: var(--mono); font-size: 19px; font-weight: 650; color: var(--brass-bright); }
  .m-cost .caveat { font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em; }

  /* ---------- the horizon: waiting-runs dependency graph (#111) ---------- */
  .horizon { margin: 4px 0 22px; }
  .horizon .lane-head { margin: 8px 2px 10px; }
  .horizon .lane-head h2 .glyph { color: var(--brass-bright); margin-right: .35em; letter-spacing: normal; }
  .h-caption { color: var(--ink-faint); font-family: var(--serif); font-style: italic;
    font-size: 12.5px; padding: 0 2px 10px; }
  .h-note {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .04em;
    color: #d9b78a; background: #1c1608; border: 1px solid #4a3c1c; border-radius: 999px;
    padding: 2px 9px; margin-left: 6px; vertical-align: middle;
  }
  .graph {
    position: relative; overflow-x: auto; overflow-y: hidden;
    background:
      radial-gradient(900px 300px at 12% -20%, rgba(18,58,92,.5), rgba(18,58,92,0) 60%),
      linear-gradient(180deg, #0c1e30, #0a1826);
    border: 1px solid var(--wood-edge); border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(198,168,106,.06), 0 6px 18px rgba(0,0,0,.3);
    padding: 16px 18px;
  }
  .graph-edges { position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible; z-index: 0; }
  .graph-cols { position: relative; z-index: 1; display: flex; align-items: flex-start;
    gap: 58px; min-width: min-content; }
  .graph-col { display: flex; flex-direction: column; gap: 16px; min-width: 210px; }
  .col-head { font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-faint); padding: 0 2px 2px; border-bottom: 1px dashed var(--line); }
  .col-head.frontier { color: var(--brass); }

  .gnode {
    position: relative; display: block; width: 210px; text-align: left;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-left: 3px solid var(--wood-edge-2);
    border-radius: 10px; padding: 9px 11px 10px; cursor: pointer; color: inherit;
    font: inherit; user-select: none;
  }
  .gnode:hover { border-color: var(--wood-edge-2); }
  .gnode:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .gnode .gn-head { display: flex; align-items: center; gap: 7px; }
  .gnode .gn-ship { width: 22px; height: 16px; flex: none; }
  .gnode .gn-ship svg { width: 22px; height: 16px; }
  .gnode .gn-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 12.5px; }
  .gnode .gn-pill { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 1px 7px; border-radius: 999px;
    border: 1px solid currentColor; }
  .gnode .gn-title { color: var(--parch); font-weight: 600; font-size: 12.5px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gnode .gn-reasons { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
  .gnode .gn-reason {
    display: flex; align-items: baseline; gap: 5px; font-size: 10.5px; font-family: var(--mono);
    color: #e6bfa0; background: #1e120c; border: 1px solid #4a2a1c; border-radius: 6px;
    padding: 2px 7px; letter-spacing: .01em;
  }
  .gnode .gn-reason .rk { color: var(--blocked); font-size: 8px; }

  /* the runnable frontier — glowing brass hulls, "clear to sail" */
  .gnode.eligible { border-color: var(--brass-dim); border-left-color: var(--brass);
    box-shadow: 0 0 0 1px rgba(198,168,106,.18), 0 0 16px rgba(198,168,106,.12); }
  .gnode.eligible .gn-pill { color: var(--done); }
  .gnode.eligible .gn-tag { margin-top: 7px; font-size: 10px; letter-spacing: .04em;
    color: var(--done); font-family: var(--mono); }
  /* held hulls — dimmed, amber seam */
  .gnode.held { border-left-color: var(--awaiting); opacity: .96; }
  .gnode.held .gn-pill { color: var(--awaiting); }
  /* a prerequisite still under way (not part of the frontier decision) */
  .gnode.flight { border-left-color: var(--building); background: linear-gradient(180deg, #10202f, #0d1a27); }
  .gnode.flight .gn-pill { color: var(--building); }
  .gnode.flight.pending { opacity: .78; border-left-color: var(--ink-faint); }
  .gnode.flight.pending .gn-pill { color: var(--ink-faint); }

  .graph-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 4px 0;
    font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }
  .graph-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .graph-legend .swatch { width: 22px; height: 0; border-top: 2px solid var(--ink-faint); }
  .graph-legend .swatch.depends { border-top-style: solid; border-top-color: var(--awaiting); }
  .graph-legend .swatch.samefile { border-top-style: dashed; border-top-color: var(--review); }
  .graph-legend .swatch.lockfile { border-top-style: dashed; border-top-color: var(--brass); }
  .graph-legend .swatch.base { border-top-style: dotted; border-top-color: var(--ink-dim); }
  .graph-legend .dot-e { width: 9px; height: 9px; border-radius: 2px; background: var(--brass); }
  .graph-legend .dot-h { width: 9px; height: 9px; border-radius: 2px; background: var(--awaiting); }
  .graph-flat-note { color: var(--ink-faint); font-family: var(--serif); font-style: italic;
    font-size: 12px; padding: 8px 2px 0; }

  @media (max-width: 760px) {
    .graph-col { min-width: 168px; }
    .gnode { width: 168px; }
  }

  /* ---------- a run (compact voyage row) ---------- */
  .runs { display: flex; flex-direction: column; gap: 11px; }
  .run { position: relative; }
  .voyage-row {
    display: grid; align-items: center; gap: 13px;
    grid-template-columns: 30px 60px minmax(0,1fr) 150px 96px 92px 66px 14px;
    padding: 11px 15px;
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 1px solid var(--wood-edge); border-radius: 12px;
    cursor: pointer; user-select: none;
  }
  .voyage-row:hover { border-color: var(--wood-edge-2); }
  .voyage-row:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .run.expanded > .voyage-row { border-color: var(--brass-dim); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .run.blocked > .voyage-row { border-color: #532a20; }
  .run.blocked > .voyage-row .ship svg { filter: drop-shadow(0 0 5px rgba(224,86,63,.55)); }
  .run.just-shipped > .voyage-row { animation: shipped-glow 2.4s ease-out 1; }
  @keyframes shipped-glow {
    0% { box-shadow: 0 0 0 0 rgba(55,181,140,.55); border-color: var(--done); }
    100% { box-shadow: 0 0 0 14px rgba(55,181,140,0); }
  }
  .ship { width: 30px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .ship svg { width: 28px; height: 21px; }
  .run:not(.blocked) .ship.sailing svg { animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-1.6px) rotate(1.2deg); } }
  .s-num { color: var(--brass); font-family: var(--mono); font-weight: 650; font-size: 13px; }
  .s-title { color: var(--parch); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* voyage progress bar (the signature) */
  .voyage { display: inline-grid; grid-auto-flow: column; gap: 3px; align-items: center; }
  .leg { height: 8px; width: 15px; border-radius: 2px; background: #22384f; position: relative; }
  .leg.done { background: linear-gradient(180deg, var(--brass), var(--brass-dim)); }
  .leg.active { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
  .leg.active::after {
    content: ""; position: absolute; top: -6px; left: 50%; width: 0; height: 0;
    transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 6px solid currentColor;
  }
  .run:not(.blocked) .leg.active::after { animation: bob 3.6s ease-in-out infinite; }
  .leg.blocked { background: var(--blocked); box-shadow: none; }
  .leg.blocked::after { content: none; }

  .s-status { font-weight: 600; font-size: 12.5px; white-space: nowrap; text-align: right; letter-spacing: .01em; }
  .s-cost { color: var(--ink-dim); font-family: var(--mono); font-size: 13px;
    display: inline-flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
  .s-cost.est { color: var(--brass); }
  .s-cost.accruing .cnum { animation: cost-pulse 2.6s ease-in-out infinite; }
  .s-cost .tag { font-size: 8px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-faint); align-self: center; }
  .s-cost.est .tag { color: var(--brass); }
  @keyframes cost-pulse { 0%,100% { opacity: 1; } 50% { opacity: .62; } }
  .s-elapsed { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; }
  /* completed-voyage landing time ("shipped 1h 08m ago") — wider text than the
     compact elapsed clock, so it must NOT wrap inside the time column (recent
     rows widen that column below). */
  .s-when { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }
  .chev { color: var(--ink-faint); font-size: 10px; text-align: center; transition: transform .14s ease; }
  .run.expanded > .voyage-row .chev { transform: rotate(90deg); color: var(--brass); }

  /* ---------- recent voyages lane (the harbour of completed voyages, #113) ---------- */
  .lane-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin: 26px 2px 11px; padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
  }
  .lane-head h2 {
    margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--brass); font-weight: 600;
  }
  .lane-head h2 .anchor { color: var(--brass-bright); margin-right: .35em; letter-spacing: normal; }
  .lane-head .lane-sub { color: var(--ink-faint); font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em; }
  .lane-head .lane-sub .today { color: var(--done); }
  .lane-head .spacer { flex: 1 1 20px; }
  .lane-note { color: var(--ink-faint); font-style: italic; font-family: var(--serif);
    padding: 14px 6px; text-align: center; }

  /* a completed voyage sits "at anchor": brass seam on the left, calmer wood, no bob */
  .run.recent > .voyage-row {
    background: linear-gradient(180deg, #12222f, #0e1c29);
    border-color: var(--wood-edge); border-left: 3px solid var(--brass-dim);
    /* widen the time column (was 66px) so "shipped 1h 08m ago" fits on one line
       instead of wrapping/overlapping; the title (1fr) absorbs the difference. */
    grid-template-columns: 30px 60px minmax(0,1fr) 150px 96px 92px max-content 14px;
  }
  .run.recent.blocked > .voyage-row { border-left-color: var(--blocked); }
  .run.recent > .voyage-row:hover { border-color: var(--wood-edge-2); }
  .run.recent.expanded > .voyage-row { border-color: var(--brass-dim); }
  .s-when { color: var(--ink-faint); font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }

  /* ---------- expanded log card ---------- */
  .logcard {
    border: 1px solid var(--brass-dim); border-top: 0; border-radius: 0 0 12px 12px;
    background: linear-gradient(180deg, var(--wood), #10202f);
    overflow: hidden;
  }
  .run.blocked > .logcard { border-color: #532a20; }
  .card-body { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 4px; padding: 8px 6px; }

  /* left: the voyage pipeline */
  .pipeline { padding: 12px 16px; border-right: 1px solid var(--line); }
  .pipeline h3 { margin: 0 0 9px; font-family: var(--serif); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--brass); font-weight: 600; }
  .stage { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 4px 0; align-items: start; }
  .rung { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #33506e; flex: none; }
  .rail { width: 2px; flex: 1 1 14px; min-height: 14px; background: #22384f; }
  .stage:last-child .rail { display: none; }
  .stage.done .dot { background: var(--brass); }
  .stage.done .rail { background: var(--brass-dim); }
  .stage.active .dot { background: currentColor; box-shadow: 0 0 7px currentColor; }
  .stage.blocked .dot { background: var(--blocked); box-shadow: 0 0 7px var(--blocked); }
  .stage .body { min-width: 0; }
  .stage .name { font-family: var(--serif); font-size: 13.5px; color: var(--ink-faint); }
  .stage.done .name { color: var(--ink-dim); }
  .stage.active .name { color: var(--parch); font-weight: 600; }
  .stage.blocked .name { color: var(--blocked); font-weight: 600; }
  .stage .cap { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  .stage.active .cap { color: var(--ink-dim); }
  .stage .here { margin-left: 7px; font-size: 15px; }

  /* right: metadata */
  .meta { padding: 12px 16px; }
  .row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; padding: 5px 0; }
  .row .k { color: var(--ink-faint); text-align: right; font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; padding-top: 2px; }
  .row .v { color: var(--ink); min-width: 0; }
  .row .v a { color: var(--brass-bright); text-decoration: none; }
  .row .v a:hover { text-decoration: underline; }
  .path { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); word-break: break-all; }
  .naval { color: var(--ink-faint); font-style: italic; }
  .btn {
    display: inline-block; margin-left: 7px; padding: 1px 8px; border-radius: 6px;
    border: 1px solid var(--wood-edge); background: var(--chip); color: var(--ink-dim);
    font-size: 11px; font-family: var(--mono); cursor: pointer; vertical-align: middle;
  }
  .btn:hover { border-color: var(--brass); color: var(--parch); }
  .btn.copied { border-color: var(--done); color: var(--done); }
  .video-wrap { margin-top: 4px; }
  .video-wrap video { width: 330px; max-width: 100%; background: #000; border-radius: 6px; border: 1px solid var(--line); }
  .video-cap { color: var(--ink-faint); font-size: 11.5px; margin-top: 4px; font-family: var(--mono); }

  /* cost ledger */
  .ledger { padding: 6px 20px 16px; border-top: 1px solid var(--line); }
  .ledger h3 { margin: 4px 0 6px; font-family: var(--serif); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--brass); font-weight: 600; }
  table.cost { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  table.cost th {
    text-align: left; color: var(--ink-faint); font-weight: 600; font-size: 10.5px;
    letter-spacing: .09em; padding: 6px 10px; border-bottom: 1px solid var(--wood-edge);
  }
  table.cost th.n, table.cost td.n { text-align: right; }
  table.cost td { padding: 9px 10px; border-bottom: 1px solid var(--line); color: var(--ink-dim); }
  table.cost td.model { color: var(--parch); font-weight: 600; }
  table.cost td.cost { color: var(--brass-bright); font-weight: 650; }
  table.cost td.na { color: var(--ink-faint); }
  .cost-foot { color: var(--ink-faint); font-size: 11.5px; padding: 9px 10px 2px; }
  .cost-foot .ptr { color: var(--ink-dim); }
  /* in-flight vs final banner above the ledger table (#115) */
  .cost-status { font-size: 11.5px; font-family: var(--mono); padding: 0 10px 8px;
    color: var(--ink-faint); letter-spacing: .02em; }
  .cost-status.est { color: var(--brass); }
  .cost-status.final { color: var(--done); }
  .cost-status .pip { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; background: currentColor; }
  .cost-status.est .pip { animation: cost-pulse 2.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .s-cost.accruing .cnum, .cost-status.est .pip { animation: none; }
  }

  /* empty / degraded */
  .empty { text-align: center; color: var(--ink-dim); padding: 70px 20px; }
  .empty .glyph { font-size: 34px; opacity: .8; }
  .empty .big { font-family: var(--serif); font-size: 18px; color: var(--parch); margin: 8px 0 6px; }
  .empty .sub { color: var(--ink-faint); }

  @media (max-width: 760px) {
    .card-body { grid-template-columns: 1fr; }
    .pipeline { border-right: 0; border-bottom: 1px solid var(--line); }
    .row { grid-template-columns: 76px 1fr; }
    .voyage-row { grid-template-columns: 26px 50px minmax(0,1fr) auto 62px 14px; }
    .voyage-row .voyage, .voyage-row .s-elapsed { display: none; }
    .m-cost { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swell svg { animation: none; }
    .ship svg, .leg.active::after { animation: none !important; }
    .stage.active .dot { box-shadow: none; }
    .chev { transition: none; }
    .run.just-shipped > .voyage-row { animation: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <div class="brandrow">
        <div>
          <div class="lede">the lookout's dashboard</div>
          <h1 class="wordmark"><span class="anchor">⚓</span>ARMADA</h1>
        </div>
        <span class="spacer"></span>
        <div class="controls">
          <span class="weather" id="weather" title="Fleet health"><span class="glyph">·</span><span class="txt">…</span></span>
          <select class="sortsel" id="sort" title="Order the fleet" aria-label="Sort runs">
            <option value="stage">by furthest along</option>
            <option value="cost">by cost</option>
            <option value="age">by age</option>
          </select>
          <button class="btn-ghost" id="chime" title="Foghorn chime on ship / block — off by default" aria-pressed="false">
            <span aria-hidden="true">🔇</span><span class="lbl">foghorn</span>
          </button>
          <span class="ro" title="This view performs zero fleet mutations.">read-only</span>
        </div>
      </div>
      <div class="swell" aria-hidden="true">
        <svg viewBox="0 0 1200 30" preserveAspectRatio="none"><path d="M0 18 C 150 6 300 6 450 18 S 750 30 900 18 1200 6 1200 18 L1200 30 0 30Z" fill="#0e3050"/></svg>
        <svg class="b" viewBox="0 0 1200 30" preserveAspectRatio="none"><path d="M0 20 C 180 10 320 10 500 20 S 820 30 1000 20 1200 12 1200 20 L1200 30 0 30Z" fill="#15507f"/></svg>
      </div>
      <div class="substamp" id="sub">weighing anchor…</div>
    </div>
    <div id="fleet"></div>
    <div id="horizon"></div>
    <div class="runs" id="runs"></div>
    <div id="harbour"></div>
  </div>
<script>
"use strict";

// ---- small helpers --------------------------------------------------------
const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const esc = (s) => String(s == null ? "" : s);
function compact(n) {
  if (n == null || !Number.isFinite(n)) return null;
  if (Math.abs(n) >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1).replace(/\.0$/, "") + "k";
  return String(n);
}
function money(n) { return (n == null || !Number.isFinite(n)) ? null : "$" + n.toFixed(2); }
// elapsed from an ISO start, in a compact ship's-log form; ticks live (see below).
function elapsedText(iso) {
  if (!iso) return null;
  const ms = Date.now() - Date.parse(iso);
  if (!Number.isFinite(ms)) return null;
  let s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  if (d) return `${d}d ${String(h).padStart(2, "0")}h`;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

// ---- in-flight cost estimate (#115) ---------------------------------------
// The dashboard is strictly READ-ONLY and the harness surfaces a subagent's usage
// only at completion — no mid-build stream. So for a run that is actively working
// with no reconcile file yet, we show an HONEST estimate off the one live signal we
// have: elapsed build time (cost.costSince) × the fleet burn rate, computed here so
// it ticks every second alongside elapsed. It is a display derivation — never
// written back — and clearly labelled, converging to the real figure at completion.
let estRatePerMin = 0;                 // set from state.estRatePerMin on each render
function estFromSince(since) {
  if (!since || !(estRatePerMin > 0)) return null;
  const ms = Date.now() - Date.parse(since);
  if (!Number.isFinite(ms)) return null;
  return Math.max(0, (ms / 60000) * estRatePerMin);
}
function estCostLive(run) { return estFromSince(run && run.cost && run.cost.costSince); }

// What the compact row's cost cell should read — estimated / accruing / final.
// { text, cls, tag, title, since } so the row and the 1s ticker stay in agreement.
//   estimated (live)  → "~$X"  tag "est"     (elapsed estimate, ticks live)
//   estimate, no rate → "accruing…"          (no number — but never a false $0.00)
//   recorded+accruing → "$X"   tag "so far"  (real-so-far, still accruing)
//   recorded+final    → "$X"                 (settled — no caveat)
//   nothing yet       → "—"
function costCell(run) {
  const c = (run && run.cost) || {};
  const rec = c.present && typeof c.totalCost === "number";
  if (c.estimated) {
    const live = estCostLive(run);
    if (live == null) return { text: "accruing…", cls: "est accruing", tag: null, title: "cost is accruing — no usage recorded yet", since: null };
    return { text: "~" + money(live), cls: "est accruing", tag: "est", title: "estimate from elapsed build time — accruing, not billing", since: c.costSince };
  }
  if (rec && c.accruing) return { text: money(c.totalCost), cls: "est accruing", tag: "so far", title: "recorded so far — accruing, not final", since: null };
  if (rec) return { text: money(c.totalCost), cls: c.final ? "" : "est", tag: null, title: c.final ? "final cost — API-equivalent estimate, not billing" : "API-equivalent estimate, not billing", since: null };
  return { text: "—", cls: "", tag: null, title: null, since: null };
}

// The banner above the ledger table stating the run's cost phase (#115).
function ledgerStatus(run) {
  const c = (run && run.cost) || {};
  const rec = c.present && typeof c.totalCost === "number";
  if (c.estimated) {
    const live = estCostLive(run);
    const amt = live == null ? "" : ` — ~${money(live)} and climbing`;
    return { cls: "est", text: `estimating from elapsed build time${amt} · no real usage recorded yet, converges at completion` };
  }
  if (rec && c.accruing) return { cls: "est", text: "recorded so far — accruing, not final · more usage lands at review / ship" };
  if (rec && c.final) return { cls: "final", text: "final — reconciled at ship" };
  return null;
}

// state colour by coarse group (never colour alone — shape + printed name too)
const GROUP_COLOR = {
  queued: "var(--queued)", building: "var(--building)", reviewing: "var(--review)",
  "awaiting-merge": "var(--awaiting)", done: "var(--done)", blocked: "var(--blocked)",
};
// The gauges shown in the manifest bar, in voyage order (+ blocked).
const GAUGES = [
  ["queued", "queued"], ["building", "building"], ["reviewing", "reviewing"],
  ["awaiting-merge", "awaiting"], ["done", "done"], ["blocked", "blocked"],
];

// vessel iconography — a little sloop, tinted by state colour.
function shipSVG(color) {
  return `<svg viewBox="0 0 28 21" fill="none" aria-hidden="true">
    <path d="M14 1 L14 12" stroke="${color}" stroke-width="1.3"/>
    <path d="M14 2 L22 11 L14 11 Z" fill="${color}" opacity=".9"/>
    <path d="M13 3 L7 11 L13 11 Z" fill="${color}" opacity=".55"/>
    <path d="M4 12 L24 12 L21 18 L7 18 Z" fill="${color}"/>
  </svg>`;
}

// ---- run identity + group fallback (mirror the driver) --------------------
const runKey = (run) => "r:" + (run.issueNumber != null ? "i" + run.issueNumber : "p" + run.prNumber);
const expanded = new Set();        // run keys the operator has opened — preserved across polls
let prevState = new Map();         // runKey -> { group, activeIndex, blocked } from the last render
let sortMode = "stage";

function groupOf(run) {
  if (run.group) return run.group;
  if (run.blocked) return "blocked";
  const i = run.activeIndex;
  if (run.terminal || i >= 5) return "done";
  if (i === 4) return "awaiting-merge";
  if (i === 2 || i === 3) return "reviewing";
  if (i === 1) return "building";
  return "queued";
}

// The voyage bar — one leg per real stage, a vessel marker on the active leg.
function buildVoyage(run) {
  const bar = $("span", "voyage");
  const n = (run.stages || []).length || 7;
  const color = GROUP_COLOR[groupOf(run)] || "var(--building)";
  for (let i = 0; i < n; i++) {
    const leg = $("span", "leg");
    if (run.blocked && i === run.activeIndex) leg.classList.add("blocked");
    else if (i < run.activeIndex) leg.classList.add("done");
    else if (i === run.activeIndex) { leg.classList.add(run.terminal ? "done" : "active"); leg.style.color = color; }
    bar.appendChild(leg);
  }
  return bar;
}

// ---- compact voyage row (default overview) --------------------------------
function renderRow(run, isOpen) {
  const num = "#" + (run.issueNumber ?? run.prNumber ?? "?");
  const g = groupOf(run);
  const color = GROUP_COLOR[g] || "var(--building)";
  const row = $("div", "voyage-row");
  row.setAttribute("role", "button");
  row.setAttribute("tabindex", "0");
  row.setAttribute("aria-expanded", isOpen ? "true" : "false");
  row.setAttribute("aria-label", `${num} ${run.title || ""} — ${run.blocked ? "Blocked" : (run.status || "")} — ${isOpen ? "expanded" : "collapsed"}`);

  const ship = $("span", "ship" + (run.blocked || run.terminal ? "" : " sailing"));
  ship.innerHTML = shipSVG(color);
  row.appendChild(ship);
  row.appendChild($("span", "s-num", num));
  row.appendChild($("span", "s-title", esc(run.title)));
  row.appendChild(buildVoyage(run));

  const st = $("span", "s-status", run.blocked ? "Blocked" : esc(run.status));
  st.style.color = color;
  row.appendChild(st);

  const cd = costCell(run);
  const c = $("span", "s-cost" + (cd.cls ? " " + cd.cls : ""));
  const cnum = $("span", "cnum", cd.text);
  if (cd.since) { cnum.classList.add("js-estcost"); cnum.dataset.since = cd.since; }
  c.appendChild(cnum);
  if (cd.tag) c.appendChild($("span", "tag", cd.tag));
  if (cd.title) c.title = cd.title;
  row.appendChild(c);

  if (run.recent) {
    // A completed voyage: show when it landed (static), not a live-ticking clock.
    const when = $("span", "s-when");
    const ago = elapsedText(run.completedAt);
    const verb = run.outcome === "Merged" ? "merged" : (run.blocked ? "blocked" : "shipped");
    when.textContent = ago ? `${verb} ${ago} ago` : verb;
    if (run.completedAt) when.title = new Date(run.completedAt).toLocaleString();
    row.appendChild(when);
  } else {
    const el = $("span", "s-elapsed js-elapsed");
    if (run.startedAt) { el.dataset.since = run.startedAt; el.textContent = elapsedText(run.startedAt) || ""; }
    row.appendChild(el);
  }

  row.appendChild($("span", "chev", "▶"));
  return row;
}

// ---- the expanded log card ------------------------------------------------
function copyBtn(label, text) {
  const b = $("button", "btn", label);
  if (text == null) { b.disabled = true; b.style.opacity = .4; return b; }
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    try { navigator.clipboard.writeText(text); } catch { /* clipboard blocked — best effort */ }
    b.classList.add("copied"); const old = b.textContent; b.textContent = "copied";
    setTimeout(() => { b.classList.remove("copied"); b.textContent = old; }, 1200);
  });
  return b;
}
function openBtn(pathStr) {
  const b = $("a", "btn", "open");
  if (pathStr == null) { b.style.opacity = .4; return b; }
  b.href = "file:///" + String(pathStr).replace(/\\/g, "/").replace(/^\/+/, "");
  b.target = "_blank"; b.rel = "noopener";
  b.addEventListener("click", (e) => e.stopPropagation());
  return b;
}

function renderPipeline(run) {
  const col = $("div", "pipeline");
  col.appendChild($("h3", null, "the voyage"));
  const caps = run.stageCaptions || [];
  const color = GROUP_COLOR[groupOf(run)] || "var(--building)";
  (run.stages || []).forEach((name, i) => {
    let cls = "stage";
    const isActive = i === run.activeIndex;
    if (run.blocked && isActive) cls += " blocked";
    else if (i < run.activeIndex) cls += " done";
    else if (isActive) cls += run.terminal ? " done" : " active";
    const stage = $("div", cls);
    if (isActive && !run.blocked && !run.terminal) stage.style.color = color;
    const rung = $("div", "rung");
    rung.appendChild($("span", "dot"));
    rung.appendChild($("span", "rail"));
    stage.appendChild(rung);
    const body = $("div", "body");
    const nm = $("span", "name", name);
    if (isActive) { const here = $("span", "here", run.blocked ? "⚠" : (run.terminal ? "⚓" : "⛵")); nm.appendChild(here); }
    body.appendChild(nm);
    if (caps[i]) body.appendChild($("div", "cap", caps[i]));
    stage.appendChild(body);
    col.appendChild(stage);
  });
  return col;
}

function metaRow(k, valueNode) {
  const row = $("div", "row");
  row.appendChild($("div", "k", k));
  const v = $("div", "v");
  if (valueNode instanceof Node) v.appendChild(valueNode); else v.textContent = esc(valueNode);
  row.appendChild(v);
  return row;
}
function renderMeta(run) {
  const col = $("div", "meta");
  // issue / PR deep links
  const idV = $("span");
  if (run.issueUrl) { const a = $("a", null, "#" + run.issueNumber); a.href = run.issueUrl; a.target = "_blank"; a.rel = "noopener"; a.addEventListener("click", (e) => e.stopPropagation()); idV.appendChild(a); }
  else idV.appendChild($("span", "naval", run.prUrl ? "" : "n/a"));
  if (run.prUrl) { idV.appendChild(document.createTextNode("  ")); const p = $("a", null, "PR #" + run.prNumber); p.href = run.prUrl; p.target = "_blank"; p.rel = "noopener"; p.addEventListener("click", (e) => e.stopPropagation()); idV.appendChild(p); }
  col.appendChild(metaRow("issue / pr", idV));
  // outcome + merge commit (recent/terminal runs only)
  if (run.recent) {
    const ocV = $("span");
    const g = groupOf(run);
    const pill = $("span", "s-status", run.blocked ? "Blocked" : esc(run.outcome || run.status));
    pill.style.color = GROUP_COLOR[g] || "var(--done)";
    ocV.appendChild(pill);
    if (run.completedAt) {
      const ago = elapsedText(run.completedAt);
      ocV.appendChild($("span", "naval", ago ? `  ·  ${ago} ago` : ""));
    }
    col.appendChild(metaRow("outcome", ocV));
    const mcV = $("span");
    if (run.mergeCommitUrl && run.mergeCommitOid) {
      const a = $("a", null, run.mergeCommitOid.slice(0, 10));
      a.href = run.mergeCommitUrl; a.target = "_blank"; a.rel = "noopener";
      a.addEventListener("click", (e) => e.stopPropagation());
      mcV.appendChild($("span", "path", "⌥ ")); mcV.appendChild(a);
      mcV.appendChild(copyBtn("copy", run.mergeCommitOid));
    } else mcV.appendChild($("span", "naval", "n/a"));
    col.appendChild(metaRow("merge commit", mcV));
  }
  // branch
  const brV = $("span");
  if (run.branch) { brV.appendChild($("span", "path", "⎇ " + run.branch)); brV.appendChild(copyBtn("copy", run.branch)); }
  else brV.appendChild($("span", "naval", "n/a — not dispatched yet"));
  col.appendChild(metaRow("branch", brV));
  // worktree
  const wtV = $("span");
  if (run.worktree) { wtV.appendChild($("span", "path", run.worktree)); wtV.appendChild(openBtn(run.worktree)); wtV.appendChild(copyBtn("copy path", run.worktree)); }
  else wtV.appendChild($("span", "naval", "n/a — no local worktree"));
  col.appendChild(metaRow("worktree", wtV));
  // folder
  const foV = $("span");
  if (run.folder) { foV.appendChild($("span", "path", run.folder)); foV.appendChild(openBtn(run.folder)); foV.appendChild(copyBtn("copy path", run.folder)); }
  else foV.appendChild($("span", "naval", "n/a"));
  col.appendChild(metaRow("folder", foV));
  // done video
  const vidV = $("div");
  if (run.doneVideo && run.doneVideo.url) {
    const wrap = $("div", "video-wrap");
    const v = document.createElement("video");
    v.controls = true; v.preload = "metadata"; v.src = run.doneVideo.url;
    v.addEventListener("click", (e) => e.stopPropagation());
    wrap.appendChild(v);
    const cap = [run.doneVideo.name, elapsedText(run.doneVideo.updatedAt) ? elapsedText(run.doneVideo.updatedAt) + " old" : null].filter(Boolean).join(" · ");
    wrap.appendChild($("div", "video-cap", cap));
    vidV.appendChild(wrap);
  } else vidV.appendChild($("span", "naval", "no walkthrough recorded yet"));
  col.appendChild(metaRow("done video", vidV));
  return col;
}

function renderLedger(run) {
  const block = $("div", "ledger");
  block.appendChild($("h3", null, "cost ledger"));
  const c = run.cost || {};
  // in-flight vs final banner (#115): estimating / accruing / final.
  const status = ledgerStatus(run);
  if (status) {
    const sb = $("div", "cost-status" + (status.cls ? " " + status.cls : ""));
    sb.appendChild($("span", "pip"));
    sb.appendChild(document.createTextNode(status.text));
    block.appendChild(sb);
  }
  const table = $("table", "cost");
  const thead = $("thead"); const htr = $("tr");
  ["MODEL", "IN", "OUT", "CACHE R", "CACHE W", "≈ COST"].forEach((h, i) => htr.appendChild($("th", i === 0 ? "" : "n", h)));
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = $("tbody");
  const models = (c.present && Array.isArray(c.models)) ? c.models : [];
  if (models.length) {
    for (const m of models) {
      const tr = $("tr");
      tr.appendChild($("td", "model", esc(m.model)));
      const cell = (v) => { const td = $("td", "n"); const t = compact(v); if (t == null) { td.textContent = "n/a"; td.classList.add("na"); } else td.textContent = t; return td; };
      tr.appendChild(cell(m.in)); tr.appendChild(cell(m.out)); tr.appendChild(cell(m.cacheRead)); tr.appendChild(cell(m.cacheWrite));
      const costTd = $("td", "n cost"); const mv = money(m.cost);
      if (mv == null) { costTd.textContent = "n/a"; costTd.className = "n na"; } else costTd.textContent = mv;
      tr.appendChild(costTd);
      tbody.appendChild(tr);
    }
  } else {
    const tr = $("tr"); const td = $("td", "na"); td.colSpan = 6;
    td.textContent = (c.estimated)
      ? "no real usage recorded yet — the figure above is an elapsed-based estimate; crows-nest writes out/costs/<run>.json at the first reconcile"
      : "no cost post-mortem for this run yet — crows-nest writes out/costs/<run>.json as usage accrues";
    tr.appendChild(td); tbody.appendChild(tr);
  }
  table.appendChild(tbody); block.appendChild(table);
  const parts = [];
  if (c.present) {
    if (c.sessions != null || c.subagents != null) parts.push(`${c.sessions ?? 0} claude session(s) + ${c.subagents ?? 0} subagents`);
    if (c.codex != null) parts.push(`${c.codex} codex`);
  }
  parts.push("API-equivalent estimate, not billing");
  if (c.present && c.unpriced && c.unpriced.length) parts.push("unpriced: " + c.unpriced.join(", "));
  block.appendChild($("div", "cost-foot", parts.join(" · ")));
  const ptr = $("div", "cost-foot");
  ptr.appendChild(document.createTextNode("post-mortem: "));
  ptr.appendChild($("span", "ptr", c.pointer || "out/costs/<run>.json"));
  block.appendChild(ptr);
  return block;
}

function renderCard(run) {
  const card = $("div", "logcard");
  const body = $("div", "card-body");
  body.appendChild(renderPipeline(run));
  body.appendChild(renderMeta(run));
  card.appendChild(body);
  card.appendChild(renderLedger(run));
  return card;
}

// a run block = the voyage row + (when expanded) the full log card.
function renderRun(run) {
  const key = runKey(run);
  const isOpen = expanded.has(key);
  const block = $("div", "run" + (run.recent ? " recent" : "") + (run.blocked ? " blocked" : "") + (run.terminal ? " terminal" : "") + (isOpen ? " expanded" : ""));
  block.dataset.key = key;
  const row = renderRow(run, isOpen);
  const toggle = () => {
    if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
    const next = renderRun(run);
    block.replaceWith(next);
    if (expanded.has(key)) { const s = next.querySelector(".voyage-row"); if (s) s.focus(); }
  };
  row.addEventListener("click", toggle);
  row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); } });
  block.appendChild(row);
  if (isOpen) block.appendChild(renderCard(run));
  return block;
}

// ---- manifest (fleet totals) bar ------------------------------------------
function renderFleet(state, runs) {
  const wrap = document.getElementById("fleet");
  wrap.textContent = "";
  if (!runs.length) return;
  const r = state && state.rollup;
  const counts = {}; for (const [k] of GAUGES) counts[k] = 0;
  let total = 0, costKnown = false;
  if (r) { for (const [k] of GAUGES) counts[k] = r[k] || 0; total = r.totalCost || 0; costKnown = !!r.costKnown; }
  else { for (const run of runs) { const g = groupOf(run); counts[g] = (counts[g] || 0) + 1; const tc = run.cost && run.cost.present ? run.cost.totalCost : null; if (typeof tc === "number") { total += tc; costKnown = true; } } }

  const bar = $("div", "manifest");
  const lede = $("div", "m-lede");
  lede.appendChild($("div", "label", "in flight"));
  const val = $("div", "val"); val.appendChild($("span", "n", String(runs.length))); val.appendChild(document.createTextNode(runs.length === 1 ? " voyage" : " voyages"));
  lede.appendChild(val);
  bar.appendChild(lede);
  const gauges = $("div", "gauges");
  for (const [key, label] of GAUGES) {
    const n = counts[key] || 0;
    const g = $("div", "gauge " + key + (n === 0 ? " zero" : ""));
    g.appendChild($("span", "n", String(n)));
    g.appendChild($("span", "lbl", label));
    gauges.appendChild(g);
  }
  bar.appendChild(gauges);
  const shippedToday = r && typeof r.shippedToday === "number" ? r.shippedToday : null;
  if (shippedToday != null) {
    const st = $("div", "gauge done" + (shippedToday === 0 ? " zero" : ""));
    st.title = "Completed voyages that landed today (see the recent-voyages lane)";
    st.appendChild($("span", "n", String(shippedToday)));
    st.appendChild($("span", "lbl", "shipped today"));
    bar.appendChild(st);
  }
  // fleet cost folds in-flight estimates (#115) — caveat + "~" when it does.
  const estIncl = !!(r && r.estIncluded);
  const cost = $("div", "m-cost");
  cost.appendChild($("div", "label", "fleet cost"));
  const valText = costKnown ? ((estIncl ? "~" : "") + (money(total) || "$0.00")) : "n/a";
  cost.appendChild($("div", "val" + (estIncl ? " est" : ""), valText));
  cost.appendChild($("div", "caveat", estIncl ? "incl. live estimates" : "API-equivalent estimate"));
  bar.appendChild(cost);
  wrap.appendChild(bar);
}

function setWeather(runs) {
  const el = document.getElementById("weather");
  const blocked = runs.filter((r) => r.blocked).length;
  const anyFlight = runs.some((r) => !r.terminal && !r.blocked);
  let cls, glyph, txt;
  if (blocked) { cls = "storm"; glyph = "⛈"; txt = `storm · ${blocked} blocked`; }
  else if (anyFlight) { cls = "choppy"; glyph = "🌊"; txt = "choppy · underway"; }
  else { cls = "calm"; glyph = "⚓"; txt = "calm seas"; }
  el.className = "weather " + cls;
  el.querySelector(".glyph").textContent = glyph;
  el.querySelector(".txt").textContent = txt;
}

// ---- sort -----------------------------------------------------------------
function sortRuns(runs) {
  const arr = runs.slice();
  if (sortMode === "cost") {
    // sort by the run's real figure, or its live estimate when that's all there is (#115)
    const cv = (run) => { const c = run.cost || {}; return (typeof c.totalCost === "number" ? c.totalCost : (estCostLive(run) ?? c.estTotalCost)) || 0; };
    arr.sort((a, b) => cv(b) - cv(a) || (Number(b.blocked) - Number(a.blocked)));
  } else if (sortMode === "age") {
    arr.sort((a, b) => (Date.parse(a.startedAt || 0) || 0) - (Date.parse(b.startedAt || 0) || 0));
  } // "stage" — keep the driver's blocked-first / furthest-along order
  return arr;
}

// ---- transition flourish + optional foghorn -------------------------------
function detectTransitions(runs) {
  const events = [];
  const now = new Map();
  for (const run of runs) {
    const key = runKey(run);
    const cur = { group: groupOf(run), activeIndex: run.activeIndex, blocked: !!run.blocked };
    now.set(key, cur);
    const prev = prevState.get(key);
    if (!prev) continue;
    if (cur.blocked && !prev.blocked) events.push({ key, kind: "blocked" });
    else if (cur.group === "done" && prev.group !== "done") events.push({ key, kind: "shipped" });
  }
  prevState = now;
  return events;
}

// foghorn chime — OFF by default, opt-in. No external asset: a short two-tone
// WebAudio blast. Enabling requires the toggle click (the user gesture that also
// unlocks audio). Plays only on a ship/block transition while enabled.
let chimeOn = false, audioCtx = null;
function foghorn(kind) {
  if (!chimeOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const notes = kind === "blocked" ? [138, 110] : [110, 146];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sawtooth"; o.frequency.value = f;
      const s = t + i * 0.55;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.16, s + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + 0.55);
    });
  } catch { /* audio unavailable — silent */ }
}
document.getElementById("chime").addEventListener("click", (e) => {
  chimeOn = !chimeOn;
  const b = e.currentTarget;
  b.classList.toggle("on", chimeOn);
  b.setAttribute("aria-pressed", chimeOn ? "true" : "false");
  b.querySelector("span[aria-hidden]").textContent = chimeOn ? "📢" : "🔇";
  if (chimeOn) foghorn("shipped"); // confirmation blast (and unlocks audio)
});
document.getElementById("sort").addEventListener("change", (e) => { sortMode = e.target.value; if (lastState) render(lastState); });
// Re-lay the horizon graph's SVG edges when the viewport reflows (debounced).
let resizeT = null;
window.addEventListener("resize", () => {
  if (resizeT) clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (horizonRedraw) requestAnimationFrame(horizonRedraw); }, 120);
});

// ---- recent voyages lane (the harbour of completed voyages, #113) ----------
function renderHarbour(state, recentRuns) {
  const wrap = document.getElementById("harbour");
  wrap.textContent = "";
  if (!recentRuns.length) return;
  const r = state && state.rollup;
  const shippedToday = r && typeof r.shippedToday === "number"
    ? r.shippedToday
    : recentRuns.filter((x) => !x.blocked).length;
  const win = state && state.recentWindow;

  const head = $("div", "lane-head");
  const h2 = $("h2"); h2.appendChild($("span", "anchor", "⚓"));
  h2.appendChild(document.createTextNode("recent voyages"));
  head.appendChild(h2);
  const sub = $("span", "lane-sub");
  const bits = [`${recentRuns.length} in the harbour`];
  const st = $("span"); st.appendChild(document.createTextNode(bits.join(" · ") + " · "));
  const today = $("span", "today", `${shippedToday} shipped today`);
  st.appendChild(today);
  if (win && win.hours > 0) st.appendChild(document.createTextNode(` · last ${win.hours}h`));
  sub.appendChild(st);
  head.appendChild(sub);
  wrap.appendChild(head);

  // Recent runs arrive pre-sorted newest-completed-first from the driver; keep it.
  for (const run of recentRuns) wrap.appendChild(renderRun(run));
}

// ---- the horizon: waiting-runs dependency graph (#111) --------------------
// Nodes = queued/held runs (+ any still-in-flight prerequisite they wait on);
// directed edges = crows-nest §2b relationships (depends on #N / same-file or
// shared-lockfile conflict / base about to move). The runnable FRONTIER (eligible,
// no unsatisfied edge) glows brass — "clear to sail"; held nodes are dimmed with an
// amber seam and carry their reason ("waiting on #N" / "conflicts with #M on <file>"
// / "queued: N/M builds in flight"). Read-only. Degrades to a flat frontier list
// when there are no edges, and renders nothing when there's no scheduler state.
const SVGNS = "http://www.w3.org/2000/svg";
const EDGE_COLOR = { depends: "var(--awaiting)", "same-file": "var(--review)", lockfile: "var(--brass)", base: "var(--ink-dim)" };
const EDGE_DASH = { depends: "", "same-file": "5 4", lockfile: "5 4", base: "2 5" };
let horizonRedraw = null;   // re-draw the SVG edges on resize without a full re-render

function gnodeClass(n) {
  if (!n.waiting) return "flight" + (n.status === "pending" ? " pending" : "");
  return n.eligible ? "eligible" : "held";
}

// Longest-path ranking. An edge from→to means "from waits on to", so the prerequisite
// `to` sits one column LEFT of the dependent `from`. rank(leaf)=0. Cycle-guarded.
function rankNodes(nodes, edges) {
  const present = new Set(nodes.map((n) => n.number));
  const outs = new Map(nodes.map((n) => [n.number, []]));
  for (const e of edges) if (present.has(e.from) && present.has(e.to) && e.from !== e.to) outs.get(e.from).push(e.to);
  const rank = new Map(), inprog = new Set();
  const of = (num) => {
    if (rank.has(num)) return rank.get(num);
    if (inprog.has(num)) return 0;
    inprog.add(num);
    let r = 0;
    for (const p of (outs.get(num) || [])) r = Math.max(r, 1 + of(p));
    inprog.delete(num); rank.set(num, r); return r;
  };
  for (const n of nodes) of(n.number);
  return rank;
}

function renderGnode(n) {
  const el = $("button", "gnode " + gnodeClass(n));
  el.type = "button";
  el.setAttribute("aria-label", `#${n.number} ${n.title || ""} — ${n.status}`);
  const head = $("div", "gn-head");
  const color = n.waiting
    ? (n.eligible ? "var(--brass-bright)" : "var(--awaiting)")
    : (n.status === "pending" ? "var(--ink-faint)" : "var(--building)");
  const ship = $("span", "gn-ship"); ship.innerHTML = shipSVG(color); head.appendChild(ship);
  head.appendChild($("span", "gn-num", "#" + n.number));
  head.appendChild($("span", "gn-pill", n.status));
  el.appendChild(head);
  el.appendChild($("div", "gn-title", esc(n.title)));
  if (n.waiting && n.eligible) el.appendChild($("div", "gn-tag", "⛵ clear to sail"));
  if (n.waiting && n.held && n.reasons && n.reasons.length) {
    const rs = $("div", "gn-reasons");
    for (const r of n.reasons) { const c = $("div", "gn-reason"); c.appendChild($("span", "rk", "●")); c.appendChild(document.createTextNode(r)); rs.appendChild(c); }
    el.appendChild(rs);
  }
  if (n.url) el.addEventListener("click", (e) => { e.stopPropagation(); window.open(n.url, "_blank", "noopener"); });
  return el;
}

function graphLegend(kinds) {
  const lg = $("div", "graph-legend");
  const line = (cls, label) => { const w = $("span", "lg"); w.appendChild($("span", "swatch " + cls)); w.appendChild(document.createTextNode(label)); return w; };
  if (kinds.has("depends")) lg.appendChild(line("depends", "depends on #N"));
  if (kinds.has("same-file")) lg.appendChild(line("samefile", "same-file conflict"));
  if (kinds.has("lockfile")) lg.appendChild(line("lockfile", "shared lockfile"));
  if (kinds.has("base")) lg.appendChild(line("base", "base about to move"));
  const fr = $("span", "lg"); fr.appendChild($("span", "dot-e")); fr.appendChild(document.createTextNode("runnable frontier")); lg.appendChild(fr);
  const hd = $("span", "lg"); hd.appendChild($("span", "dot-h")); hd.appendChild(document.createTextNode("held")); lg.appendChild(hd);
  return lg;
}

// Draw the directed edges as SVG beziers once the node boxes are laid out. Measured
// against the SVG's own client rect, so it's correct at any horizontal scroll offset.
function drawGraphEdges(graph, svg, edges, nodeEl) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const W = graph.scrollWidth, H = graph.scrollHeight;
  svg.style.width = W + "px"; svg.style.height = H + "px";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const defs = document.createElementNS(SVGNS, "defs");
  const markers = { depends: "var(--awaiting)", "same-file": "var(--review)", lockfile: "var(--brass)", base: "var(--ink-dim)", satisfied: "var(--done)" };
  for (const [k, c] of Object.entries(markers)) {
    const mk = document.createElementNS(SVGNS, "marker");
    mk.setAttribute("id", "ah-" + k); mk.setAttribute("viewBox", "0 0 10 10");
    mk.setAttribute("refX", "9"); mk.setAttribute("refY", "5");
    mk.setAttribute("markerWidth", "9"); mk.setAttribute("markerHeight", "9");
    mk.setAttribute("orient", "auto"); mk.setAttribute("markerUnits", "userSpaceOnUse");
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", "M0 0 L10 5 L0 10 z"); p.setAttribute("fill", c);
    mk.appendChild(p); defs.appendChild(mk);
  }
  svg.appendChild(defs);
  const sr = svg.getBoundingClientRect();
  const leftMid = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - sr.left, y: r.top - sr.top + r.height / 2 }; };
  const rightMid = (el) => { const r = el.getBoundingClientRect(); return { x: r.right - sr.left, y: r.top - sr.top + r.height / 2 }; };
  for (const e of edges) {
    const fromEl = nodeEl.get(e.from), toEl = nodeEl.get(e.to);
    if (!fromEl || !toEl) continue;
    const mk = e.satisfied ? "satisfied" : (markers[e.kind] ? e.kind : "depends");
    const color = e.satisfied ? "var(--done)" : (EDGE_COLOR[e.kind] || "var(--awaiting)");
    const a = leftMid(fromEl), b = rightMid(toEl);   // dependent's left → prerequisite's right
    const dx = Math.max(26, Math.abs(a.x - b.x) * 0.45);
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", `M ${a.x} ${a.y} C ${a.x - dx} ${a.y}, ${b.x + dx} ${b.y}, ${b.x} ${b.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", e.satisfied ? "1.4" : "1.8");
    path.setAttribute("opacity", e.satisfied ? "0.5" : "0.85");
    if (EDGE_DASH[e.kind]) path.setAttribute("stroke-dasharray", EDGE_DASH[e.kind]);
    path.setAttribute("marker-end", `url(#ah-${mk})`);
    if (e.reason) { const t = document.createElementNS(SVGNS, "title"); t.textContent = e.reason; path.appendChild(t); }
    svg.appendChild(path);
  }
}

function renderHorizon(state) {
  const wrap = document.getElementById("horizon");
  wrap.textContent = "";
  horizonRedraw = null;
  const sched = state && state.scheduler;
  if (!sched || !Array.isArray(sched.nodes) || !sched.nodes.length) return;
  const waiting = sched.nodes.filter((n) => n.waiting);
  if (!waiting.length) return;
  const nodes = sched.nodes, edges = Array.isArray(sched.edges) ? sched.edges : [];

  const lane = $("div", "horizon");
  const head = $("div", "lane-head");
  const h2 = $("h2"); h2.appendChild($("span", "glyph", "🧭")); h2.appendChild(document.createTextNode("on the horizon"));
  head.appendChild(h2);
  const elig = waiting.filter((n) => n.eligible).length;
  const sub = $("span", "lane-sub", `${waiting.length} waiting · ${elig} clear to sail · ${waiting.length - elig} held`);
  head.appendChild(sub);
  head.appendChild($("span", "spacer"));
  if (sched.source === "inferred") { const note = $("span", "h-note", "⚑ best-effort graph"); note.title = sched.note || "inferred from issue/PR bodies + file overlap"; head.appendChild(note); }
  lane.appendChild(head);
  lane.appendChild($("div", "h-caption", "Left to right: what must land before what. Glowing hulls are the runnable frontier — clear to sail now; dimmed hulls are held, each with its reason."));

  const rank = rankNodes(nodes, edges);
  let maxRank = 0; for (const v of rank.values()) maxRank = Math.max(maxRank, v);
  const cols = []; for (let i = 0; i <= maxRank; i++) cols.push([]);
  const ordered = nodes.slice().sort((a, b) => (Number(b.waiting) - Number(a.waiting)) || (a.number - b.number));
  for (const n of ordered) (cols[rank.get(n.number) || 0]).push(n);

  const graph = $("div", "graph");
  const svg = document.createElementNS(SVGNS, "svg"); svg.setAttribute("class", "graph-edges");
  graph.appendChild(svg);
  const colsWrap = $("div", "graph-cols");
  const nodeEl = new Map();
  cols.forEach((colNodes, ci) => {
    const col = $("div", "graph-col");
    const ch = $("div", "col-head" + (ci === 0 ? " frontier" : ""));
    ch.textContent = ci === 0 ? "no dependency ahead" : `waits on ← (depth ${ci})`;
    col.appendChild(ch);
    for (const n of colNodes) { const el = renderGnode(n); nodeEl.set(n.number, el); col.appendChild(el); }
    colsWrap.appendChild(col);
  });
  graph.appendChild(colsWrap);
  lane.appendChild(graph);

  if (edges.length) {
    lane.appendChild(graphLegend(new Set(edges.map((e) => e.kind))));
  } else {
    lane.appendChild($("div", "graph-flat-note", "No dependencies or conflicts among the waiting runs — every hull is clear to sail (the fleet dispatches them as slots free)."));
  }
  wrap.appendChild(lane);

  // Draw edges after the boxes have laid out; keep a redraw hook for resize.
  const draw = () => drawGraphEdges(graph, svg, edges, nodeEl);
  horizonRedraw = draw;
  requestAnimationFrame(draw);
}

// ---- render ---------------------------------------------------------------
let lastState = null;
function render(state) {
  lastState = state;
  estRatePerMin = (state && Number(state.estRatePerMin)) || 0;   // drives the live in-flight estimate (#115)
  const sub = document.getElementById("sub");
  const wrap = document.getElementById("runs");
  const harbourEl = document.getElementById("harbour");
  wrap.textContent = "";
  const runs = (state && state.runs) || [];
  const recentRuns = (state && state.recentRuns) || [];
  const stamp = state && state.generatedAt ? new Date(state.generatedAt).toLocaleTimeString() : "";
  sub.textContent = `${esc(state && state.repo)} · ${runs.length} run(s) · ${esc((state && state.summary) || "")}${stamp ? " · charted " + stamp : ""}`;

  setWeather(runs);

  // prune expand state for runs that have left BOTH lanes (a run merging moves
  // from in-flight to the harbour — keep its expanded state across that hop).
  const live = new Set([...runs, ...recentRuns].map(runKey));
  for (const k of Array.from(expanded)) if (!live.has(k)) expanded.delete(k);

  if (state && state.degraded) {
    document.getElementById("fleet").textContent = "";
    document.getElementById("horizon").textContent = "";
    harbourEl.textContent = "";
    const e = $("div", "empty");
    e.appendChild($("div", "glyph", "🧭"));
    e.appendChild($("div", "big", "no runs to chart"));
    e.appendChild($("div", "sub", esc(state.degraded)));
    wrap.appendChild(e);
    prevState = new Map();
    return;
  }
  if (!runs.length && !recentRuns.length) {
    document.getElementById("fleet").textContent = "";
    document.getElementById("horizon").textContent = "";
    harbourEl.textContent = "";
    const e = $("div", "empty");
    e.appendChild($("div", "glyph", "⚓"));
    e.appendChild($("div", "big", "an empty harbour"));
    e.appendChild($("div", "sub", "The fleet is idle — no armed issues, open PRs, or recent voyages."));
    wrap.appendChild(e);
    prevState = new Map();
    return;
  }

  renderFleet(state, runs);
  // The horizon — the waiting-runs dependency graph (#111). Queued/held runs render
  // here as a graph, so pull them OUT of the in-flight voyage list below to avoid
  // double-listing them (only when the scheduler actually surfaces them as waiting).
  renderHorizon(state);
  const sched = state && state.scheduler;
  const waitingNums = new Set(((sched && sched.nodes) || []).filter((n) => n.waiting).map((n) => n.number));
  const flightRuns = runs.filter((r) => !(r.issueNumber != null && waitingNums.has(r.issueNumber) && groupOf(r) === "queued"));

  // Transitions across BOTH lanes: a run that merged this poll moves into the
  // harbour and earns the "just shipped ⚓" glow there.
  const events = detectTransitions([...runs, ...recentRuns]);

  if (flightRuns.length) {
    for (const run of sortRuns(flightRuns)) wrap.appendChild(renderRun(run));
  } else if (!waitingNums.size) {
    // Nothing under way and nothing waiting, but the harbour has recent arrivals.
    wrap.appendChild($("div", "lane-note", "No voyages under way — the fleet is idle. Recent arrivals below."));
  }
  renderHarbour(state, recentRuns);

  // flourish + optional chime for ship/block transitions (either lane)
  for (const ev of events) {
    const block = document.querySelector(`.run[data-key="${CSS.escape(ev.key)}"]`);
    if (ev.kind === "shipped" && block) block.classList.add("just-shipped");
    foghorn(ev.kind);
  }
}

// ---- live elapsed ticker (every second, independent of the 4s poll) -------
setInterval(() => {
  for (const el of document.querySelectorAll(".js-elapsed")) {
    const t = elapsedText(el.dataset.since);
    if (t != null) el.textContent = t;
  }
  // live in-flight cost estimate — climbs each second alongside elapsed (#115)
  for (const el of document.querySelectorAll(".js-estcost")) {
    const v = estFromSince(el.dataset.since);
    if (v != null) el.textContent = "~" + money(v);
  }
}, 1000);

// ---- polling --------------------------------------------------------------
let lastStamp = null;
let bootVersion = null;       // appVersion captured on the first successful load
let pendingVersion = null;    // a differing appVersion seen once — reload only if it persists (debounce)
async function poll() {
  try {
    const res = await fetch("./run-state.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const state = await res.json();
      // Auto-reload when a NEW dashboard version ships (SKILL §6). Capture the
      // boot version on first load; thereafter, if the snapshot carries a
      // DIFFERENT appVersion, reload to load the new UI — but only after the new
      // value repeats on a second consecutive poll (debounce), so a mid-deploy
      // snapshot can't thrash. If appVersion is absent (older driver) this is
      // inert: we never reload, and the app data-polls exactly as before.
      const ver = state.appVersion;
      if (ver == null) {
        // Absent stamp (older driver / unreadable app): fully inert — never reload,
        // and clear any pending debounce so a null gap can't stand in for a
        // consecutive confirming poll (reload needs two ACTUAL equal readings).
        pendingVersion = null;
      } else if (bootVersion == null) {
        bootVersion = ver;
      } else if (ver !== bootVersion) {
        if (pendingVersion === ver) { location.reload(); return; }
        pendingVersion = ver;
      } else pendingVersion = null;
      if (state.generatedAt !== lastStamp) { lastStamp = state.generatedAt; render(state); }
    }
  } catch (e) {
    const sub = document.getElementById("sub");
    if (sub && lastStamp == null) sub.textContent = "waiting for run-state.json …";
  }
}
poll();
setInterval(poll, 4000);
</script>
